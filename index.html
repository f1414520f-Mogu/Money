<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>共同記帳本</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4CAF50">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --sky: #6EC6FF;
    --sky-deep: #2f8fd1;
    --grass: #4CAF50;
    --grass-dark: #2e7d32;
    --dirt: #a15c2e;
    --dirt-dark: #6b3d1a;
    --panel: #fff3d6;
    --panel-dark: #e0b262;
    --panel-light: #fffdf5;
    --ink: #2b2620;
    --ink-soft: #6b5c44;
    --gold: #FFC107;
    --diamond: #26C6DA;
    --purple: #9C27B0;
    --pink: #FF6FA5;
    --danger: #E53935;
    --danger-dark: #b71c1c;
    --card: #fff8e6;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--sky);
    background-image: linear-gradient(180deg, var(--sky) 0%, var(--sky) 52%, var(--grass) 52%, var(--grass-dark) 100%);
    color: var(--ink);
    font-family: "Noto Sans TC","PingFang TC","Helvetica Neue",Arial,sans-serif;
    -webkit-tap-highlight-color: transparent;
    min-height:100vh;
    padding-bottom: 92px;
  }
  h1,h2,h3{ font-family: "Press Start 2P", monospace; letter-spacing: 0; }

  .bevel-out{
    border-style: solid; border-width: 3px;
    border-top-color: rgba(255,255,255,0.6); border-left-color: rgba(255,255,255,0.6);
    border-right-color: rgba(0,0,0,0.35); border-bottom-color: rgba(0,0,0,0.35);
    box-shadow: 0 3px 0 rgba(0,0,0,0.22);
  }

  /* ---------- 登入 ---------- */
  #lockScreen{
    position: fixed; inset:0; z-index: 100;
    background: linear-gradient(180deg, var(--sky) 0%, var(--sky) 48%, var(--grass) 48%, var(--grass-dark) 100%);
    display:flex; align-items:center; justify-content:center; padding: 24px;
  }
  .lock-card{ background: var(--panel); border-radius: 6px; padding: 30px 22px; width: 100%; max-width: 320px; text-align:center; }
  .lock-mark{ width:60px; height:60px; margin:0 auto 16px; background: var(--purple); border: 3px solid #6a1b7a; display:flex; align-items:center; justify-content:center; color:#fff; font-size: 26px; }
  .lock-card h2{ margin: 0 0 16px; font-size: 14px; color: var(--ink); line-height:1.9; }
  .lock-card input{ text-align:center; letter-spacing: 3px; }
  #lockStatus{ min-height: 18px; font-size: 12px; margin-top: 10px; color: var(--danger); font-family:"Press Start 2P",monospace; }

  #app{ display:none; }
  #app.unlocked{ display:block; }

  /* ---------- Header ---------- */
  header{
    position: sticky; top:0; z-index:10;
    background: linear-gradient(180deg, rgba(47,143,209,0.92), rgba(31,105,158,0.95)), var(--header-photo, none);
    background-size: cover; background-position: center;
    color:#fff; padding: 14px 12px 12px; border-bottom: 4px solid var(--dirt-dark);
  }
  .header-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px; }
  header .eyebrow{ font-size: 8.5px; letter-spacing: 1px; opacity: 0.9; margin-bottom: 5px; }
  header h1{ margin:0; font-size: 13px; line-height:1.7; }
  .icon-btn{
    width: 38px; height: 38px; background: var(--gold); color: var(--ink);
    border-color: #fff3ab #a5822a #a5822a #fff3ab; border-style:solid; border-width:3px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:17px;
  }

  .player-strip{ display:flex; gap:8px; }
  .player-card{
    flex:1; background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.3);
    border-radius: 6px; padding: 8px 6px 10px; text-align:center; position:relative; overflow:hidden;
  }
  .player-title{ font-size: 8px; color: var(--gold); margin-bottom: 4px; min-height: 11px; text-shadow: 1px 1px 0 rgba(0,0,0,0.7); }
  .avatar-wrap{ width: 72px; height: 100px; margin: 0 auto 4px; }
  .avatar-wrap svg{ width:100%; height:100%; }
  .player-name{ font-size: 11px; font-weight:900; margin-bottom: 4px; }
  .player-amt{ font-family:"Press Start 2P",monospace; font-size: 12px; color: var(--gold); text-shadow: 1px 1px 0 rgba(0,0,0,0.6); }
  .player-amt-label{ font-size: 8.5px; opacity:0.85; margin-top:4px; }

  main{ max-width: 480px; margin: 0 auto; padding: 16px 12px; }

  .card{ background: var(--card); border-color: var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light); border-style:solid; border-width:3px; border-radius:4px; padding: 16px; margin-bottom: 14px; }
  .card h2{ margin: 0 0 14px; font-size: 13px; color: var(--ink); line-height: 1.7; display:flex; align-items:center; gap:8px; }
  .card h2 .idx{ font-size:11px; background: var(--purple); color:#fff; width:22px; height:22px; border-radius:4px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

  .mode-switch{ display:flex; gap:6px; margin-bottom: 16px; }
  .mode-switch button{
    flex:1; padding: 11px 4px; font-size: 12px; font-weight:900; cursor:pointer;
    background: var(--panel); color: var(--ink-soft); border-radius:4px;
    border-color: var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light); border-style:solid; border-width:2px;
    font-family: "Noto Sans TC",sans-serif;
  }
  .mode-switch button.active{ background: var(--grass); color:#fff; border-color: #8fe36a var(--grass-dark) var(--grass-dark) #8fe36a; }

  label{ display:block; font-size: 12.5px; color: var(--ink-soft); margin: 13px 0 5px; font-weight:900; }
  label:first-of-type{ margin-top:0; }
  input, select{
    width: 100%; padding: 12px 12px; font-size: 16px; border-radius:4px;
    border-color: var(--panel-dark) var(--panel-light) var(--panel-light) var(--panel-dark);
    border-style: solid; border-width: 2px; background: #fffef8; color: var(--ink); font-family: inherit;
  }
  select{ appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%); background-position: calc(100% - 18px) center, calc(100% - 13px) center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  input:focus, select:focus{ outline: 2px solid var(--sky-deep); }
  input:disabled{ opacity: 0.5; background: #eee; }

  button.primary{
    width:100%; margin-top: 16px; padding: 15px; font-size:13px; font-weight:900; border-radius:4px;
    background: var(--grass); color:#fff; cursor:pointer; font-family:"Noto Sans TC",sans-serif;
    border-color: #8fe36a var(--grass-dark) var(--grass-dark) #8fe36a; border-style:solid; border-width:3px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.25);
  }
  button.primary:active{ transform: translateY(2px); box-shadow:none; }
  button.primary:disabled{ opacity: 0.45; }
  button.primary.repay-mode{ background: var(--gold); border-color: #fff3ab #a5822a #a5822a #fff3ab; color: var(--ink); }
  button.secondary{
    width:100%; margin-top: 10px; padding: 13px; font-size:12px; font-weight:900; border-radius:4px;
    background: var(--panel); color: var(--danger); cursor:pointer;
    border-color: var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light); border-style:solid; border-width:2px;
  }
  button.ghost{ width:100%; margin-top: 8px; padding: 11px; background:none; color: var(--ink-soft); font-size:12px; font-weight:700; border:none; cursor:pointer; }
  button.logout-in-menu{ width:100%; margin-top: 18px; padding: 13px; background: var(--danger); color:#fff; font-size:12px; font-weight:900; border-radius:4px; cursor:pointer; border-color: #ff7a70 var(--danger-dark) var(--danger-dark) #ff7a70; border-style:solid; border-width:2px; }

  .status{ font-size: 12px; margin-top: 10px; min-height: 15px; font-weight:800; }
  .status.error{ color: var(--danger); }
  .status.ok{ color: var(--grass-dark); }

  .month-block{ margin-bottom: 16px; }
  .month-head{ display:flex; justify-content: space-between; align-items:baseline; font-size: 11.5px; font-weight:900; color: var(--ink); border-bottom: 2px dashed var(--panel-dark); padding-bottom: 8px; margin-bottom: 8px; }
  .person-row{ display:flex; justify-content: space-between; font-size: 13px; padding: 4px 0; color: var(--ink-soft); }
  .person-row .amt{ font-variant-numeric: tabular-nums; color: var(--ink); font-weight:800; }
  .items{ margin: 6px 0 8px 0; padding-left: 0; list-style:none; }
  .items li{ display:flex; justify-content:space-between; font-size:12.5px; align-items:center; padding: 8px 8px 8px 10px; color: var(--ink-soft); border-left: 3px solid var(--panel-dark); cursor:pointer; margin-bottom:4px; background: rgba(255,255,255,0.5); border-radius:3px; }
  .items li:active{ background: rgba(255,255,255,0.85); }
  .items li.repayment{ border-left-color: var(--gold); }
  .items li .tag{ font-size:9px; padding:2px 6px; margin-right:5px; background: var(--gold); color:#5e4a10; font-weight:900; border-radius:3px; }
  .items li .date{ color: #96876a; margin-right: 6px; font-variant-numeric: tabular-nums; }

  .empty{ font-size: 13px; color: var(--ink-soft); text-align:center; padding: 30px 0; font-weight:700; }
  .skeleton{ padding: 4px 0; }
  .skeleton-line{ height: 14px; margin-bottom: 10px; border-radius:3px; background: linear-gradient(90deg, var(--panel-dark) 25%, var(--panel-light) 37%, var(--panel-dark) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
  @keyframes shimmer{ 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }

  canvas{ max-height: 280px; }

  .sub-tabs{ display:flex; gap:6px; margin-bottom: 16px; }
  .sub-tabs button{ flex:1; padding: 10px 2px; font-size: 11px; font-weight:900; cursor:pointer; border-radius:4px; background: var(--panel); color: var(--ink-soft); border-color: var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light); border-style:solid; border-width:2px; font-family:"Noto Sans TC",sans-serif; }
  .sub-tabs button.active{ background: var(--sky-deep); color:#fff; }
  .sub-view{ display:none; }
  .sub-view.active{ display:block; }

  .person-select-row{ display:flex; gap:6px; margin-bottom: 14px; }
  .person-select-row button{ flex:1; padding: 9px 4px; font-size: 12px; font-weight:900; cursor:pointer; border-radius:4px; background: var(--panel); color: var(--ink-soft); border-color: var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light); border-style:solid; border-width:2px; }
  .person-select-row button.active{ background: var(--purple); color:#fff; }

  .title-list{ display:flex; flex-direction:column; gap:8px; }
  .title-row{ display:flex; align-items:center; gap:10px; padding: 11px; background: rgba(255,255,255,0.55); border: 2px solid var(--panel-dark); border-radius:4px; }
  .title-row.locked{ opacity: 0.45; }
  .title-row.active-title{ border-color: var(--gold); background: rgba(255,193,7,0.25); }
  .title-check{ width: 20px; height:20px; border:2px solid var(--ink-soft); border-radius:4px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; cursor:pointer; background:#fff; }
  .title-check.checked{ background: var(--gold); border-color:#a5822a; }
  .title-info .name{ font-size: 13px; font-weight:900; }
  .title-info .req{ font-size: 11px; color: var(--ink-soft); }

  .level-box{ background: rgba(255,255,255,0.55); border:2px solid var(--panel-dark); border-radius:4px; padding: 18px; text-align:center; margin-bottom:14px; }
  .level-num{ font-family:"Press Start 2P",monospace; font-size: 28px; color: var(--purple); margin-bottom:4px; }
  .level-stage{ font-size: 12px; color: var(--ink-soft); margin-bottom: 10px; font-weight:700; }
  .xp-bar-outer{ height: 20px; background: var(--panel-dark); border: 2px solid var(--ink); border-radius:4px; overflow:hidden; }
  .xp-bar-inner{ height:100%; background: linear-gradient(90deg, #FFD54F, var(--gold)); }
  .xp-label{ font-size: 11.5px; color: var(--ink-soft); margin-top: 8px; font-weight:700; }

  .equip-preview{ text-align:center; margin-bottom: 16px; }
  .equip-preview .avatar-wrap{ width: 110px; height: 150px; }
  .equip-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .equip-slot{ background: rgba(255,255,255,0.55); border: 2px solid var(--panel-dark); border-radius:4px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; padding: 10px 4px; cursor:pointer; position:relative; }
  .equip-slot.locked{ opacity:0.4; cursor:default; }
  .equip-slot.equipped{ border-color: var(--gold); background: rgba(255,193,7,0.3); }
  .equip-icon{ width: 26px; height:26px; }
  .equip-name{ font-size: 11px; font-weight:800; }
  .equip-req{ font-size: 9.5px; color: var(--ink-soft); text-align:center; }
  .equip-check{ position:absolute; top:3px; right:5px; font-size:12px; color: var(--grass-dark); }
  .equip-all-btn{ width:100%; margin-bottom: 14px; padding: 11px; font-size:12px; font-weight:900; background: var(--diamond); color:#093c44; border-radius:4px; border-color:#a6ecf5 #0e7c8c #0e7c8c #a6ecf5; border-style:solid; border-width:2px; cursor:pointer; }

  nav.tabs{ position: fixed; bottom:0; left:0; right:0; z-index: 10; display:flex; background: var(--panel); border-top: 3px solid var(--panel-dark); }
  nav.tabs button{ flex:1; padding: 11px 2px 10px; background: none; border:none; font-size: 10px; color: var(--ink-soft); cursor:pointer; font-family:"Noto Sans TC",sans-serif; font-weight:800; }
  nav.tabs button svg{ display:block; margin: 0 auto 3px; width:20px; height:20px; }
  nav.tabs button.active{ color: var(--purple); }
  nav.tabs button.active svg{ stroke: var(--purple); }

  .view{ display:none; }
  .view.active{ display:block; }

  .setup-warning{ background: #fbe2de; color: var(--danger); border: 2px solid var(--danger); border-radius:4px; padding: 12px 13px; font-size: 12.5px; margin-bottom: 14px; font-weight:700; }

  .overlay{ position: fixed; inset:0; z-index: 90; background: rgba(20,15,10,0.6); display:none; align-items:flex-end; justify-content:center; }
  .overlay.show{ display:flex; }
  .sheet{ background: var(--card); width:100%; max-width: 480px; padding: 20px 18px 26px; border-top: 4px solid var(--panel-dark); border-radius: 12px 12px 0 0; max-height: 90vh; overflow-y:auto; }
  .sheet h3{ margin:0 0 14px; font-size: 13px; color: var(--ink); }
  .edit-status{ font-size:12px; min-height:15px; margin-top:8px; font-weight:800; }

  .zodiac-badge{ display:inline-block; margin-top:8px; font-size: 12px; background: var(--diamond); color:#0a3a44; padding: 5px 11px; font-weight:900; border-radius:4px; }
  .profile-block{ padding: 16px 0; border-bottom: 3px dashed var(--panel-dark); }
  .profile-block:last-of-type{ border-bottom:none; }
  .profile-head{ display:flex; align-items:center; gap:12px; margin-bottom: 6px; }
  .profile-head .avatar-wrap{ width: 56px; height: 76px; flex-shrink:0; }
  .profile-head .ptitle{ font-size: 13px; font-weight:900; }
  .field-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-card bevel-out">
    <div class="lock-mark">▦</div>
    <h2>共同記帳本<br>請輸入密碼</h2>
    <input type="password" id="lockPassword" placeholder="密碼" />
    <button class="primary" id="lockSubmit">進入世界</button>
    <div id="lockStatus"></div>
  </div>
</div>

<div id="app">
<header>
  <div class="header-top">
    <div>
      <div class="eyebrow">共同記帳本</div>
      <h1>大家的帳<br>一起結</h1>
    </div>
    <button class="icon-btn bevel-out" id="settingsBtn" title="人員設定">⚙</button>
  </div>
  <div class="player-strip" id="playerStrip"></div>
</header>

<main>

  <div id="setupWarning" class="setup-warning" style="display:none;">
    ⚠️ 尚未設定 Apps Script 網址，請打開這個檔案的原始碼，把最上面 CONFIG.WEB_APP_URL 換成你部署後拿到的網址。
  </div>

  <section id="view-add" class="view active">
    <div class="card bevel-out">
      <h2><span class="idx">1</span>新增紀錄</h2>
      <div class="mode-switch">
        <button id="modeExpenseBtn" class="active">支出記帳</button>
        <button id="modeRepayBtn">現金入帳</button>
      </div>

      <div id="expenseFields">
        <label for="inputPerson">記帳人員</label>
        <select id="inputPerson"></select>
        <label for="inputDate">日期</label>
        <input type="date" id="inputDate" />
        <label for="inputItem">項目名目</label>
        <input id="inputItem" placeholder="例如：晚餐、水電費" autocomplete="off" />
        <label for="inputAmount">金額</label>
        <input id="inputAmount" type="number" inputmode="decimal" placeholder="0" />
      </div>

      <div id="repayFields" style="display:none;">
        <label for="repayPerson">要還給誰？</label>
        <select id="repayPerson"><option value="">請先選擇要還給誰</option></select>
        <label for="repayDate">日期</label>
        <input type="date" id="repayDate" />
        <label for="repayAmount">還款金額</label>
        <input id="repayAmount" type="number" inputmode="decimal" placeholder="請先選擇要還給誰" disabled />
        <label for="repayNote">備註(選填)</label>
        <input id="repayNote" placeholder="例如：發薪日撥入" autocomplete="off" />
      </div>

      <button class="primary" id="submitBtn">送出記帳</button>
      <div class="status" id="submitStatus"></div>
    </div>
  </section>

  <section id="view-ledger" class="view">
    <div class="card bevel-out">
      <h2><span class="idx">2</span>月結明細</h2>
      <p style="font-size:12px;color:var(--ink-soft);margin:-6px 0 12px;font-weight:700;">點任一筆紀錄可以修改或刪除</p>
      <div id="ledgerBody">
        <div class="skeleton"><div class="skeleton-line" style="width:60%"></div><div class="skeleton-line" style="width:90%"></div><div class="skeleton-line" style="width:75%"></div></div>
      </div>
    </div>
  </section>

  <section id="view-chart" class="view">
    <div class="card bevel-out">
      <h2><span class="idx">3</span>金流圖表</h2>
      <select id="chartType" style="margin-bottom:14px;">
        <option value="line">折線圖(每月總額趨勢)</option>
        <option value="bar">長條圖(每月總額趨勢)</option>
        <option value="pie">圓餅圖(各人員佔比)</option>
      </select>
      <canvas id="mainChart"></canvas>
    </div>
  </section>

  <section id="view-achieve" class="view">
    <div class="sub-tabs">
      <button class="sub-tab-btn active" data-sub="sub-trophy">🏆 獎盃</button>
      <button class="sub-tab-btn" data-sub="sub-level">⭐ 等級</button>
      <button class="sub-tab-btn" data-sub="sub-equip">🛡 裝備</button>
    </div>
    <div class="person-select-row" id="achievePersonRow"></div>

    <div id="sub-trophy" class="sub-view active card bevel-out">
      <h2><span class="idx">🏆</span>稱號收藏</h2>
      <div class="title-list" id="titleList"></div>
    </div>

    <div id="sub-level" class="sub-view card bevel-out">
      <h2><span class="idx">⭐</span>累積等級</h2>
      <div class="level-box" id="levelBox"></div>
    </div>

    <div id="sub-equip" class="sub-view card bevel-out">
      <h2><span class="idx">🛡</span>裝備收藏</h2>
      <div class="equip-preview"><div class="avatar-wrap" id="equipPreviewAvatar"></div></div>
      <button class="equip-all-btn" id="equipAllBtn">一鍵全部穿上</button>
      <div class="equip-grid" id="equipGrid"></div>
    </div>
  </section>

</main>

<nav class="tabs">
  <button class="tab-btn active" data-view="view-add">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>記帳
  </button>
  <button class="tab-btn" data-view="view-ledger">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>月結明細
  </button>
  <button class="tab-btn" data-view="view-chart">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M11 19V5M18 19v-7"/></svg>圖表
  </button>
  <button class="tab-btn" data-view="view-achieve">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4ZM7 6H4a2 2 0 0 0 2 4M17 6h3a2 2 0 0 1-2 4"/></svg>成就

// ---------- 遊戲化規則 ----------
const TITLE_THRESHOLDS = [
  { amount: 10000, name: "貢獻萌新" }, { amount: 50000, name: "貢獻勇者" },
  { amount: 100000, name: "貢獻大師" }, { amount: 150000, name: "終點還是起點?" },

];
const EQUIPMENT_ITEMS = [
  { amount: 10000, name: "內褲", color: "#f2f2f2" },
  { amount: 30000, name: "襪子", color: "#e8e8e8" },
  { amount: 50000, name: "內衣", color: "#fdf6d8" },

function unlockedEquipmentThresholds(cumulative){ return EQUIPMENT_ITEMS.filter(i => cumulative >= i.amount).map(i => i.amount); }
function nextEquipmentItem(cumulative){ return EQUIPMENT_ITEMS.find(i => cumulative < i.amount) || null; }
function unlockedTitles(cumulative){ return TITLE_THRESHOLDS.filter(t => cumulative >= t.amount); }

function zodiacOf(m, d){
  const ranges = [
    { sign:"摩羯座", start:[12,22], end:[1,19] }, { sign:"水瓶座", start:[1,20], end:[2,18] },
    { sign:"雙魚座", start:[2,19], end:[3,20] }, { sign:"牡羊座", start:[3,21], end:[4,19] },
    { sign:"金牛座", start:[4,20], end:[5,20] }, { sign:"雙子座", start:[5,21], end:[6,21] },
    { sign:"巨蟹座", start:[6,22], end:[7,22] }, { sign:"獅子座", start:[7,23], end:[8,22] },
    { sign:"處女座", start:[8,23], end:[9,22] }, { sign:"天秤座", start:[9,23], end:[10,23] },
    { sign:"天蠍座", start:[10,24], end:[11,21] }, { sign:"射手座", start:[11,22], end:[12,21] }
  ];
  for (const r of ranges){
    const [sm,sd]=r.start, [em,ed]=r.end;
    if (sm<=em){ if((m===sm&&d>=sd)||(m===em&&d<=ed)||(m>sm&&m<em)) return r.sign; }
    else { if((m===sm&&d>=sd)||(m===em&&d<=ed)) return r.sign; }
  }
  return "摩羯座";
}

// ---------- 等級/年齡/外觀階段 ----------
function levelFor(cumulative){ return Math.floor(cumulative / 10000); }
function ageFor(cumulative){ return levelFor(cumulative) * 3; }
function stageFor(age){
  if (age <= 2) return "baby";
  if (age <= 11) return "child";
  if (age <= 17) return "teen";
  if (age <= 59) return "adult";
  return "elder";
}
const STAGE_LABEL = { baby:"寶寶", child:"孩童", teen:"青少年", adult:"成人", elder:"長者" };
const STAGE_PROPORTIONS = {
  baby:  { headW:36, headH:32, headY:16, torsoW:26, torsoH:22, torsoY:44, legW:11, legH:16, legY:64, armW:9, armH:18, armY:46 },
  child: { headW:28, headH:26, headY:8,  torsoW:26, torsoH:34, torsoY:32, legW:10, legH:34, legY:64, armW:8, armH:32, armY:34 },
  teen:  { headW:24, headH:23, headY:6,  torsoW:28, torsoH:40, torsoY:28, legW:11, legH:46, legY:67, armW:8, armH:40, armY:30 },
  adult: { headW:22, headH:22, headY:5,  torsoW:30, torsoH:44, torsoY:26, legW:12, legH:52, legY:69, armW:9, armH:46, armY:28 },
  elder: { headW:22, headH:22, headY:7,  torsoW:27, torsoH:40, torsoY:29, legW:12, legH:48, legY:69, armW:9, armH:42, armY:31 }
};

// ---------- 全身像素角色 SVG 產生器 ----------
function rectTag(x,y,w,h,fill,extra){ return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="#5a3a22" stroke-width="1" ${extra||""}/>`; }

function hairSVG(profile, headX, headY, headW, headH, hairColor){
  let style = profile.hairstyle;
  if (!style || style === "auto") style = profile.gender === "female" ? "long" : "short";
  if (style === "bald") return "";
  if (style === "long") return rectTag(headX-2, headY-2, headW+4, headH*0.95, hairColor);
  if (style === "ponytail") return rectTag(headX-1, headY-2, headW+2, headH*0.35, hairColor) + rectTag(headX+headW-2, headY+headH*0.15, 4, headH*0.75, hairColor);
  return rectTag(headX-1, headY-2, headW+2, headH*0.35, hairColor); // short
}
function eyesSVG(style, headX, headY, headW, headH){
  const cy = headY + headH*0.42, r = Math.max(1.4, headW*0.06);
  const cx1 = headX+headW*0.32, cx2 = headX+headW*0.68;
  if (style === "happy") return `<path d="M${cx1-2},${cy} q2,-3 4,0" stroke="#2b2620" stroke-width="1.4" fill="none"/><path d="M${cx2-2},${cy} q2,-3 4,0" stroke="#2b2620" stroke-width="1.4" fill="none"/>`;
  if (style === "sleepy") return `<rect x="${cx1-2}" y="${cy}" width="4" height="1.4" fill="#2b2620"/><rect x="${cx2-2}" y="${cy}" width="4" height="1.4" fill="#2b2620"/>`;
  return `<circle cx="${cx1}" cy="${cy}" r="${r}" fill="#2b2620"/><circle cx="${cx2}" cy="${cy}" r="${r}" fill="#2b2620"/>`;
}
function mouthSVG(style, headX, headY, headW, headH){
  const cy = headY + headH*0.72, cx = headX+headW*0.5;
  if (style === "open") return `<ellipse cx="${cx}" cy="${cy}" rx="3" ry="2.2" fill="#8b3a2b"/>`;
  if (style === "neutral") return `<rect x="${cx-3}" y="${cy}" width="6" height="1.4" fill="#8b3a2b"/>`;
  return `<path d="M${cx-3.5},${cy} q3.5,3.5 7,0" stroke="#8b3a2b" stroke-width="1.5" fill="none"/>`; // smile
}
function equipmentSVG(name, b){
  switch(name){
    case "內褲": return rectTag(b.torsoX, b.torsoY + b.torsoH*0.66, b.torsoW, b.torsoH*0.3, "#ffffff");
    case "襪子": return rectTag(b.leg1X, b.legY+b.legH*0.62, b.legW, b.legH*0.38, "#eeeeee")+rectTag(b.leg2X, b.legY+b.legH*0.62, b.legW, b.legH*0.38, "#eeeeee");
    case "內衣": return rectTag(b.torsoX, b.torsoY, b.torsoW, b.torsoH*0.5, "#fdf6d8");
    case "手套": return rectTag(b.armLX, b.armY+b.armH*0.78, b.armW, b.armH*0.22, "#c0392b")+rectTag(b.armRX, b.armY+b.armH*0.78, b.armW, b.armH*0.22, "#c0392b");
    case "長褲": return rectTag(b.leg1X, b.legY, b.legW, b.legH*0.72, "#34495e")+rectTag(b.leg2X, b.legY, b.legW, b.legH*0.72, "#34495e");
    case "T恤": return rectTag(b.torsoX-1, b.torsoY, b.torsoW+2, b.torsoH*0.72, "#2980b9");
    case "鞋子": return rectTag(b.leg1X-1, b.legY+b.legH-6, b.legW+2, 8, "#5a3a22")+rectTag(b.leg2X-1, b.legY+b.legH-6, b.legW+2, 8, "#5a3a22");
    case "外套": return `<rect x="${b.torsoX-3}" y="${b.torsoY-1}" width="${b.torsoW+6}" height="${b.torsoH*0.86}" fill="#9C27B0" fill-opacity="0.9" stroke="#5b2d70" stroke-width="1"/>`;
    case "帽子": return `<rect x="${b.headX-2}" y="${b.headY-7}" width="${b.headW+4}" height="10" fill="#16a085" stroke="#0e6655" stroke-width="1"/>`;
    case "兔耳帽": return `<rect x="${b.headX+2}" y="${b.headY-20}" width="5" height="18" fill="#FF6FA5" stroke="#c96f96" stroke-width="1"/><rect x="${b.headX+b.headW-7}" y="${b.headY-20}" width="5" height="18" fill="#FF6FA5" stroke="#c96f96" stroke-width="1"/>`;
    case "魔法手杖": return `<g transform="rotate(20 ${b.armRX} ${b.armY})"><rect x="${b.armRX+2}" y="${b.armY-8}" width="3" height="${b.armH+12}" fill="#f1c40f" stroke="#a5822a" stroke-width="1"/></g>`;
    case "皇冠": return `<polygon points="${b.headX-1},${b.headY-2} ${b.headX+b.headW*0.25},${b.headY-9} ${b.headX+b.headW*0.5},${b.headY-2} ${b.headX+b.headW*0.75},${b.headY-9} ${b.headX+b.headW+1},${b.headY-2}" fill="#f7d716" stroke="#a5822a" stroke-width="1"/>`;
    default: return "";
  }
}
function renderAvatarSVG(profile, cumulative){
  const stage = stageFor(ageFor(cumulative));
  const p = STAGE_PROPORTIONS[stage];
  const bodyMult = { slim:0.85, regular:1, broad:1.18 }[profile.bodyType || "regular"];
  const torsoW = p.torsoW * bodyMult, armW = p.armW * bodyMult;
  const centerX = 50;
  const headX = centerX - p.headW/2, torsoX = centerX - torsoW/2;
  const legGap = 2, leg1X = centerX - p.legW - legGap/2, leg2X = centerX + legGap/2;
  const armLX = torsoX - armW - 1, armRX = torsoX + torsoW + 1;
  const skin = profile.gender === "female" ? "#f3c9a0" : "#f0c090";
  const hairColor = stage === "elder" ? "#c7c7c7" : "#4a3222";

  const b = { torsoX, torsoY:p.torsoY, torsoW, torsoH:p.torsoH, headX, headY:p.headY, headW:p.headW, headH:p.headH, leg1X, leg2X, legY:p.legY, legW:p.legW, legH:p.legH, armLX, armRX, armY:p.armY, armW, armH:p.armH };

  let svg = `<svg viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg">`;
  svg += rectTag(leg1X, p.legY, p.legW, p.legH, skin) + rectTag(leg2X, p.legY, p.legW, p.legH, skin);
  svg += rectTag(armLX, p.armY, armW, p.armH, skin) + rectTag(armRX, p.armY, armW, p.armH, skin);
  svg += rectTag(torsoX, p.torsoY, torsoW, p.torsoH, skin);
  const headRadius = profile.faceShape === "round" ? p.headW/2 : (profile.faceShape === "square" ? 2 : 6);
  svg += `<rect x="${headX}" y="${p.headY}" width="${p.headW}" height="${p.headH}" rx="${headRadius}" fill="${skin}" stroke="#7a5230" stroke-width="1.5"/>`;
  svg += hairSVG(profile, headX, p.headY, p.headW, p.headH, hairColor);
  svg += eyesSVG(profile.eyeStyle, headX, p.headY, p.headW, p.headH);
  svg += mouthSVG(profile.mouthStyle, headX, p.headY, p.headW, p.headH);
  const equipped = profile.equippedItems || [];
  EQUIPMENT_ITEMS.forEach(item => { if (equipped.includes(item.amount)) svg += equipmentSVG(item.name, b); });
  svg += `</svg>`;
  return svg;
}

// ---------- 全域狀態 ----------
let allRecords = [];
let profiles = [];
let chartInstance = null;
let sessionKey = null;
let editingId = null;
let achievePersonName = null;

// ---------- 登入 ----------
function initLogin(){
  const saved = localStorage.getItem("ledger_key");
  if (saved === CONFIG.APP_PASSWORD){ unlock(saved); return; }
  document.getElementById("lockSubmit").addEventListener("click", tryLogin);
  document.getElementById("lockPassword").addEventListener("keydown", e => { if (e.key === "Enter") tryLogin(); });
}
function tryLogin(){
  const val = document.getElementById("lockPassword").value;
  const statusEl = document.getElementById("lockStatus");
  if (val !== CONFIG.APP_PASSWORD){ statusEl.textContent = "密碼錯誤"; return; }
  statusEl.textContent = "";
  localStorage.setItem("ledger_key", val);
  unlock(val);
}
function unlock(key){
  sessionKey = key;
  document.getElementById("lockScreen").style.display = "none";
  document.getElementById("app").classList.add("unlocked");
  boot();
}
document.getElementById("logoutBtn").addEventListener("click", () => { localStorage.removeItem("ledger_key"); location.reload(); });

// ---------- 工具 ----------
function fmt(n){ return "$" + Math.round(n).toLocaleString("zh-TW"); }
function monthKeyOf(date){ return `${date.getFullYear()}-${(date.getMonth()+1).toString().padStart(2,"0")}`; }
function dateLabel(date){ return `${(date.getMonth()+1).toString().padStart(2,"0")}/${date.getDate().toString().padStart(2,"0")}`; }
function toDateInputValue(date){ return date.toISOString().slice(0,10); }
function personNames(){ return profiles.map(p => p.name); }
function populateSelect(el, includeEmpty){ el.innerHTML = (includeEmpty ? '<option value="">請先選擇要還給誰</option>' : "") + personNames().map(p => `<option value="${p}">${p}</option>`).join(""); }
function setDefaultDates(){ const t = toDateInputValue(new Date()); document.getElementById("inputDate").value = t; document.getElementById("repayDate").value = t; }

// ---------- 讀取資料 ----------
async function loadRecords(){
  if (!CONFIG.WEB_APP_URL || CONFIG.WEB_APP_URL.indexOf("PASTE_YOUR") === 0){
    document.getElementById("setupWarning").style.display = "block";
    document.getElementById("ledgerBody").innerHTML = '<div class="empty">尚未連接資料來源</div>';
    return;
  }
  try{
    const url = CONFIG.WEB_APP_URL + "?key=" + encodeURIComponent(sessionKey);
    const res = await fetch(url, { method: "GET" });
    const json = await res.json();
    if (json.status !== "success") throw new Error(json.message || "讀取失敗");
    allRecords = json.data.map(r => ({ id:r.id, timestamp:new Date(r.timestamp), person:r.person, item:r.item, amount:Number(r.amount), type:r.type||"expense" })).sort((a,b)=>a.timestamp-b.timestamp);
    profiles = json.profiles || [];
    if (!achievePersonName && profiles.length) achievePersonName = profiles[0].name;
    renderAll();
  } catch(err){
    document.getElementById("ledgerBody").innerHTML = `<div class="empty">讀取失敗：${err.message}</div>`;
  }
}
function renderAll(){
  renderPersonSelects(); renderPlayerStrip(); renderLedger(); renderChart(); renderAchievePersonRow(); renderAchieveContent();
}
function renderPersonSelects(){
  populateSelect(document.getElementById("inputPerson"), false);
  populateSelect(document.getElementById("repayPerson"), true);
  populateSelect(document.getElementById("editPerson"), false);
}

// ---------- 貢獻計算 ----------
function cumulativeContribution(name){ return allRecords.filter(r=>r.person===name && r.type==="expense").reduce((s,r)=>s+r.amount,0); }
function repaidTotal(name){ return allRecords.filter(r=>r.person===name && r.type==="repayment").reduce((s,r)=>s+r.amount,0); }
function outstandingBalance(name){ return cumulativeContribution(name) - repaidTotal(name); }

// ---------- Header 人物欄 ----------
function renderPlayerStrip(){
  const strip = document.getElementById("playerStrip");
  strip.innerHTML = profiles.map(p => {
    const cumulative = cumulativeContribution(p.name);
    const outstanding = outstandingBalance(p.name);
    const titleObj = TITLE_THRESHOLDS.find(t => t.name === p.activeTitle && cumulative >= t.amount);
    return `
      <div class="player-card">
        <div class="player-title">${titleObj ? "「"+titleObj.name+"」" : "尚無稱號"}</div>
        <div class="avatar-wrap">${renderAvatarSVG(p, cumulative)}</div>
        <div class="player-name">${p.name}</div>
        <div class="player-amt">${fmt(outstanding)}</div>
        <div class="player-amt-label">貢獻總額(未歸還)</div>
      </div>`;
  }).join("");
}

// ---------- 記帳模式 ----------
let currentMode = "expense";
document.getElementById("modeExpenseBtn").addEventListener("click", () => setMode("expense"));
document.getElementById("modeRepayBtn").addEventListener("click", () => setMode("repay"));
function setMode(mode){
  currentMode = mode;
  document.getElementById("modeExpenseBtn").classList.toggle("active", mode==="expense");
  document.getElementById("modeRepayBtn").classList.toggle("active", mode==="repay");
  document.getElementById("expenseFields").style.display = mode==="expense" ? "block" : "none";
  document.getElementById("repayFields").style.display = mode==="repay" ? "block" : "none";
  const btn = document.getElementById("submitBtn");
  btn.textContent = mode==="expense" ? "送出記帳" : "送出還款";
  btn.classList.toggle("repay-mode", mode==="repay");
  document.getElementById("submitStatus").textContent = "";
}
document.getElementById("repayPerson").addEventListener("change", e => {
  const amountEl = document.getElementById("repayAmount");
  if (e.target.value){ amountEl.disabled=false; amountEl.placeholder="0"; amountEl.focus(); }
  else { amountEl.disabled=true; amountEl.placeholder="請先選擇要還給誰"; amountEl.value=""; }
});

async function submitRecord(){ return currentMode==="expense" ? submitExpense() : submitRepay(); }
async function submitExpense(){
  const person=document.getElementById("inputPerson").value, date=document.getElementById("inputDate").value;
  const item=document.getElementById("inputItem").value.trim(), amount=parseFloat(document.getElementById("inputAmount").value);
  const statusEl=document.getElementById("submitStatus");
  if (!person||!date||!item||isNaN(amount)){ statusEl.textContent="請完整填寫人員、日期、名目、金額"; statusEl.className="status error"; return; }
  await postAndReload({action:"create",person,item,amount,date}, statusEl, () => {
    document.getElementById("inputItem").value=""; document.getElementById("inputAmount").value=""; setDefaultDates();
  });
}
async function submitRepay(){
  const person=document.getElementById("repayPerson").value, date=document.getElementById("repayDate").value;
  const amount=parseFloat(document.getElementById("repayAmount").value), note=document.getElementById("repayNote").value.trim();
  const statusEl=document.getElementById("submitStatus");
  if (!person){ statusEl.textContent="請先選擇要還給誰"; statusEl.className="status error"; return; }
  if (!date||isNaN(amount)){ statusEl.textContent="請填寫日期與金額"; statusEl.className="status error"; return; }
  await postAndReload({action:"repay",person,amount,date,note}, statusEl, () => {
    document.getElementById("repayPerson").value=""; document.getElementById("repayAmount").value="";
    document.getElementById("repayAmount").disabled=true; document.getElementById("repayAmount").placeholder="請先選擇要還給誰";
    document.getElementById("repayNote").value=""; setDefaultDates();
  });
}
async function postAndReload(payload, statusEl, onSuccess){
  const btn=document.getElementById("submitBtn");
  btn.disabled=true; statusEl.textContent="送出中…"; statusEl.className="status";
  try{
    const res=await fetch(CONFIG.WEB_APP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:sessionKey,...payload})});
    const json=await res.json();
    if (json.status!=="success") throw new Error(json.message||"寫入失敗");
    statusEl.textContent="已記錄！"; statusEl.className="status ok";
    onSuccess(); await loadRecords();
  } catch(err){ statusEl.textContent="送出失敗："+err.message; statusEl.className="status error"; }
  finally{ btn.disabled=false; }
}

// ---------- 編輯 / 刪除 ----------
function openEdit(id){
  const record=allRecords.find(r=>r.id===id); if(!record) return;
  editingId=id;
  document.getElementById("editTitle").textContent = record.type==="repayment" ? "編輯這筆還款" : "編輯這筆記帳";
  document.getElementById("editPerson").value=record.person;
  document.getElementById("editDate").value=toDateInputValue(record.timestamp);
  document.getElementById("editItem").value=record.item;
  document.getElementById("editAmount").value=record.amount;
  document.getElementById("editStatus").textContent="";
  document.getElementById("editOverlay").classList.add("show");
}
function closeEdit(){ document.getElementById("editOverlay").classList.remove("show"); editingId=null; }
async function saveEdit(){
  const person=document.getElementById("editPerson").value, date=document.getElementById("editDate").value;
  const item=document.getElementById("editItem").value.trim(), amount=parseFloat(document.getElementById("editAmount").value);
  const statusEl=document.getElementById("editStatus");
  if (!person||!date||!item||isNaN(amount)){ statusEl.textContent="請完整填寫所有欄位"; statusEl.className="edit-status error"; return; }
  statusEl.textContent="儲存中…"; statusEl.className="edit-status";
  try{
    const res=await fetch(CONFIG.WEB_APP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:sessionKey,action:"update",id:editingId,person,item,amount,date})});
    const json=await res.json(); if(json.status!=="success") throw new Error(json.message||"修改失敗");
    closeEdit(); await loadRecords();
  } catch(err){ statusEl.textContent="修改失敗："+err.message; statusEl.className="edit-status error"; }
}
async function deleteEdit(){
  if (!confirm("確定要刪除這筆紀錄嗎？此動作無法復原。")) return;
  const statusEl=document.getElementById("editStatus");
  statusEl.textContent="刪除中…"; statusEl.className="edit-status";
  try{
    const res=await fetch(CONFIG.WEB_APP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:sessionKey,action:"delete",id:editingId})});
    const json=await res.json(); if(json.status!=="success") throw new Error(json.message||"刪除失敗");
    closeEdit(); await loadRecords();
  } catch(err){ statusEl.textContent="刪除失敗："+err.message; statusEl.className="edit-status error"; }
}

// ---------- 月結明細 ----------
function groupByMonth(){
  const groups={};
  allRecords.forEach(r=>{
    const key=monthKeyOf(r.timestamp);
    if(!groups[key]) groups[key]={total:0,byPerson:{},items:[]};
    if (r.type==="expense"){ groups[key].total+=r.amount; groups[key].byPerson[r.person]=(groups[key].byPerson[r.person]||0)+r.amount; }
    groups[key].items.push(r);
  });
  return groups;
}
function renderLedger(){
  const groups=groupByMonth(); const keys=Object.keys(groups).sort().reverse();
  const body=document.getElementById("ledgerBody");
  if (keys.length===0){ body.innerHTML='<div class="empty">還沒有任何紀錄</div>'; return; }
  let html="";
  keys.forEach(key=>{
    const g=groups[key];
    const persons=Object.entries(g.byPerson).sort((a,b)=>b[1]-a[1]);
    const itemsHtml=g.items.slice().reverse().map(r=>{
      const tag = r.type==="repayment" ? '<span class="tag">還款</span>' : "";
      return `<li class="${r.type==="repayment"?"repayment":""}" data-id="${r.id}"><span><span class="date">${dateLabel(r.timestamp)}</span>${tag}${r.person} · ${r.item}</span><span>${fmt(r.amount)}</span></li>`;
    }).join("");
    html += `<div class="month-block"><div class="month-head"><span>${key} 月結(支出)</span><span class="amt">${fmt(g.total)}</span></div>${persons.map(([p,amt])=>`<div class="person-row"><span>${p}</span><span class="amt">${fmt(amt)}</span></div>`).join("")}<ul class="items">${itemsHtml}</ul></div>`;
  });
  body.innerHTML=html;
  body.querySelectorAll(".items li").forEach(li=>li.addEventListener("click",()=>openEdit(li.dataset.id)));
}

// ---------- 圖表 ----------
function renderChart(){
  const type=document.getElementById("chartType").value;
  const ctx=document.getElementById("mainChart").getContext("2d");
  const expenseRecords=allRecords.filter(r=>r.type==="expense");
  const groups={};
  expenseRecords.forEach(r=>{ const k=monthKeyOf(r.timestamp); groups[k]=(groups[k]||0)+r.amount; });
  const monthKeys=Object.keys(groups).sort();
  let data;
  if (type==="pie"){
    const totals={}; expenseRecords.forEach(r=>{totals[r.person]=(totals[r.person]||0)+r.amount;});
    const labels=Object.keys(totals);
    data={ labels, datasets:[{ data:labels.map(l=>totals[l]), backgroundColor:["#4CAF50","#FFC107","#26C6DA","#E53935","#9C27B0","#FF6FA5"] }] };
  } else {
    data={ labels:monthKeys, datasets:[{ label:"每月支出總額", data:monthKeys.map(k=>groups[k]), borderColor:"#2e7d32", backgroundColor: type==="bar"?"#4CAF50":"rgba(76,175,80,0.25)", fill:type==="line", tension:0.3, pointBackgroundColor:"#FFC107", borderWidth:2 }] };
  }
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx,{ type: type==="pie"?"pie":type, data, options:{ responsive:true, plugins:{legend:{display:true,position:type==="pie"?"bottom":"top"}}, scales: type==="pie"?{}:{y:{beginAtZero:true}} } });
}

// ---------- 成就頁 ----------
function renderAchievePersonRow(){
  const row=document.getElementById("achievePersonRow");
  row.innerHTML = personNames().map(name=>`<button class="${name===achievePersonName?"active":""}" data-name="${name}">${name}</button>`).join("");
  row.querySelectorAll("button").forEach(btn=>btn.addEventListener("click",()=>{ achievePersonName=btn.dataset.name; renderAchievePersonRow(); renderAchieveContent(); }));
}
function currentProfile(){ return profiles.find(p=>p.name===achievePersonName); }
function renderAchieveContent(){
  if (!achievePersonName) return;
  const cumulative=cumulativeContribution(achievePersonName);
  renderTitleList(cumulative); renderLevelBox(cumulative); renderEquipGrid(cumulative);
}
function renderTitleList(cumulative){
  const profile=currentProfile();
  document.getElementById("titleList").innerHTML = TITLE_THRESHOLDS.map(t=>{
    const unlocked=cumulative>=t.amount;
    const isActive=profile && profile.activeTitle===t.name && unlocked;
    return `<div class="title-row ${unlocked?"":"locked"} ${isActive?"active-title":""}">
      <div class="title-check ${isActive?"checked":""}" data-title="${t.name}" ${unlocked?"":"style='pointer-events:none'"}>${isActive?"✓":""}</div>
      <div class="title-info"><div class="name">${t.name}</div><div class="req">${unlocked?"已解鎖":"累積貢獻滿 "+fmt(t.amount)+" 解鎖"}</div></div>
    </div>`;
  }).join("");
  document.querySelectorAll(".title-check").forEach(el=>el.addEventListener("click",()=>toggleActiveTitle(el.dataset.title)));
}
function toggleActiveTitle(titleName){
  const profile=currentProfile(); if(!profile) return;
  const newTitle = profile.activeTitle===titleName ? "" : titleName;
  patchProfileLocalThenSync(profile, { activeTitle:newTitle });
}
function renderLevelBox(cumulative){
  const level=levelFor(cumulative), stage=stageFor(ageFor(cumulative));
  const cur=level*10000, next=(level+1)*10000;
  const progress=Math.min(100, Math.round(((cumulative-cur)/(next-cur))*100));
  document.getElementById("levelBox").innerHTML = `
    <div class="level-num">Lv. ${level}</div>
    <div class="level-stage">${STAGE_LABEL[stage]}(約 ${ageFor(cumulative)} 歲)</div>
    <div class="xp-bar-outer"><div class="xp-bar-inner" style="width:${progress}%"></div></div>
    <div class="xp-label">${fmt(cumulative)} / ${fmt(next)}(距離下一等級還差 ${fmt(next-cumulative)})</div>`;
}
function renderEquipGrid(cumulative){
  const profile=currentProfile();
  const unlocked=unlockedEquipmentThresholds(cumulative);
  const equipped=(profile&&profile.equippedItems)||[];
  const nextItem=nextEquipmentItem(cumulative);

  document.getElementById("equipPreviewAvatar").innerHTML = profile ? renderAvatarSVG(profile, cumulative) : "";

  let html = EQUIPMENT_ITEMS.filter(i=>unlocked.includes(i.amount)).map(item=>{
    const isEquipped=equipped.includes(item.amount);
    return `<div class="equip-slot ${isEquipped?"equipped":""}" data-threshold="${item.amount}">
      <svg class="equip-icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" fill="${item.color}" stroke="#2b2620" stroke-width="2"/></svg>
      <div class="equip-name">${item.name}</div>
      <div class="equip-req">滿 ${fmt(item.amount)}</div>
      ${isEquipped?'<div class="equip-check">✓</div>':""}
    </div>`;
  }).join("");
  if (nextItem){
    html += `<div class="equip-slot locked">
      <svg class="equip-icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" fill="#999" stroke="#2b2620" stroke-width="2"/></svg>
      <div class="equip-name">${nextItem.name}</div>
      <div class="equip-req">滿 ${fmt(nextItem.amount)} 解鎖</div>
    </div>`;
  }
  document.getElementById("equipGrid").innerHTML = html;
  document.querySelectorAll(".equip-slot[data-threshold]").forEach(el=>el.addEventListener("click",()=>toggleEquip(Number(el.dataset.threshold))));
}
function toggleEquip(threshold){
  const profile=currentProfile(); if(!profile) return;
  const current=profile.equippedItems||[];
  const newList = current.includes(threshold) ? current.filter(t=>t!==threshold) : [...current, threshold];
  patchProfileLocalThenSync(profile, { equippedItems:newList });
}
document.getElementById("equipAllBtn").addEventListener("click", () => {
  const profile=currentProfile(); if(!profile) return;
  const cumulative=cumulativeContribution(achievePersonName);
  patchProfileLocalThenSync(profile, { equippedItems: unlockedEquipmentThresholds(cumulative) });
});

// 立即更新本地畫面(不用等後端) + 背景同步存檔，失敗才回頭整包重抓
function patchProfileLocalThenSync(profile, patch){
  const idx = profiles.findIndex(p => p.slot === profile.slot);
  const updated = { ...profile, ...patch };
  if (idx !== -1) profiles[idx] = updated;
  renderPlayerStrip(); renderAchieveContent();

  fetch(CONFIG.WEB_APP_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({ key: sessionKey, action:"updateProfile", slot: profile.slot, name: updated.name,
      birthdate: updated.birthdate||"", gender: updated.gender||"", equippedItems: updated.equippedItems||[],
      activeTitle: updated.activeTitle||"", hairstyle: updated.hairstyle||"", eyeStyle: updated.eyeStyle||"",
      faceShape: updated.faceShape||"", mouthStyle: updated.mouthStyle||"", bodyType: updated.bodyType||"" }) })
    .then(res => res.json())
    .then(json => { if (json.status !== "success") throw new Error(json.message); })
    .catch(err => { alert("同步失敗，正在重新整理：" + err.message); loadRecords(); });
}

// ---------- 人員設定彈窗 ----------
function openSettings(){
  const container=document.getElementById("profileForms");
  container.innerHTML = profiles.map(p => {
    const cumulative = cumulativeContribution(p.name);
    return `
    <div class="profile-block" data-slot="${p.slot}">
      <div class="profile-head">
        <div class="avatar-wrap" id="settingsAvatar-${p.slot}">${renderAvatarSVG(p, cumulative)}</div>
        <div class="ptitle">${p.name}</div>
      </div>
      <label>名字</label>
      <input class="f-name" value="${p.name}" />
      <div class="field-grid">
        <div><label>出生年月日</label><input class="f-birthdate" type="date" value="${p.birthdate||""}" /></div>
        <div><label>性別</label><select class="f-gender">
          <option value="">不指定</option>
          <option value="male" ${p.gender==="male"?"selected":""}>男</option>
          <option value="female" ${p.gender==="female"?"selected":""}>女</option>
          <option value="other" ${p.gender==="other"?"selected":""}>其他</option>
        </select></div>
      </div>
      <div class="zodiac-preview"></div>
      <div class="field-grid">
        <div><label>髮型</label><select class="f-hairstyle">
          <option value="auto" ${!p.hairstyle||p.hairstyle==="auto"?"selected":""}>依性別預設</option>
          <option value="short" ${p.hairstyle==="short"?"selected":""}>短髮</option>
          <option value="long" ${p.hairstyle==="long"?"selected":""}>長髮</option>
          <option value="ponytail" ${p.hairstyle==="ponytail"?"selected":""}>馬尾</option>
          <option value="bald" ${p.hairstyle==="bald"?"selected":""}>光頭</option>
        </select></div>
        <div><label>眼睛</label><select class="f-eyeStyle">
          <option value="round" ${(!p.eyeStyle||p.eyeStyle==="round")?"selected":""}>圓眼</option>
          <option value="happy" ${p.eyeStyle==="happy"?"selected":""}>笑眼</option>
          <option value="sleepy" ${p.eyeStyle==="sleepy"?"selected":""}>瞇眼</option>
        </select></div>
      </div>
      <div class="field-grid">
        <div><label>臉型</label><select class="f-faceShape">
          <option value="round" ${(!p.faceShape||p.faceShape==="round")?"selected":""}>圓臉</option>
          <option value="square" ${p.faceShape==="square"?"selected":""}>方臉</option>
          <option value="oval" ${p.faceShape==="oval"?"selected":""}>鵝蛋臉</option>
        </select></div>
        <div><label>嘴型</label><select class="f-mouthStyle">
          <option value="smile" ${(!p.mouthStyle||p.mouthStyle==="smile")?"selected":""}>微笑</option>
          <option value="neutral" ${p.mouthStyle==="neutral"?"selected":""}>平靜</option>
          <option value="open" ${p.mouthStyle==="open"?"selected":""}>驚訝</option>
        </select></div>
      </div>
      <label>體型</label>
      <select class="f-bodyType">
        <option value="regular" ${(!p.bodyType||p.bodyType==="regular")?"selected":""}>標準</option>
        <option value="slim" ${p.bodyType==="slim"?"selected":""}>纖細</option>
        <option value="broad" ${p.bodyType==="broad"?"selected":""}>壯碩</option>
      </select>
    </div>`;
  }).join("");

  container.querySelectorAll(".profile-block").forEach(block => {
    const slot = block.dataset.slot;
    const profile = profiles.find(p => p.slot.toString() === slot.toString());
    const dateInput = block.querySelector(".f-birthdate");
    const zodiacEl = block.querySelector(".zodiac-preview");
    function updateZodiac(){
      if (!dateInput.value){ zodiacEl.innerHTML=""; return; }
      const d = new Date(dateInput.value + "T12:00:00");
      zodiacEl.innerHTML = `<span class="zodiac-badge">${zodiacOf(d.getMonth()+1, d.getDate())}</span>`;
    }
    dateInput.addEventListener("change", updateZodiac);
    updateZodiac();

    function refreshPreview(){
      const draft = { ...profile,
        gender: block.querySelector(".f-gender").value,
        hairstyle: block.querySelector(".f-hairstyle").value,
        eyeStyle: block.querySelector(".f-eyeStyle").value,
        faceShape: block.querySelector(".f-faceShape").value,
        mouthStyle: block.querySelector(".f-mouthStyle").value,
        bodyType: block.querySelector(".f-bodyType").value
      };
      document.getElementById("settingsAvatar-"+slot).innerHTML = renderAvatarSVG(draft, cumulativeContribution(profile.name));
    }
    block.querySelectorAll("select").forEach(sel => sel.addEventListener("change", refreshPreview));
  });

  document.getElementById("settingsStatus").textContent = "";
  document.getElementById("settingsOverlay").classList.add("show");

function closeSettings(){ document.getElementById("settingsOverlay").classList.remove("show"); }
async function saveSettings(){
  const statusEl=document.getElementById("settingsStatus");
  statusEl.textContent="儲存中…"; statusEl.className="edit-status";
  const blocks=document.querySelectorAll("#profileForms .profile-block");
  try{
    for (const block of blocks){
      const slot=block.dataset.slot;
      const profile=profiles.find(p=>p.slot.toString()===slot.toString());
      const payload = {
        key: sessionKey, action:"updateProfile", slot,
        name: block.querySelector(".f-name").value.trim(),
        birthdate: block.querySelector(".f-birthdate").value,
        gender: block.querySelector(".f-gender").value,
        hairstyle: block.querySelector(".f-hairstyle").value,
        eyeStyle: block.querySelector(".f-eyeStyle").value,
        faceShape: block.querySelector(".f-faceShape").value,
        mouthStyle: block.querySelector(".f-mouthStyle").value,
        bodyType: block.querySelector(".f-bodyType").value,
        equippedItems: profile.equippedItems||[],
        activeTitle: profile.activeTitle||""
      };
      if (!payload.name) throw new Error("名字不能空白");
      const res=await fetch(CONFIG.WEB_APP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
      const json=await res.json();
      if (json.status!=="success") throw new Error(json.message);
    }
    statusEl.textContent="已儲存！"; statusEl.className="edit-status ok";
    await loadRecords();
    setTimeout(closeSettings, 500);
  } catch(err){ statusEl.textContent="儲存失敗："+err.message; statusEl.className="edit-status error"; }
}
