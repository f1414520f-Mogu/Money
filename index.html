<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>MONEYCRAFT</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2d3561">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --indigo: #2d3561; --indigo-deep: #1a2038;
    --vermillion: #c85a3f; --vermillion-dark: #9c3f2a;
    --gold: #c9a15a; --gold-dark: #96733a;
    --cream: #f0e6d2; --cream-dark: #d9c9a3;
    --ink: #2b2620; --ink-soft: #6b5c44;
    --wave: #4d7c8a; --wave-dark: #315a66;
    --sakura: #e39aa0;
    --card: #f5ecd8; --panel: #ece0c4; --panel-dark: #c9b587; --panel-light: #faf3e2;
    --danger: #b33f32; --danger-dark: #7d2c22;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    color: var(--ink);
    font-family: "DotGothic16", "Noto Sans TC", sans-serif;
    font-size: 16px;
    -webkit-tap-highlight-color: transparent;
    min-height:100vh;
    padding-bottom: 92px;
    background: var(--cream);
    overflow-x: hidden;
  }
  h1,h2,h3{ font-family: "DotGothic16", sans-serif; letter-spacing: 0.5px; }
  .pixel-en{ font-family: "Press Start 2P", monospace; }

  #bgScene{ position: fixed; inset:0; z-index:-2; overflow:hidden; }
  #bgScene .sky{ position:absolute; inset:0; background: linear-gradient(180deg, #f7e0b8 0%, #eab08a 35%, #d98a7e 55%, #2d3561 100%); }
  #bgScene .sun{ position:absolute; top:10%; left:50%; width:70px; height:70px; margin-left:-35px; background: var(--vermillion); border-radius:50%; opacity:0.85; box-shadow: 0 0 40px rgba(200,90,63,0.5); }
  #bgScene .mountain{
    position:absolute; left:0; right:0; bottom:14%; height:26%;
    background: var(--indigo); opacity:0.75;
    clip-path: polygon(0% 100%,0% 70%,8% 70%,8% 55%,16% 55%,16% 40%,26% 40%,26% 28%,36% 28%,36% 16%,46% 16%,50% 6%,54% 16%,64% 28%,64% 40%,74% 40%,74% 55%,84% 55%,84% 68%,92% 68%,92% 82%,100% 82%,100% 100%);
  }
  #bgScene .waves{
    position:absolute; left:0; right:0; bottom:0; height:16%;
    background-color: var(--indigo-deep);
    background-image: radial-gradient(circle at 50% 0%, transparent 60%, var(--wave-dark) 61%, var(--wave-dark) 64%, transparent 65%);
    background-size: 34px 22px; background-position: 0 0, 17px 11px;
  }
  #bgScene .waves::before{
    content:""; position:absolute; inset:0;
    background-image: radial-gradient(circle at 50% 0%, transparent 60%, var(--wave) 61%, var(--wave) 63%, transparent 64%);
    background-size: 34px 22px; background-position: 17px -6px;
    opacity:0.6;
  }

  .bevel-out{ border-style: solid; border-width: 3px; border-top-color: rgba(255,255,255,0.6); border-left-color: rgba(255,255,255,0.6); border-right-color: rgba(0,0,0,0.35); border-bottom-color: rgba(0,0,0,0.35); box-shadow: 0 3px 0 rgba(0,0,0,0.22); }

  #lockScreen{ position: fixed; inset:0; z-index: 100; display:flex; align-items:center; justify-content:center; padding: 24px; background: linear-gradient(180deg, #f7e0b8, #2d3561); }
  .lock-card{ background: var(--card); border-radius: 4px; padding: 30px 22px; width: 100%; max-width: 320px; text-align:center; }
  .lock-mark{ width:60px; height:60px; margin:0 auto 16px; background: var(--vermillion); border: 3px solid var(--vermillion-dark); display:flex; align-items:center; justify-content:center; color:#fff; font-size: 26px; }
  .lock-card h2{ margin: 0 0 16px; font-size: 16px; color: var(--ink); line-height:1.9; }
  .lock-card input{ text-align:center; letter-spacing: 3px; }
  #lockStatus{ min-height: 18px; font-size: 13px; margin-top: 10px; color: var(--danger); font-weight:700; }

  #app{ display:none; }
  #app.unlocked{ display:block; }

  header{ position: sticky; top:0; z-index:10; background: linear-gradient(180deg, rgba(45,53,97,0.94), rgba(26,32,56,0.96)), var(--header-photo, none); background-size: cover; background-position: center; color:#fff; padding: 12px 12px 12px; border-bottom: 4px solid var(--gold-dark); }
  .header-top{ display:flex; justify-content:space-between; align-items:center; }
  header .eyebrow{ font-size: 11px; letter-spacing: 2px; opacity: 0.85; margin-bottom: 4px; font-family:"Press Start 2P",monospace; color: var(--gold); }
  header h1{ margin:0; font-size: 15px; line-height:1.6; }
  .icon-btn{ width: 42px; height: 42px; background: var(--gold); color: var(--ink); border-color: #f5dca0 var(--gold-dark) var(--gold-dark) #f5dca0; border-style:solid; border-width:3px; border-radius:4px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:19px; }

  .player-strip{ display:flex; gap:8px; margin-top:10px; }
  .player-card{ flex:1; background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.3); border-radius: 6px; padding: 8px 6px 8px; text-align:center; }
  .player-title{ font-size: 10px; margin-bottom: 4px; min-height: 13px; font-weight:700; text-shadow: 1px 1px 0 rgba(0,0,0,0.6); }
  .portrait-wrap{ width: 54px; height: 54px; margin: 0 auto 4px; overflow:hidden; border-radius:6px; background: rgba(255,255,255,0.12); }
  .portrait-wrap svg{ width:100%; height:100%; }
  .player-name{ font-size: 13px; font-weight:700; margin-bottom: 3px; }
  .player-amt{ font-family:"Press Start 2P",monospace; font-size: 12px; color: var(--gold); text-shadow: 1px 1px 0 rgba(0,0,0,0.6); }
  .player-amt-label{ font-size: 10px; opacity:0.85; margin-top:4px; }

  main{ max-width: 480px; margin: 0 auto; padding: 16px 12px; }

  .card{ background: var(--card); border-color: var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light); border-style:solid; border-width:3px; border-radius:4px; padding: 16px; margin-bottom: 14px; }
  .card h2{ margin: 0 0 14px; font-size: 15px; color: var(--ink); line-height: 1.6; display:flex; align-items:center; gap:9px; }
  .card h2 .idx{ font-size:16px; background: var(--indigo); color:#fff; width:28px; height:28px; border-radius:5px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

  .character-stage{ display:flex; gap:14px; justify-content:center; padding: 12px 0 6px; }
  .character-slot{ flex:1; max-width: 200px; display:flex; align-items:flex-end; justify-content:center; }
  .character-slot .avatar-wrap{ width:100%; max-width:180px; }
  .character-slot .avatar-wrap svg{ width:100%; height:auto; filter: drop-shadow(0 6px 4px rgba(0,0,0,0.25)); }
  .character-ground{ height: 18px; margin: 0 -12px; background: repeating-linear-gradient(90deg, var(--indigo) 0 10px, var(--indigo-deep) 10px 20px); border-top: 3px solid var(--gold-dark); }

  .mode-switch{ display:flex; gap:6px; margin-bottom: 16px; }
  .mode-switch button{ flex:1; padding: 12px 4px; font-size: 14px; font-weight:700; cursor:pointer; background: var(--panel); color: var(--ink-soft); border-radius:4px; border-color: var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light); border-style:solid; border-width:2px; font-family:"DotGothic16",sans-serif; display:flex; align-items:center; justify-content:center; gap:6px; }
  .mode-switch button.active{ background: var(--wave); color:#fff; border-color: #8fc9d6 var(--wave-dark) var(--wave-dark) #8fc9d6; }

  label{ display:flex; align-items:center; gap:6px; font-size: 14px; color: var(--ink-soft); margin: 14px 0 5px; font-weight:700; }
  label:first-of-type{ margin-top:0; }
  input, select{ width: 100%; padding: 12px 12px; font-size: 16px; border-radius:4px; border-color: var(--panel-dark) var(--panel-light) var(--panel-light) var(--panel-dark); border-style: solid; border-width: 2px; background: #fffef8; color: var(--ink); font-family: "DotGothic16",sans-serif; }
  select{ appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%); background-position: calc(100% - 18px) center, calc(100% - 13px) center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  input:focus, select:focus{ outline: 2px solid var(--wave); }
  input:disabled{ opacity: 0.5; background: #eee; }

  button.primary{ width:100%; margin-top: 16px; padding: 15px; font-size:15px; font-weight:700; border-radius:4px; background: var(--wave); color:#fff; cursor:pointer; font-family:"DotGothic16",sans-serif; border-color: #8fc9d6 var(--wave-dark) var(--wave-dark) #8fc9d6; border-style:solid; border-width:3px; box-shadow: 0 3px 0 rgba(0,0,0,0.25); display:flex; align-items:center; justify-content:center; gap:8px; }
  button.primary:active{ transform: translateY(2px); box-shadow:none; }
  button.primary:disabled{ opacity: 0.45; }
  button.primary.repay-mode{ background: var(--gold); border-color: #f5dca0 var(--gold-dark) var(--gold-dark) #f5dca0; color: var(--ink); }
  button.secondary{ width:100%; margin-top: 10px; padding: 13px; font-size:14px; font-weight:700; border-radius:4px; background: var(--panel); color: var(--danger); cursor:pointer; border-color: var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light); border-style:solid; border-width:2px; }
  button.ghost{ width:100%; margin-top: 8px; padding: 11px; background:none; color: var(--ink-soft); font-size:13px; font-weight:700; border:none; cursor:pointer; }
  button.logout-in-menu{ width:100%; margin-top: 18px; padding: 13px; background: var(--danger); color:#fff; font-size:14px; font-weight:700; border-radius:4px; cursor:pointer; border-color: #e07a6d var(--danger-dark) var(--danger-dark) #e07a6d; border-style:solid; border-width:2px; display:flex; align-items:center; justify-content:center; gap:8px; }

  .status{ font-size: 13px; margin-top: 10px; min-height: 16px; font-weight:700; }
  .status.error{ color: var(--danger); }
  .status.ok{ color: var(--wave-dark); }

  .month-block{ margin-bottom: 16px; }
  .month-head{ display:flex; justify-content: space-between; align-items:baseline; font-size: 13.5px; font-weight:700; color: var(--ink); border-bottom: 2px dashed var(--panel-dark); padding-bottom: 8px; margin-bottom: 8px; }
  .person-row{ display:flex; justify-content: space-between; font-size: 14px; padding: 4px 0; color: var(--ink-soft); }
  .person-row .amt{ font-variant-numeric: tabular-nums; color: var(--ink); font-weight:700; }
  .items{ margin: 6px 0 8px 0; padding-left: 0; list-style:none; }
  .items li{ display:flex; justify-content:space-between; font-size:13.5px; align-items:center; padding: 8px 8px 8px 10px; color: var(--ink-soft); border-left: 3px solid var(--panel-dark); cursor:pointer; margin-bottom:4px; background: rgba(255,255,255,0.5); border-radius:3px; }
  .items li:active{ background: rgba(255,255,255,0.85); }
  .items li.repayment{ border-left-color: var(--gold); }
  .items li .tag{ font-size:10px; padding:2px 6px; margin-right:5px; background: var(--gold); color:#4a3714; font-weight:700; border-radius:3px; }
  .items li .date{ color: #96876a; margin-right: 6px; font-variant-numeric: tabular-nums; }

  .empty{ font-size: 14px; color: var(--ink-soft); text-align:center; padding: 30px 0; font-weight:700; }
  .skeleton{ padding: 4px 0; }
  .skeleton-line{ height: 14px; margin-bottom: 10px; border-radius:3px; background: linear-gradient(90deg, var(--panel-dark) 25%, var(--panel-light) 37%, var(--panel-dark) 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
  @keyframes shimmer{ 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }

  canvas{ max-height: 280px; }

  .sub-tabs{ display:flex; gap:6px; margin-bottom: 16px; }
  .sub-tabs button{ flex:1; padding: 11px 2px; font-size: 13px; font-weight:700; cursor:pointer; border-radius:4px; background: var(--panel); color: var(--ink-soft); border-color: var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light); border-style:solid; border-width:2px; font-family:"DotGothic16",sans-serif; }
  .sub-tabs button.active{ background: var(--indigo); color:#fff; }
  .sub-view{ display:none; }
  .sub-view.active{ display:block; }

  .person-select-row{ display:flex; gap:6px; margin-bottom: 14px; }
  .person-select-row button{ flex:1; padding: 10px 4px; font-size: 14px; font-weight:700; cursor:pointer; border-radius:4px; background: var(--panel); color: var(--ink-soft); border-color: var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light); border-style:solid; border-width:2px; }
  .person-select-row button.active{ background: var(--vermillion); color:#fff; }

  .title-list{ display:flex; flex-direction:column; gap:8px; }
  .title-row{ display:flex; align-items:center; gap:10px; padding: 12px; background: rgba(255,255,255,0.55); border: 2px solid var(--panel-dark); border-radius:4px; border-left-width: 6px; }
  .title-row.locked{ opacity: 0.4; }
  .title-check{ width: 22px; height:22px; border:2px solid var(--ink-soft); border-radius:4px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; cursor:pointer; background:#fff; }
  .title-check.checked{ background: var(--gold); border-color:var(--gold-dark); }
  .title-info .name{ font-size: 14.5px; font-weight:700; }
  .title-info .req{ font-size: 12px; color: var(--ink-soft); }

  .level-box{ background: rgba(255,255,255,0.55); border:2px solid var(--panel-dark); border-radius:4px; padding: 18px; text-align:center; margin-bottom:14px; }
  .level-num{ font-family:"Press Start 2P",monospace; font-size: 26px; color: var(--vermillion); margin-bottom:4px; }
  .level-stage{ font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; font-weight:700; }
  .xp-bar-outer{ height: 20px; background: var(--panel-dark); border: 2px solid var(--ink); border-radius:4px; overflow:hidden; }
  .xp-bar-inner{ height:100%; background: repeating-linear-gradient(90deg, var(--gold) 0 8px, var(--gold-dark) 8px 16px); }
  .xp-label{ font-size: 12.5px; color: var(--ink-soft); margin-top: 8px; font-weight:700; }

  .equip-preview{ text-align:center; margin-bottom: 16px; }
  .equip-preview .avatar-wrap{ width: 130px; margin:0 auto; }
  .equip-preview .avatar-wrap svg{ width:100%; height:auto; }
  .equip-grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .equip-slot{ background: rgba(255,255,255,0.55); border: 2px solid var(--panel-dark); border-radius:4px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; padding: 10px 4px; cursor:pointer; position:relative; }
  .equip-slot.locked{ opacity:0.4; cursor:default; }
  .equip-slot.equipped{ border-color: var(--gold); background: rgba(201,161,90,0.28); }
  .equip-icon{ width: 30px; height:30px; }
  .equip-name{ font-size: 12px; font-weight:700; }
  .equip-req{ font-size: 10.5px; color: var(--ink-soft); text-align:center; }
  .equip-check{ position:absolute; top:3px; right:5px; font-size:13px; color: var(--wave-dark); }
  .equip-all-btn{ width:100%; margin-bottom: 14px; padding: 12px; font-size:13.5px; font-weight:700; background: var(--sakura); color:#5b1f28; border-radius:4px; border-color:#f6cdd2 #a5545f #a5545f #f6cdd2; border-style:solid; border-width:2px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }

  nav.tabs{ position: fixed; bottom:0; left:0; right:0; z-index: 10; display:flex; background: var(--panel); border-top: 3px solid var(--panel-dark); }
  nav.tabs button{ flex:1; padding: 10px 1px 9px; background: none; border:none; font-size: 10.5px; color: var(--ink-soft); cursor:pointer; font-family:"DotGothic16",sans-serif; font-weight:700; }
  nav.tabs button svg{ display:block; margin: 0 auto 3px; width:20px; height:20px; }
  nav.tabs button.active{ color: var(--vermillion); }
  nav.tabs button.active svg{ stroke: var(--vermillion); }

  .view{ display:none; }
  .view.active{ display:block; }

  .setup-warning{ background: #fbe2de; color: var(--danger); border: 2px solid var(--danger); border-radius:4px; padding: 12px 13px; font-size: 13px; margin-bottom: 14px; font-weight:700; }

  .overlay{ position: fixed; inset:0; z-index: 90; background: rgba(20,15,10,0.6); display:none; align-items:flex-end; justify-content:center; }
  .overlay.show{ display:flex; }
  .sheet{ background: var(--card); width:100%; max-width: 480px; padding: 20px 18px 26px; border-top: 4px solid var(--panel-dark); border-radius: 12px 12px 0 0; max-height: 90vh; overflow-y:auto; }
  .sheet h3{ margin:0 0 14px; font-size: 15px; color: var(--ink); }
  .edit-status{ font-size:13px; min-height:16px; margin-top:8px; font-weight:700; }

  .zodiac-badge{ display:inline-block; margin-top:8px; font-size: 13px; background: var(--wave); color:#fff; padding: 5px 11px; font-weight:700; border-radius:4px; }
  .profile-block{ padding: 16px 0; border-bottom: 3px dashed var(--panel-dark); }
  .profile-block:last-of-type{ border-bottom:none; }
  .profile-head{ display:flex; align-items:center; gap:12px; margin-bottom: 6px; }
  .profile-head .avatar-wrap{ width: 60px; height: 80px; flex-shrink:0; }
  .profile-head .avatar-wrap svg{ width:100%; height:100%; }
  .profile-head .ptitle{ font-size: 15px; font-weight:700; }
  .field-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
</style>
</head>
<body>

<div id="bgScene"><div class="sky"></div><div class="sun"></div><div class="mountain"></div><div class="waves"></div></div>

<div id="lockScreen">
  <div class="lock-card bevel-out">
    <div class="lock-mark">▦</div>
    <h2>MONEYCRAFT<br>請輸入密碼</h2>
    <input type="password" id="lockPassword" placeholder="密碼" />
    <button class="primary" id="lockSubmit">⚔ 進入世界</button>
    <div id="lockStatus"></div>
  </div>
</div>

<div id="app">
<header>
  <div class="header-top">
    <div>
      <div class="eyebrow">MONEYCRAFT</div>
      <h1>Money獵人2人組</h1>
    </div>
    <button class="icon-btn bevel-out" id="settingsBtn" title="人員設定">⚙</button>
  </div>
  <div class="player-strip" id="playerStrip"></div>
</header>

<main>

  <div id="setupWarning" class="setup-warning" style="display:none;">
    ⚠️ 尚未設定 Apps Script 網址，請打開這個檔案的原始碼，把最上面 CONFIG.WEB_APP_URL 換成你部署後拿到的網址。
  </div>

  <section id="view-character" class="view active">
    <div class="character-stage" id="characterStage"></div>
    <div class="character-ground"></div>
  </section>

  <section id="view-add" class="view">
    <div class="card bevel-out">
      <h2><span class="idx">🧾</span>新增紀錄</h2>
      <div class="mode-switch">
        <button id="modeExpenseBtn" class="active">💰 支出記帳</button>
        <button id="modeRepayBtn">💵 現金入帳</button>
      </div>
      <div id="expenseFields">
        <label>🙋 記帳人員</label>
        <select id="inputPerson"></select>
        <label>📅 日期</label>
        <input type="date" id="inputDate" />
        <label>📝 項目名目</label>
        <input id="inputItem" placeholder="例如：晚餐、水電費" autocomplete="off" />
        <label>💴 金額</label>
        <input id="inputAmount" type="number" inputmode="decimal" placeholder="0" />
      </div>
      <div id="repayFields" style="display:none;">
        <label>🎁 要還給誰？</label>
        <select id="repayPerson"><option value="">請先選擇要還給誰</option></select>
        <label>📅 日期</label>
        <input type="date" id="repayDate" />
        <label>💴 還款金額</label>
        <input id="repayAmount" type="number" inputmode="decimal" placeholder="請先選擇要還給誰" disabled />
        <label>📝 備註(選填)</label>
        <input id="repayNote" placeholder="例如：發薪日撥入" autocomplete="off" />
      </div>
      <button class="primary" id="submitBtn">✔ 送出記帳</button>
      <div class="status" id="submitStatus"></div>
    </div>
  </section>

  <section id="view-ledger" class="view">
    <div class="card bevel-out">
      <h2><span class="idx">📖</span>月結明細</h2>
      <p style="font-size:13px;color:var(--ink-soft);margin:-6px 0 12px;font-weight:700;">點任一筆紀錄可以修改或刪除</p>
      <div id="ledgerBody"><div class="skeleton"><div class="skeleton-line" style="width:60%"></div><div class="skeleton-line" style="width:90%"></div><div class="skeleton-line" style="width:75%"></div></div></div>
    </div>
  </section>

  <section id="view-chart" class="view">
    <div class="card bevel-out">
      <h2><span class="idx">📊</span>金流圖表</h2>
      <select id="chartType" style="margin-bottom:14px;">
        <option value="line">📈 折線圖(每月總額趨勢)</option>
        <option value="bar">📊 長條圖(每月總額趨勢)</option>
        <option value="pie">🥧 圓餅圖(各人員佔比)</option>
      </select>
      <canvas id="mainChart"></canvas>
    </div>

function zodiacOf(m,d){
  const ranges=[{sign:"摩羯座",start:[12,22],end:[1,19]},{sign:"水瓶座",start:[1,20],end:[2,18]},{sign:"雙魚座",start:[2,19],end:[3,20]},{sign:"牡羊座",start:[3,21],end:[4,19]},{sign:"金牛座",start:[4,20],end:[5,20]},{sign:"雙子座",start:[5,21],end:[6,21]},{sign:"巨蟹座",start:[6,22],end:[7,22]},{sign:"獅子座",start:[7,23],end:[8,22]},{sign:"處女座",start:[8,23],end:[9,22]},{sign:"天秤座",start:[9,23],end:[10,23]},{sign:"天蠍座",start:[10,24],end:[11,21]},{sign:"射手座",start:[11,22],end:[12,21]}];
  for (const r of ranges){ const [sm,sd]=r.start,[em,ed]=r.end; if(sm<=em){ if((m===sm&&d>=sd)||(m===em&&d<=ed)||(m>sm&&m<em)) return r.sign; } else { if((m===sm&&d>=sd)||(m===em&&d<=ed)) return r.sign; } }

}

function levelFor(cumulative){ return Math.floor(cumulative / 10000); }

function stageFor(age){ if(age<=2) return "baby"; if(age<=11) return "child"; if(age<=17) return "teen"; if(age<=59) return "adult"; return "elder"; }
const STAGE_LABEL = { baby:"寶寶", child:"孩童", teen:"青少年", adult:"成人", elder:"長者" };
const STAGE_PROPORTIONS = {
  baby:  { headW:44, headH:40, headY:14, torsoW:24, torsoH:16, torsoY:52, legW:10, legH:12, legY:66, armW:8, armH:14, armY:54 },

  teen:  { headW:36, headH:34, headY:8,  torsoW:26, torsoH:28, torsoY:40, legW:11, legH:28, legY:66, armW:8, armH:27, armY:42 },
  adult: { headW:34, headH:32, headY:7,  torsoW:28, torsoH:32, torsoY:37, legW:12, legH:34, legY:67, armW:9, armH:32, armY:39 },

};
const SKIN_TONES = { light:"#f6dcb8", medium:"#f0c090", tan:"#d99f6c", dark:"#a2714a" };

function rectTag(x,y,w,h,fill,extra){ return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="#4a3222" stroke-width="1" shape-rendering="crispEdges" ${extra||""}/>`; }

function hairSVG(profile, headX, headY, headW, headH){
  let style = profile.hairstyle;
  if (!style || style==="auto") style = profile.gender==="female" ? "long" : "short";
  const color = "#4a3222";
  if (style==="bald") return "";
  if (style==="long") return rectTag(headX-2, headY-2, headW+4, headH*0.95, color);
  if (style==="ponytail") return rectTag(headX-1, headY-2, headW+2, headH*0.32, color) + rectTag(headX+headW-2, headY+headH*0.12, 4, headH*0.7, color);
  return rectTag(headX-1, headY-2, headW+2, headH*0.32, color);
}
function eyesSVG(style, headX, headY, headW, headH){
  const cy=headY+headH*0.46, r=Math.max(1.8, headW*0.06);
  const cx1=headX+headW*0.3, cx2=headX+headW*0.7;
  if (style==="happy") return `<path d="M${cx1-2.5},${cy} q2.5,-3.5 5,0" stroke="#2b2620" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M${cx2-2.5},${cy} q2.5,-3.5 5,0" stroke="#2b2620" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  if (style==="sleepy") return `<rect x="${cx1-2.5}" y="${cy}" width="5" height="1.6" fill="#2b2620"/><rect x="${cx2-2.5}" y="${cy}" width="5" height="1.6" fill="#2b2620"/>`;
  return `<circle cx="${cx1}" cy="${cy}" r="${r}" fill="#2b2620"/><circle cx="${cx1-r*0.4}" cy="${cy-r*0.4}" r="${r*0.3}" fill="#fff"/><circle cx="${cx2}" cy="${cy}" r="${r}" fill="#2b2620"/><circle cx="${cx2-r*0.4}" cy="${cy-r*0.4}" r="${r*0.3}" fill="#fff"/>`;
}
function mouthSVG(style, headX, headY, headW, headH){
  const cy=headY+headH*0.74, cx=headX+headW*0.5;
  if (style==="open") return `<ellipse cx="${cx}" cy="${cy}" rx="3.2" ry="2.4" fill="#8b3a2b"/>`;
  if (style==="neutral") return `<rect x="${cx-3.2}" y="${cy}" width="6.4" height="1.5" fill="#8b3a2b"/>`;
  return `<path d="M${cx-3.8},${cy} q3.8,3.8 7.6,0" stroke="#8b3a2b" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
}

function equipmentSVG(name, b){
  switch(name){
    case "內褲":
      return `<path d="M${b.torsoX},${b.torsoY+b.torsoH*0.62} h${b.torsoW} v${b.torsoH*0.18} q0,${b.torsoH*0.16} -${b.torsoW*0.18},${b.torsoH*0.2} q-${b.torsoW*0.32},${b.torsoH*0.1} -${b.torsoW*0.5},0 q-${b.torsoW*0.18},-${b.torsoH*0.04} -${b.torsoW*0.18},-${b.torsoH*0.2} z" fill="#f7f7f7" stroke="#b8ada0" stroke-width="1"/>`;
    case "襪子":
      return rectTag(b.leg1X-0.5, b.legY+b.legH*0.58, b.legW+1, b.legH*0.42, "#eeeeee") + rectTag(b.leg1X-0.5, b.legY+b.legH*0.58, b.legW+1, 3, "#cfc9bd")
           + rectTag(b.leg2X-0.5, b.legY+b.legH*0.58, b.legW+1, b.legH*0.42, "#eeeeee") + rectTag(b.leg2X-0.5, b.legY+b.legH*0.58, b.legW+1, 3, "#cfc9bd");
    case "內衣":
      return rectTag(b.torsoX, b.torsoY+2, b.torsoW, b.torsoH*0.42, "#fdf6d8")
           + rectTag(b.torsoX+2, b.torsoY-2, 3, 6, "#fdf6d8") + rectTag(b.torsoX+b.torsoW-5, b.torsoY-2, 3, 6, "#fdf6d8");
    case "手套":
      return rectTag(b.armLX, b.armY+b.armH*0.72, b.armW, b.armH*0.28, "#c0392b", 'rx="2"') + rectTag(b.armLX-1.5, b.armY+b.armH*0.8, 2.5, b.armH*0.16, "#c0392b")
           + rectTag(b.armRX, b.armY+b.armH*0.72, b.armW, b.armH*0.28, "#c0392b", 'rx="2"') + rectTag(b.armRX+b.armW-1, b.armY+b.armH*0.8, 2.5, b.armH*0.16, "#c0392b");
    case "長褲":
      return rectTag(b.torsoX+1, b.torsoY+b.torsoH*0.7, b.torsoW-2, b.torsoH*0.3, "#34495e")
           + rectTag(b.leg1X-0.5, b.legY, b.legW+1, b.legH*0.72, "#34495e") + rectTag(b.leg2X-0.5, b.legY, b.legW+1, b.legH*0.72, "#34495e")
           + rectTag(b.leg1X+b.legW/2-0.5, b.legY, 1, b.legH*0.7, "#25384a");
    case "T恤":
      return `<path d="M${b.torsoX-2},${b.torsoY+3} l3,-4 h${b.torsoW*0.28} q${b.torsoW*0.22},-3 ${b.torsoW*0.44},0 h${b.torsoW*0.28} l3,4 l-2.5,5 l-2.5,-2 v${b.torsoH*0.7} h-${b.torsoW+1} v-${b.torsoH*0.7} l-2.5,2 z" fill="#2980b9" stroke="#1c5a80" stroke-width="1"/>`;
    case "鞋子":
      return `<path d="M${b.leg1X-1.5},${b.legY+b.legH-7} h${b.legW+3} v4 q0,3 4,3 h-${b.legW+7} z" fill="#5a3a22" stroke="#3a230f" stroke-width="1"/>`+
             `<path d="M${b.leg2X-1.5},${b.legY+b.legH-7} h${b.legW+3} v4 q0,3 4,3 h-${b.legW+7} z" fill="#5a3a22" stroke="#3a230f" stroke-width="1"/>`;
    case "外套":
      return `<path d="M${b.torsoX-4},${b.torsoY-1} h${b.torsoW*0.4} l${b.torsoW*0.1},4 l${b.torsoW*0.1},-4 h${b.torsoW*0.4} l3,5 l-3,4 v${b.torsoH*0.75} h-${b.torsoW+2} v-${b.torsoH*0.75} l-3,-4 z" fill="#6b4c7a" fill-opacity="0.92" stroke="#432f52" stroke-width="1"/>`
           + `<rect x="${b.torsoX+b.torsoW/2-0.5}" y="${b.torsoY+3}" width="1" height="${b.torsoH*0.7}" fill="#432f52"/>`;
    case "帽子":
      return `<path d="M${b.headX-2},${b.headY-2} q${b.headW*0.5},-11 ${b.headW+4},0 v3 h-${b.headW+4} z" fill="#16a085" stroke="#0e6655" stroke-width="1"/>`

    case "兔耳帽":
      return `<path d="M${b.headX+3},${b.headY-3} q-2,-14 2,-17 q4,3 2,17 z" fill="#e39aa0" stroke="#a5545f" stroke-width="1"/>`

      return `<g transform="rotate(20 ${b.armRX} ${b.armY})"><rect x="${b.armRX+2}" y="${b.armY-10}" width="2.5" height="${b.armH+14}" fill="#c9a15a" stroke="#8a6a35" stroke-width="1"/><polygon points="${b.armRX+3.25},${b.armY-16} ${b.armRX+6},${b.armY-9} ${b.armRX+3.25},${b.armY-11} ${b.armRX+0.5},${b.armY-9}" fill="#f7d716" stroke="#a5822a" stroke-width="0.8"/></g>`;
    case "皇冠":
      return `<polygon points="${b.headX-1},${b.headY-2} ${b.headX+b.headW*0.2},${b.headY-10} ${b.headX+b.headW*0.4},${b.headY-3} ${b.headX+b.headW*0.5},${b.headY-11} ${b.headX+b.headW*0.6},${b.headY-3} ${b.headX+b.headW*0.8},${b.headY-10} ${b.headX+b.headW+1},${b.headY-2}" fill="#f7d716" stroke="#a5822a" stroke-width="1"/>`

    default: return "";

function renderAvatarSVG(profile, cumulative, mode){
  const stage = stageFor(ageFor(cumulative));
  const p = STAGE_PROPORTIONS[stage];
  const bodyMult = { slim:0.85, regular:1, broad:1.2 }[profile.bodyType || "regular"];
  const torsoW = p.torsoW*bodyMult, armW = p.armW*bodyMult;
  const centerX=50, headX=centerX-p.headW/2, torsoX=centerX-torsoW/2;
  const legGap=2, leg1X=centerX-p.legW-legGap/2, leg2X=centerX+legGap/2;
  const armLX=torsoX-armW-1, armRX=torsoX+torsoW+1;
  const skin = SKIN_TONES[profile.skinTone] || SKIN_TONES.medium;
  const b = { torsoX, torsoY:p.torsoY, torsoW, torsoH:p.torsoH, headX, headY:p.headY, headW:p.headW, headH:p.headH, leg1X, leg2X, legY:p.legY, legW:p.legW, legH:p.legH, armLX, armRX, armY:p.armY, armW, armH:p.armH };

  let inner = "";
  inner += rectTag(leg1X, p.legY, p.legW, p.legH, skin) + rectTag(leg2X, p.legY, p.legW, p.legH, skin);
  inner += rectTag(armLX, p.armY, armW, p.armH, skin) + rectTag(armRX, p.armY, armW, p.armH, skin);
  inner += rectTag(torsoX, p.torsoY, torsoW, p.torsoH, skin);
  const headRadius = profile.faceShape==="round" ? p.headW*0.28 : (profile.faceShape==="square" ? 2 : 7);
  inner += `<rect x="${headX}" y="${p.headY}" width="${p.headW}" height="${p.headH}" rx="${headRadius}" fill="${skin}" stroke="#7a5230" stroke-width="1.5" shape-rendering="crispEdges"/>`;
  inner += hairSVG(profile, headX, p.headY, p.headW, p.headH);
  inner += eyesSVG(profile.eyeStyle, headX, p.headY, p.headW, p.headH);
  inner += mouthSVG(profile.mouthStyle, headX, p.headY, p.headW, p.headH);
  const equipped = profile.equippedItems || [];
  EQUIPMENT_ITEMS.forEach(item => { if (equipped.includes(item.amount)) inner += equipmentSVG(item.name, b); });

  const viewBox = mode==="portrait" ? `${headX-8} ${p.headY-14} ${p.headW+16} ${p.headH+22}` : "0 0 100 140";
  return `<svg viewBox="${viewBox}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}

  }
  try{
    const url = CONFIG.WEB_APP_URL + "?key=" + encodeURIComponent(sessionKey);
    const res = await fetch(url, { method:"GET" });
    const json = await parseJsonSafe(res);
    if (json.status !== "success") throw new Error(json.message || "讀取失敗");
    allRecords = json.data.map(r => ({ id:r.id, timestamp:safeDate(r.timestamp), person:r.person, item:r.item, amount:Number(r.amount)||0, type:r.type||"expense" })).sort((a,b)=>a.timestamp-b.timestamp);
    profiles = json.profiles || [];
    if (!achievePersonName && profiles.length) achievePersonName = profiles[0].name;
    renderAll();
  } catch(err){
    document.getElementById("ledgerBody").innerHTML = `<div class="empty">讀取失敗：${err.message}</div>`;
  }
}

function cumulativeContribution(name){ return allRecords.filter(r=>r.person===name && r.type==="expense").reduce((s,r)=>s+r.amount,0); }
function repaidTotal(name){ return allRecords.filter(r=>r.person===name && r.type==="repayment").reduce((s,r)=>s+r.amount,0); }
function outstandingBalance(name){ return cumulativeContribution(name) - repaidTotal(name); }

function renderCharacterStage(){
  const stage = document.getElementById("characterStage");
  stage.innerHTML = profiles.map(p => {
    const cumulative = cumulativeContribution(p.name);
    return `<div class="character-slot"><div class="avatar-wrap">${renderAvatarSVG(p, cumulative, "full")}</div></div>`;
  }).join("");
}

function renderPlayerStrip(){
  const strip = document.getElementById("playerStrip");
  strip.innerHTML = profiles.map(p => {

}

async function submitRecord(){ return currentMode==="expense" ? submitExpense() : submitRepay(); }
async function submitExpense(){
  const person=document.getElementById("inputPerson").value, date=document.getElementById("inputDate").value;
  const item=document.getElementById("inputItem").value.trim(), amount=parseFloat(document.getElementById("inputAmount").value);
  const statusEl=document.getElementById("submitStatus");
  if (!person||!date||!item||isNaN(amount)){ statusEl.textContent="請完整填寫人員、日期、名目、金額"; statusEl.className="status error"; return; }
  await postAndReload({action:"create",person,item,amount,date}, statusEl, ()=>{ document.getElementById("inputItem").value=""; document.getElementById("inputAmount").value=""; setDefaultDates(); });
}
async function submitRepay(){
  const person=document.getElementById("repayPerson").value, date=document.getElementById("repayDate").value;
  const amount=parseFloat(document.getElementById("repayAmount").value), note=document.getElementById("repayNote").value.trim();
  const statusEl=document.getElementById("submitStatus");
  if (!person){ statusEl.textContent="請先選擇要還給誰"; statusEl.className="status error"; return; }
  if (!date||isNaN(amount)){ statusEl.textContent="請填寫日期與金額"; statusEl.className="status error"; return; }
  await postAndReload({action:"repay",person,amount,date,note}, statusEl, ()=>{
    document.getElementById("repayPerson").value=""; document.getElementById("repayAmount").value="";
    document.getElementById("repayAmount").disabled=true; document.getElementById("repayAmount").placeholder="請先選擇要還給誰";
    document.getElementById("repayNote").value=""; setDefaultDates();
  });
}
async function postAndReload(payload, statusEl, onSuccess){
  const btn=document.getElementById("submitBtn");
  btn.disabled=true; statusEl.textContent="送出中…"; statusEl.className="status";
  try{
    const res=await fetch(CONFIG.WEB_APP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:sessionKey,...payload})});
    const json=await parseJsonSafe(res);
    if (json.status!=="success") throw new Error(json.message||"寫入失敗");
    statusEl.textContent="已記錄！"; statusEl.className="status ok";
    onSuccess(); await loadRecords();
  } catch(err){ statusEl.textContent="送出失敗："+err.message; statusEl.className="status error"; }
  finally{ btn.disabled=false; }
}

function groupByMonth(){
  const groups={};
  allRecords.forEach(r=>{
    const key=monthKeyOf(r.timestamp);
    if(!groups[key]) groups[key]={total:0,byPerson:{},items:[]};
    if (r.type==="expense"){ groups[key].total+=r.amount; groups[key].byPerson[r.person]=(groups[key].byPerson[r.person]||0)+r.amount; }
    groups[key].items.push(r);
  });
  return groups;
}
function renderLedger(){
  const groups=groupByMonth(); const keys=Object.keys(groups).sort().reverse();
  const body=document.getElementById("ledgerBody");
  if (keys.length===0){ body.innerHTML='<div class="empty">還沒有任何紀錄</div>'; return; }
  let html="";
  keys.forEach(key=>{
    const g=groups[key];
    const persons=Object.entries(g.byPerson).sort((a,b)=>b[1]-a[1]);
    const itemsHtml=g.items.slice().reverse().map(r=>{
      const tag = r.type==="repayment" ? '<span class="tag">還款</span>' : "";
      return `<li class="${r.type==="repayment"?"repayment":""}" data-id="${r.id}"><span><span class="date">${dateLabel(r.timestamp)}</span>${tag}${r.person} · ${r.item}</span><span>${fmt(r.amount)}</span></li>`;
    }).join("");
    html += `<div class="month-block"><div class="month-head"><span>${key} 月結(支出)</span><span class="amt">${fmt(g.total)}</span></div>${persons.map(([p,amt])=>`<div class="person-row"><span>${p}</span><span class="amt">${fmt(amt)}</span></div>`).join("")}<ul class="items">${itemsHtml}</ul></div>`;
  });
  body.innerHTML=html;
  body.querySelectorAll(".items li").forEach(li=>li.addEventListener("click",()=>openEdit(li.dataset.id)));
}

function renderChart(){
  const type=document.getElementById("chartType").value;
  const ctx=document.getElementById("mainChart").getContext("2d");
  const expenseRecords=allRecords.filter(r=>r.type==="expense");
  const groups={};
  expenseRecords.forEach(r=>{ const k=monthKeyOf(r.timestamp); groups[k]=(groups[k]||0)+r.amount; });
  const monthKeys=Object.keys(groups).sort();
  let data;
  if (type==="pie"){
    const totals={}; expenseRecords.forEach(r=>{totals[r.person]=(totals[r.person]||0)+r.amount;});
    const labels=Object.keys(totals);
    data={ labels, datasets:[{ data:labels.map(l=>totals[l]), backgroundColor:["#c85a3f","#4d7c8a","#c9a15a","#6b4c7a","#8b2942","#2d3561"] }] };
  } else {
    data={ labels:monthKeys, datasets:[{ label:"每月支出總額", data:monthKeys.map(k=>groups[k]), borderColor:"#2d3561", backgroundColor: type==="bar"?"#4d7c8a":"rgba(77,124,138,0.25)", fill:type==="line", tension:0.3, pointBackgroundColor:"#c85a3f", borderWidth:2 }] };
  }
  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx,{ type: type==="pie"?"pie":type, data, options:{ responsive:true, plugins:{legend:{display:true,position:type==="pie"?"bottom":"top"}}, scales: type==="pie"?{}:{y:{beginAtZero:true}} } });
}

function renderTitleList(cumulative){
  const profile=currentProfile();
  document.getElementById("titleList").innerHTML = TITLE_THRESHOLDS.map(t=>{
    const unlocked=cumulative>=t.amount;
    const isActive=profile && profile.activeTitle===t.name && unlocked;
    return `<div class="title-row ${unlocked?"":"locked"}" style="border-left-color:${t.color}; ${isActive?`background:${t.color}22;`:""}">
      <div class="title-check ${isActive?"checked":""}" data-title="${t.name}" ${unlocked?"":"style='pointer-events:none'"} style="${isActive?`background:${t.color};border-color:${t.color};`:""}">${isActive?"✓":""}</div>
      <div class="title-info"><div class="name" style="color:${unlocked?t.color:'inherit'}">${t.name}</div><div class="req">${unlocked?"已解鎖":"累積貢獻滿 "+fmt(t.amount)+" 解鎖"}</div></div>
    </div>`;
  }).join("");
  document.querySelectorAll(".title-check").forEach(el=>el.addEventListener("click",()=>toggleActiveTitle(el.dataset.title)));
}
function toggleActiveTitle(titleName){
  const profile=currentProfile(); if(!profile) return;
  const newTitle = profile.activeTitle===titleName ? "" : titleName;
  patchProfileLocalThenSync(profile, { activeTitle:newTitle });
}
function renderLevelBox(cumulative){
  const level=levelFor(cumulative), stage=stageFor(ageFor(cumulative));
  const cur=level*10000, next=(level+1)*10000;
  const progress=Math.min(100, Math.round(((cumulative-cur)/(next-cur))*100));
  document.getElementById("levelBox").innerHTML = `
    <div class="level-num">Lv. ${level}</div>
    <div class="level-stage">${STAGE_LABEL[stage]}(約 ${ageFor(cumulative)} 歲)</div>
    <div class="xp-bar-outer"><div class="xp-bar-inner" style="width:${progress}%"></div></div>
    <div class="xp-label">${fmt(cumulative)} / ${fmt(next)}(距離下一等級還差 ${fmt(next-cumulative)})</div>`;
}
function renderEquipGrid(cumulative){
  const profile=currentProfile();
  const unlocked=unlockedEquipmentThresholds(cumulative);
  const equipped=(profile&&profile.equippedItems)||[];
  const nextItem=nextEquipmentItem(cumulative);
  document.getElementById("equipPreviewAvatar").innerHTML = profile ? renderAvatarSVG(profile, cumulative, "full") : "";
  let html = EQUIPMENT_ITEMS.filter(i=>unlocked.includes(i.amount)).map(item=>{
    const isEquipped=equipped.includes(item.amount);
    return `<div class="equip-slot ${isEquipped?"equipped":""}" data-threshold="${item.amount}">
      <svg class="equip-icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" fill="${item.color}" stroke="#2b2620" stroke-width="2"/></svg>
      <div class="equip-name">${item.name}</div><div class="equip-req">滿 ${fmt(item.amount)}</div>
      ${isEquipped?'<div class="equip-check">✓</div>':""}
    </div>`;
  }).join("");
  if (nextItem){
    html += `<div class="equip-slot locked"><svg class="equip-icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" fill="#999" stroke="#2b2620" stroke-width="2"/></svg><div class="equip-name">${nextItem.name}</div><div class="equip-req">滿 ${fmt(nextItem.amount)} 解鎖</div></div>`;
  }
  document.getElementById("equipGrid").innerHTML = html;
  document.querySelectorAll(".equip-slot[data-threshold]").forEach(el=>el.addEventListener("click",()=>toggleEquip(Number(el.dataset.threshold))));
}
function toggleEquip(threshold){
  const profile=currentProfile(); if(!profile) return;
  const current=profile.equippedItems||[];
  const newList = current.includes(threshold) ? current.filter(t=>t!==threshold) : [...current, threshold];
  patchProfileLocalThenSync(profile, { equippedItems:newList });
}
document.getElementById("equipAllBtn").addEventListener("click", () => {
  const profile=currentProfile(); if(!profile) return;
  const cumulative=cumulativeContribution(achievePersonName);
  patchProfileLocalThenSync(profile, { equippedItems: unlockedEquipmentThresholds(cumulative) });
});

function patchProfileLocalThenSync(profile, patch){
  const idx = profiles.findIndex(p => p.slot === profile.slot);
  const updated = { ...profile, ...patch };
  if (idx !== -1) profiles[idx] = updated;
  renderPlayerStrip(); renderCharacterStage(); renderAchieveContent();

  fetch(CONFIG.WEB_APP_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({ key: sessionKey, action:"updateProfile", slot: profile.slot, name: updated.name,
      birthdate: updated.birthdate||"", gender: updated.gender||"", equippedItems: updated.equippedItems||[],
      activeTitle: updated.activeTitle||"", hairstyle: updated.hairstyle||"", eyeStyle: updated.eyeStyle||"",
      faceShape: updated.faceShape||"", mouthStyle: updated.mouthStyle||"", bodyType: updated.bodyType||"", skinTone: updated.skinTone||"" }) })
    .then(res => parseJsonSafe(res))
    .then(json => { if (json.status !== "success") throw new Error(json.message); })
    .catch(err => { alert("同步失敗，正在重新整理：" + err.message); loadRecords(); });
}

  });
});
document.querySelectorAll(".sub-tab-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".sub-tab-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".sub-view").forEach(v=>v.classList.remove("active"));
    btn.classList.add("active"); document.getElementById(btn.dataset.sub).classList.add("active");
  });
});

document.getElementById("editSaveBtn").addEventListener("click", saveEdit);
document.getElementById("editDeleteBtn").addEventListener("click", deleteEdit);
document.getElementById("editCancelBtn").addEventListener("click", closeEdit);
document.getElementById("editOverlay").addEventListener("click", e=>{ if(e.target.id==="editOverlay") closeEdit(); });

document.getElementById("settingsBtn").addEventListener("click", openSettings);
document.getElementById("settingsSaveBtn").addEventListener("click", saveSettings);
document.getElementById("settingsCancelBtn").addEventListener("click", closeSettings);
document.getElementById("settingsOverlay").addEventListener("click", e=>{ if(e.target.id==="settingsOverlay") closeSettings(); });

function boot(){
  setDefaultDates();
  document.getElementById("submitBtn").addEventListener("click", submitRecord);
  document.getElementById("chartType").addEventListener("change", renderChart);
  loadRecords();
}
initLogin();
</script>
</body>
</html>
