<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>共同記帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --paper: #f6f2e8;
    --paper-line: #e4dcc8;
    --ink: #262019;
    --ink-soft: #7a7263;
    --ledger: #2f5d50;
    --ledger-dark: #1c3d33;
    --ledger-soft: #e4ece8;
    --accent: #c0602b;
    --danger: #a4402e;
    --card: #fffdf8;
    --radius: 16px;
    --shadow: 0 4px 18px rgba(38,32,25,0.08);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans TC","PingFang TC","Helvetica Neue",Arial,sans-serif;
    -webkit-tap-highlight-color: transparent;
    min-height:100vh;
    padding-bottom: 88px;
    background-image:
      radial-gradient(circle at 100% 0%, rgba(47,93,80,0.05), transparent 45%),
      repeating-linear-gradient(to bottom, transparent, transparent 30px, var(--paper-line) 31px);
  }
  h1,h2,h3{ font-family:"Noto Serif TC", serif; }

  /* ---------- 登入畫面 ---------- */
  #lockScreen{
    position: fixed; inset:0; z-index: 100;
    background: linear-gradient(160deg, var(--ledger-dark), var(--ledger));
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
  }
  .lock-card{
    background: var(--card); border-radius: 20px; padding: 32px 26px;
    width: 100%; max-width: 340px; box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    text-align:center;
  }
  .lock-mark{
    width:52px; height:52px; margin:0 auto 14px; border-radius: 50%;
    background: var(--ledger-soft); display:flex; align-items:center; justify-content:center;
    color: var(--ledger); font-size: 22px; font-weight:700; font-family:"Noto Serif TC",serif;
  }
  .lock-card h2{ margin: 0 0 4px; font-size: 19px; color: var(--ledger-dark); }
  .lock-card p{ margin: 0 0 18px; font-size: 12.5px; color: var(--ink-soft); }
  .lock-card input{ text-align:center; letter-spacing: 2px; }
  .lock-card button{ margin-top: 14px; }
  #lockStatus{ min-height: 16px; font-size: 12px; margin-top: 8px; color: var(--danger); }

  #app{ display:none; }
  #app.unlocked{ display:block; }

  header{
    position: sticky; top:0; z-index:10;
    background: linear-gradient(160deg, var(--ledger), var(--ledger-dark));
    color:#fff;
    padding: 20px 20px 16px;
    box-shadow: var(--shadow);
  }
  .header-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  header .eyebrow{ font-size: 10.5px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.72; margin-bottom: 4px; }
  header h1{ margin:0; font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  .logout-btn{
    background: rgba(255,255,255,0.14); color:#fff; border:none; border-radius: 20px;
    font-size: 11px; padding: 6px 12px; cursor:pointer;
  }
  header .grand-total{ margin-top: 12px; font-size: 12.5px; opacity: 0.85; }
  header .grand-total b{ font-family:"Noto Serif TC",serif; font-size: 22px; font-variant-numeric: tabular-nums; margin-left:6px; display:block; margin-top:2px; }

  main{ max-width: 480px; margin: 0 auto; padding: 18px 16px; }

  .card{
    background: var(--card); border-radius: var(--radius); padding: 18px;
    margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid var(--paper-line);
  }
  .card h2{
    margin: 0 0 14px; font-size: 16px; color: var(--ledger-dark);
    display:flex; align-items:center; gap:9px;
  }
  .card h2 .idx{
    font-size:10.5px; background: var(--ledger); color:#fff; font-family:"Noto Sans TC",sans-serif;
    width:20px; height:20px; border-radius: 50%; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }

  label{ display:block; font-size: 12px; color: var(--ink-soft); margin: 12px 0 5px; font-weight:500; }
  label:first-of-type{ margin-top:0; }
  input, select{
    width: 100%; padding: 12px 13px; font-size: 15px;
    border: 1.5px solid var(--paper-line); border-radius: 11px;
    background: #fffefb; color: var(--ink); font-family: inherit;
    transition: border-color 0.15s ease;
  }
  select{ appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%); background-position: calc(100% - 18px) center, calc(100% - 13px) center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  input:focus, select:focus{ outline: none; border-color: var(--ledger); }

  button.primary{
    width:100%; margin-top: 16px; padding: 14px;
    background: var(--ledger); color:#fff; font-size:15px; font-weight:700;
    border:none; border-radius: 11px; cursor:pointer; font-family:"Noto Sans TC",sans-serif;
    box-shadow: 0 6px 16px rgba(47,93,80,0.28);
  }
  button.primary:active{ background: var(--ledger-dark); transform: translateY(1px); box-shadow:none; }
  button.primary:disabled{ opacity: 0.5; box-shadow:none; }

  .status{ font-size: 12px; margin-top: 9px; min-height: 16px; font-weight:500; }
  .status.error{ color: var(--danger); }
  .status.ok{ color: var(--ledger); }

  .month-block{ margin-bottom: 16px; }
  .month-block:last-child{ margin-bottom: 0; }
  .month-head{
    display:flex; justify-content: space-between; align-items:baseline;
    font-size: 13.5px; font-weight:700; color: var(--ledger-dark);
    border-bottom: 1px dashed var(--paper-line); padding-bottom: 7px; margin-bottom: 7px;
  }
  .month-head .amt{ font-variant-numeric: tabular-nums; font-family:"Noto Serif TC",serif; }
  .person-row{ display:flex; justify-content: space-between; font-size: 13px; padding: 4px 0; color: var(--ink-soft); }
  .person-row .amt{ font-variant-numeric: tabular-nums; color: var(--ink); font-weight:600; }
  .items{ margin: 6px 0 8px 0; padding-left: 0; list-style:none; }
  .items li{
    display:flex; justify-content:space-between; font-size:12.5px;
    padding: 4px 0 4px 11px; color: var(--ink-soft); border-left: 2px solid var(--paper-line);
  }
  .items li .date{ color: #a49c8a; margin-right: 6px; font-variant-numeric: tabular-nums; }

  .empty{ font-size: 13px; color: var(--ink-soft); text-align:center; padding: 26px 0; }

  .chart-controls{ margin-bottom: 14px; }
  canvas{ max-height: 280px; }

  nav.tabs{
    position: fixed; bottom:0; left:0; right:0; z-index: 10;
    display:flex; background: var(--card);
    border-top: 1px solid var(--paper-line);
    box-shadow: 0 -4px 14px rgba(0,0,0,0.06);
  }
  nav.tabs button{
    flex:1; padding: 12px 4px 10px; background: none; border:none;
    font-size: 11px; color: var(--ink-soft); cursor:pointer; font-family:"Noto Sans TC",sans-serif;
  }
  nav.tabs button svg{ display:block; margin: 0 auto 3px; width:19px; height:19px; }
  nav.tabs button.active{ color: var(--ledger); font-weight:700; }
  nav.tabs button.active svg{ stroke: var(--ledger); }

  .view{ display:none; }
  .view.active{ display:block; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .setup-warning{
    background: #fbe9e2; color: var(--danger); border: 1px solid #f0c3b3;
    border-radius: 11px; padding: 11px 13px; font-size: 12.5px; margin-bottom: 14px;
  }
</style>
</head>
<body>

<!-- ============ 登入畫面 ============ -->
<div id="lockScreen">
  <div class="lock-card">
    <div class="lock-mark">記</div>
    <h2>共同記帳本</h2>
    <p>請輸入共用密碼以繼續</p>
    <input type="password" id="lockPassword" placeholder="密碼" inputmode="text" />
    <button class="primary" id="lockSubmit">進入</button>
    <div id="lockStatus"></div>
  </div>
</div>

<!-- ============ 主畫面 ============ -->
<div id="app">
<header>
  <div class="header-top">
    <div>
      <div class="eyebrow">共同記帳本</div>
      <h1>大家的帳，一起結</h1>
    </div>
    <button class="logout-btn" id="logoutBtn">登出</button>
  </div>
  <div class="grand-total">目前累積總額<b id="grandTotal">$0</b></div>
</header>

<main>

  <div id="setupWarning" class="setup-warning" style="display:none;">
    ⚠️ 尚未設定 Apps Script 網址，請打開這個檔案的原始碼，把最上面 <code>CONFIG.WEB_APP_URL</code> 換成你部署後拿到的網址。
  </div>

  <!-- 新增記帳 -->
  <section id="view-add" class="view active">
    <div class="card">
      <h2><span class="idx">1</span>新增一筆記帳</h2>

      <label for="inputPerson">記帳人員</label>
      <select id="inputPerson"></select>

      <label for="inputDate">日期</label>
      <input type="date" id="inputDate" />

      <label for="inputItem">項目名目</label>
      <input id="inputItem" placeholder="例如：晚餐、水電費" autocomplete="off" />

      <label for="inputAmount">金額</label>
      <input id="inputAmount" type="number" inputmode="decimal" placeholder="0" />

      <button class="primary" id="submitBtn">送出記帳</button>
      <div class="status" id="submitStatus"></div>
    </div>
  </section>

  <!-- 明細 / 月結 -->
  <section id="view-ledger" class="view">
    <div class="card">
      <h2><span class="idx">2</span>月結明細</h2>
      <div id="ledgerBody"><div class="empty">讀取中…</div></div>
    </div>
  </section>

  <!-- 圖表 -->
  <section id="view-chart" class="view">
    <div class="card">
      <h2><span class="idx">3</span>金流圖表</h2>
      <div class="chart-controls">
        <select id="chartType">
          <option value="line">折線圖(每月總額趨勢)</option>
          <option value="bar">長條圖(每月總額趨勢)</option>
          <option value="pie">圓餅圖(各人員佔比)</option>
        </select>
      </div>
      <canvas id="mainChart"></canvas>
    </div>
  </section>

</main>

<nav class="tabs">
  <button class="tab-btn active" data-view="view-add">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    記帳
  </button>
  <button class="tab-btn" data-view="view-ledger">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    月結明細
  </button>
  <button class="tab-btn" data-view="view-chart">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M11 19V5M18 19v-7"/></svg>
    圖表
  </button>
</nav>
</div>

<script>
// ============================================================
// 設定區
// ============================================================
const CONFIG = {
  WEB_APP_URL: "https://script.google.com/macros/s/AKfycbw3Mbf_TIDVSalbn4X9Eun1-YoRnfp9WbL3-264QlaP37qpJaNyWQttxxrZZ2uDZTlMvA/exec",
  // 這裡改成你們兩位的名字，會顯示在記帳人員下拉選單
  PERSONS: ["老公子", "老婆子"],
  // 這裡改成你自己的密碼，要跟 Apps Script 裡的 APP_KEY 完全一樣
  APP_PASSWORD: "20210318"
};

let allRecords = [];
let chartInstance = null;
let sessionKey = null; // 登入成功後暫存密碼，用來附加在每次 API 請求

// ---------- 登入 ----------
function initLogin(){
  const saved = localStorage.getItem("ledger_key");
  if (saved === CONFIG.APP_PASSWORD){
    unlock(saved);
    return;
  }
  document.getElementById("lockSubmit").addEventListener("click", tryLogin);
  document.getElementById("lockPassword").addEventListener("keydown", e => {
    if (e.key === "Enter") tryLogin();
  });
}

function tryLogin(){
  const val = document.getElementById("lockPassword").value;
  const statusEl = document.getElementById("lockStatus");
  if (val !== CONFIG.APP_PASSWORD){
    statusEl.textContent = "密碼錯誤，請再試一次";
    return;
  }
  statusEl.textContent = "";
  localStorage.setItem("ledger_key", val);
  unlock(val);
}

function unlock(key){
  sessionKey = key;
  document.getElementById("lockScreen").style.display = "none";
  document.getElementById("app").classList.add("unlocked");
  boot();
}

document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.removeItem("ledger_key");
  location.reload();
});

// ---------- 工具函式 ----------
function fmt(n){ return "$" + Math.round(n).toLocaleString("zh-TW"); }
function monthKeyOf(date){
  const y = date.getFullYear();
  const m = (date.getMonth()+1).toString().padStart(2,"0");
  return `${y}-${m}`;
}
function dateLabel(date){
  const m = (date.getMonth()+1).toString().padStart(2,"0");
  const d = date.getDate().toString().padStart(2,"0");
  return `${m}/${d}`;
}

// ---------- 初始化畫面元件 ----------
function populatePersonSelect(){
  const sel = document.getElementById("inputPerson");
  sel.innerHTML = CONFIG.PERSONS.map(p => `<option value="${p}">${p}</option>`).join("");
}
function setDefaultDate(){
  const today = new Date();
  document.getElementById("inputDate").value = today.toISOString().slice(0,10);
}

// ---------- 讀取資料 ----------
async function loadRecords(){
  if (!CONFIG.WEB_APP_URL || CONFIG.WEB_APP_URL.indexOf("PASTE_YOUR") === 0){
    document.getElementById("setupWarning").style.display = "block";
    document.getElementById("ledgerBody").innerHTML = '<div class="empty">尚未連接資料來源</div>';
    return;
  }
  try{
    const url = CONFIG.WEB_APP_URL + "?key=" + encodeURIComponent(sessionKey);
    const res = await fetch(url, { method: "GET" });
    const json = await res.json();
    if (json.status !== "success") throw new Error(json.message || "讀取失敗");

    allRecords = json.data.map(r => ({
      timestamp: new Date(r.timestamp),
      person: r.person,
      item: r.item,
      amount: Number(r.amount)
    })).sort((a,b) => a.timestamp - b.timestamp);

    renderLedger();
    renderChart();
  } catch(err){
    document.getElementById("ledgerBody").innerHTML =
      `<div class="empty">讀取失敗：${err.message}</div>`;
  }
}

// ---------- 新增記帳 ----------
async function submitRecord(){
  const person = document.getElementById("inputPerson").value;
  const date = document.getElementById("inputDate").value;
  const item = document.getElementById("inputItem").value.trim();
  const amount = parseFloat(document.getElementById("inputAmount").value);
  const statusEl = document.getElementById("submitStatus");
  const btn = document.getElementById("submitBtn");

  if (!person || !date || !item || isNaN(amount)){
    statusEl.textContent = "請完整填寫人員、日期、名目、金額";
    statusEl.className = "status error";
    return;
  }

  btn.disabled = true;
  statusEl.textContent = "送出中…";
  statusEl.className = "status";

  try{
    const res = await fetch(CONFIG.WEB_APP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ key: sessionKey, person, item, amount, date })
    });
    const json = await res.json();
    if (json.status !== "success") throw new Error(json.message || "寫入失敗");

    statusEl.textContent = "已記錄！";
    statusEl.className = "status ok";
    document.getElementById("inputItem").value = "";
    document.getElementById("inputAmount").value = "";
    setDefaultDate();

    await loadRecords();
  } catch(err){
    statusEl.textContent = "送出失敗：" + err.message;
    statusEl.className = "status error";
  } finally {
    btn.disabled = false;
  }
}

// ---------- 月結 & 總額 ----------
function groupByMonth(){
  const groups = {};
  allRecords.forEach(r => {
    const key = monthKeyOf(r.timestamp);
    if (!groups[key]) groups[key] = { total: 0, byPerson: {}, items: [] };
    groups[key].total += r.amount;
    groups[key].byPerson[r.person] = (groups[key].byPerson[r.person] || 0) + r.amount;
    groups[key].items.push(r);
  });
  return groups;
}

function renderLedger(){
  const groups = groupByMonth();
  const keys = Object.keys(groups).sort().reverse();
  const body = document.getElementById("ledgerBody");

  if (keys.length === 0){
    body.innerHTML = '<div class="empty">還沒有任何記帳紀錄</div>';
    document.getElementById("grandTotal").textContent = fmt(0);
    return;
  }

  let grandTotal = 0;
  let html = "";
  keys.forEach(key => {
    const g = groups[key];
    grandTotal += g.total;
    const persons = Object.entries(g.byPerson).sort((a,b) => b[1]-a[1]);
    const itemsHtml = g.items
      .slice().reverse()
      .map(r => `<li><span><span class="date">${dateLabel(r.timestamp)}</span>${r.person} · ${r.item}</span><span>${fmt(r.amount)}</span></li>`)
      .join("");

    html += `
      <div class="month-block">
        <div class="month-head"><span>${key} 月結</span><span class="amt">${fmt(g.total)}</span></div>
        ${persons.map(([p,amt]) => `<div class="person-row"><span>${p}</span><span class="amt">${fmt(amt)}</span></div>`).join("")}
        <ul class="items">${itemsHtml}</ul>
      </div>`;
  });

  body.innerHTML = html;
  document.getElementById("grandTotal").textContent = fmt(grandTotal);
}

// ---------- 圖表 ----------
function renderChart(){
  const type = document.getElementById("chartType").value;
  const ctx = document.getElementById("mainChart").getContext("2d");
  const groups = groupByMonth();
  const monthKeys = Object.keys(groups).sort();

  let data;
  if (type === "pie"){
    const totalsByPerson = {};
    allRecords.forEach(r => {
      totalsByPerson[r.person] = (totalsByPerson[r.person] || 0) + r.amount;
    });
    const labels = Object.keys(totalsByPerson);
    data = {
      labels,
      datasets: [{
        data: labels.map(l => totalsByPerson[l]),
        backgroundColor: ["#2f5d50","#c0602b","#7fa896","#e0a35c","#3d7264","#a4402e"]
      }]
    };
  } else {
    data = {
      labels: monthKeys,
      datasets: [{
        label: "每月總額",
        data: monthKeys.map(k => groups[k].total),
        borderColor: "#2f5d50",
        backgroundColor: type === "bar" ? "#2f5d50" : "rgba(47,93,80,0.15)",
        fill: type === "line",
        tension: 0.3,
        pointBackgroundColor: "#c0602b",
        borderWidth: 2
      }]
    };
  }

  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: type === "pie" ? "pie" : type,
    data,
    options: {
      responsive: true,
      plugins: { legend: { display: true, position: type === "pie" ? "bottom" : "top" } },
      scales: type === "pie" ? {} : { y: { beginAtZero: true } }
    }
  });
}

// ---------- Tab 切換 ----------
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(btn.dataset.view).classList.add("active");
    if (btn.dataset.view === "view-chart") renderChart();
  });
});

// ---------- 啟動 ----------
function boot(){
  populatePersonSelect();
  setDefaultDate();
  document.getElementById("submitBtn").addEventListener("click", submitRecord);
  document.getElementById("chartType").addEventListener("change", renderChart);
  loadRecords();
}

initLogin();
</script>
</body>
</html>
