<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>錢莊</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#c9a15a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet"></noscript>
<!-- Chart.js 與 xlsx 改成用到才載入，避免一開始就卡住畫面(見下方 loadScript) -->
<style>
  :root{
    --gold:#d4af6a; --gold-dark:#a97f3e; --cream:#e8dcc0; --cream-dark:#c9b78e; --cream-light:#f2e8d0;
    --ink:#f0e6d2; --ink-soft:#b8a988; --teal:#5b9a80; --teal-dark:#3d6650;
    --danger:#d1554a; --danger-dark:#8a281c;
    --card:#2e2620; --panel:#241d18; --panel-dark:#4a3c2e; --panel-light:#5c4c3a;
    --bg-deep:#171310;
  }
  /* ---------- 4 種配色主題(body 加 class 切換) ---------- */
  body.theme-parchment{
    --gold:#c9a15a; --gold-dark:#96733a; --cream:#f0e6d2; --cream-dark:#d9c9a3; --cream-light:#faf3e2;
    --ink:#2b2620; --ink-soft:#6b5c44; --teal:#5b8a72; --teal-dark:#3d6650;
    --danger:#b33f32; --danger-dark:#7d2c22;
    --card:#f6ecd4; --panel:#e9d8ae; --panel-dark:#c2a565; --panel-light:#faf1dc;
    --bg-deep:#e8dcc0;
  }
  body.theme-ocean{
    --gold:#7fc9d9; --gold-dark:#4a97a8; --cream:#dceef2; --cream-dark:#b8d8e0; --cream-light:#eef8fa;
    --ink:#e4f4f7; --ink-soft:#a8c8cf; --teal:#4a90a4; --teal-dark:#316877;
    --danger:#d1665a; --danger-dark:#8a3a2e;
    --card:#1c333a; --panel:#152128; --panel-dark:#2e4a53; --panel-light:#3d5d67;
    --bg-deep:#0e181d;
  }
  body.theme-forest{
    --gold:#a8c46a; --gold-dark:#78943e; --cream:#e6ecd4; --cream-dark:#c8d4a3; --cream-light:#f2f6e8;
    --ink:#eaf0dc; --ink-soft:#b8c49a; --teal:#5b9a72; --teal-dark:#3d6650;
    --danger:#d17a54; --danger-dark:#8a4a28;
    --card:#22301e; --panel:#182415; --panel-dark:#3a4e2e; --panel-light:#4a613a;
    --bg-deep:#101a0d;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ color:var(--ink); font-family:"DotGothic16","Noto Sans TC",sans-serif; font-size:16px; -webkit-tap-highlight-color:transparent; min-height:100vh; padding-bottom:92px; background:var(--bg-deep); overflow-x:hidden; }
  h1,h2,h3{ font-family:"DotGothic16",sans-serif; letter-spacing:0.5px; }
  img.pixel{ image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; }

  .bevel-out{ border-style:solid; border-width:3px; border-top-color:rgba(255,255,255,0.6); border-left-color:rgba(255,255,255,0.6); border-right-color:rgba(0,0,0,0.35); border-bottom-color:rgba(0,0,0,0.35); box-shadow:0 3px 0 rgba(0,0,0,0.22); }

  #lockScreen{ position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; background:linear-gradient(180deg,#f7e0b8,#c9a15a); }
  .lock-card{ background:var(--card); border-radius:4px; padding:30px 22px; width:100%; max-width:320px; text-align:center; }
  .lock-mark{ width:60px; height:60px; margin:0 auto 16px; background:var(--gold); border:3px solid var(--gold-dark); display:flex; align-items:center; justify-content:center; color:var(--ink); font-size:26px; }
  .lock-card h2{ margin:0 0 16px; font-size:16px; line-height:1.9; }
  .lock-card input{ text-align:center; letter-spacing:3px; }
  #lockStatus{ min-height:18px; font-size:13px; margin-top:10px; color:var(--danger); font-weight:700; }

  #app{ display:none; } #app.unlocked{ display:block; }

  header{ position:sticky; top:0; z-index:10; background:linear-gradient(180deg,rgba(150,115,58,0.96),rgba(107,82,42,0.98)),var(--header-photo,none); background-size:cover; background-position:center; color:var(--cream); padding:12px; border-bottom:4px solid var(--gold-dark); }
  .header-top{ display:flex; justify-content:space-between; align-items:center; }
  .brand{ display:flex; align-items:center; gap:8px; }
  .coin-icon{ width:30px; height:30px; flex-shrink:0; }
  header .eyebrow{ font-size:22px; letter-spacing:2px; opacity:0.98; margin-bottom:4px; font-family:"Press Start 2P",monospace; color:#fff3d6; text-shadow:2px 2px 0 rgba(0,0,0,0.35); }
  header h1{ margin:0; font-size:14px; line-height:1.5; color:var(--cream-dark); }
  .icon-btn{ width:42px; height:42px; background:var(--gold); color:#2b2015; border-color:#fbe6ae var(--gold-dark) var(--gold-dark) #fbe6ae; border-style:solid; border-width:3px; border-radius:4px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:19px; }

  .player-strip{ display:flex; gap:8px; margin-top:10px; }
  .player-card{ flex:1; border-radius:6px; padding:10px 8px; text-align:center; border:3px solid var(--frame-color, rgba(255,255,255,0.3)); background:var(--frame-bg, rgba(0,0,0,0.25)); cursor:pointer; }
  .player-card:active{ transform: scale(0.98); }
  .player-title{ font-size:11px; margin-bottom:5px; min-height:14px; font-weight:700; text-shadow:1px 1px 0 rgba(0,0,0,0.6); }
  .portrait-wrap{ width:80px; height:80px; margin:0 auto 6px; overflow:hidden; border-radius:8px; background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center; }
  .portrait-wrap img{ width:100%; height:100%; object-fit:contain; }
  .player-name{ font-size:15px; font-weight:700; margin-bottom:3px; }
  .player-lv{ display:inline-block; font-family:"Press Start 2P",monospace; font-size:10px; background:rgba(0,0,0,0.3); color:var(--gold); padding:2px 6px; border-radius:3px; margin-bottom:4px; }
  .player-amt{ font-family:"Press Start 2P",monospace; font-size:13px; color:#fff3d6; text-shadow:1px 1px 0 rgba(0,0,0,0.6); }
  .player-amt-label{ font-size:10px; opacity:0.9; margin-top:4px; }
  .player-repaid{ font-size:10px; opacity:0.85; margin-top:3px; color:var(--gold); }

  main{ max-width:480px; margin:0 auto; padding:16px 12px; }
  .card{ background:var(--card); border-color:var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light); border-style:solid; border-width:3px; border-radius:4px; padding:16px; margin-bottom:14px; }
  .card h2{ margin:0 0 14px; font-size:15px; display:flex; align-items:center; gap:9px; }
  .card h2 .idx{ font-size:16px; background:var(--gold-dark); color:#fff; width:28px; height:28px; border-radius:5px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

  /* ---------- 人物頁籤：專屬銀行場景背景 ---------- */
  #view-character{ margin:-16px -12px 0; padding:0 0 16px; position:relative; overflow:hidden; }
  .bank-scene{ position:relative; background:
      radial-gradient(ellipse 60px 22px at 15% 20%, rgba(255,255,255,0.55), transparent),
      radial-gradient(ellipse 70px 24px at 82% 12%, rgba(255,255,255,0.5), transparent),
      radial-gradient(ellipse 50px 18px at 65% 28%, rgba(255,255,255,0.4), transparent),
      linear-gradient(180deg,#a9d4e8 0%, #cfe3c8 55%, #cabb90 100%);
    padding:8px 12px 0; overflow:hidden; padding-bottom:70px; }
  .bank-scene .bank-img{ display:block; width:100%; max-width:420px; margin:0 auto; image-rendering:pixelated; position:relative; z-index:1; }
  .bank-scene .decor{ position:absolute; image-rendering:pixelated; }
  .flag{ position:absolute; top:8px; left:50%; margin-left:-1px; width:2px; height:26px; background:#5c3a10; z-index:2; }
  .flag::after{ content:""; position:absolute; top:0; left:2px; width:18px; height:12px; background:#c0392b;
    clip-path: polygon(0 0, 100% 20%, 0 40%, 0 60%, 100% 80%, 0 100%);
    transform-origin: left center; animation: wave 1.4s steps(4) infinite; }
  @keyframes wave{ 0%{ transform: scaleX(1) skewY(0deg); } 25%{ transform: scaleX(0.94) skewY(4deg); } 50%{ transform: scaleX(1) skewY(0deg); } 75%{ transform: scaleX(0.94) skewY(-4deg); } 100%{ transform: scaleX(1) skewY(0deg); } }
  .shine{ animation: shine-sweep 2.4s steps(3) infinite; }
  @keyframes shine-sweep{ 0%,70%{ filter:brightness(1); } 78%{ filter:brightness(1.7); } 86%{ filter:brightness(1); } 100%{ filter:brightness(1); } }
  .sparkle{ animation: sparkle 1.8s steps(1) infinite; }
  @keyframes sparkle{ 0%,60%{opacity:1;} 30%{opacity:0.35;} 100%{opacity:1;} }
  .character-stage{ position:absolute; left:0; right:0; bottom:14px; display:flex; gap:6px; justify-content:center; padding:0 12px; z-index:3; }
  .character-slot{ flex:1; max-width:180px; display:flex; flex-direction:column; align-items:center; }
  .bubble-slot{ min-height:34px; display:flex; align-items:flex-end; margin-bottom:6px; }
  .speech-bubble{ position:relative; background:#2a2118; border:2px solid #6b5738; border-radius:8px; padding:6px 9px; font-size:11.5px; font-weight:700; color:#f0e6d2; max-width:150px; margin:0 auto; text-align:center; word-break:break-word; }
  .speech-bubble::after{ content:""; position:absolute; bottom:-7px; left:50%; margin-left:-6px; border:6px solid transparent; border-top-color:#2a2118; }
  .speech-bubble::before{ content:""; position:absolute; bottom:-9px; left:50%; margin-left:-7px; border:7px solid transparent; border-top-color:#6b5738; }

  /* RPG 風格外框：仿木質雕刻邊框 + 四角鉚釘 */
  .rpg-frame{ position:relative; border-radius:6px;
    border: 5px solid; border-image: linear-gradient(155deg, #caa059, #7a4f24, #caa059) 1;
    background: linear-gradient(180deg, var(--frame-bg, rgba(40,30,20,0.85)), var(--frame-bg-2, rgba(25,18,12,0.9)));
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.35), 0 4px 10px rgba(0,0,0,0.4);
  }
  .rpg-corner{ position:absolute; width:11px; height:11px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ffe9b0, var(--frame-color, var(--gold)) 55%, #7a5a25 100%);
    border:1px solid #4a3620; box-shadow:0 1px 2px rgba(0,0,0,0.5); z-index:2; }
  .rpg-corner.tl{ top:-6px; left:-6px; } .rpg-corner.tr{ top:-6px; right:-6px; } .rpg-corner.bl{ bottom:-6px; left:-6px; } .rpg-corner.br{ bottom:-6px; right:-6px; }

  .avatar-panel{ width:100%; padding:14px 10px 10px; margin-bottom:8px; }
  .character-slot .avatar-wrap{ width:100%; max-width:78px; margin:0 auto; animation: breathe 3.6s ease-in-out infinite; }
  .character-slot .avatar-wrap img{ width:100%; height:auto; display:block; }
  @keyframes breathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.035); } }

  .info-panel{ width:100%; padding:9px 8px; text-align:center; }
  .info-panel .ctitle{ font-size:12.5px; font-weight:700; line-height:1.3; min-height:16px; text-shadow: 1px 1px 0 rgba(0,0,0,0.9), -1px -1px 0 rgba(0,0,0,0.9), 1px -1px 0 rgba(0,0,0,0.9), -1px 1px 0 rgba(0,0,0,0.9); }
  .info-panel .cname{ margin-top:3px; font-size:15px; font-weight:700; color:#fdf3d8; }
  .character-ground{ height:14px; background:linear-gradient(180deg,#b3a074,#8f7d54); position:relative; z-index:2; }

  .mode-switch{ display:flex; gap:6px; margin-bottom:16px; }
  .mode-switch button{ flex:1; padding:12px 4px; font-size:14px; font-weight:700; cursor:pointer; background:var(--panel); color:var(--ink-soft); border-radius:4px; border-color:var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light); border-style:solid; border-width:2px; font-family:"DotGothic16",sans-serif; display:flex; align-items:center; justify-content:center; gap:6px; }
  .mode-switch button.active{ background:var(--teal); color:#fff; border-color:#8fc0ab var(--teal-dark) var(--teal-dark) #8fc0ab; }

  label{ display:flex; align-items:center; gap:6px; font-size:14px; color:var(--ink-soft); margin:14px 0 5px; font-weight:700; }
  label:first-of-type{ margin-top:0; }
  input,select{ width:100%; padding:12px; font-size:16px; border-radius:4px; border-color:var(--panel-dark) var(--panel-light) var(--panel-light) var(--panel-dark); border-style:solid; border-width:2px; background:#fffdf5; color:#2b2620; font-family:"DotGothic16",sans-serif; }
  select{ appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%); background-position:calc(100% - 18px) center,calc(100% - 13px) center; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
  input:focus,select:focus{ outline:2px solid var(--teal); }
  input:disabled{ opacity:0.5; background:#eee; }

  button.primary{ width:100%; margin-top:16px; padding:15px; font-size:15px; font-weight:700; border-radius:4px; background:var(--teal); color:#fff; cursor:pointer; font-family:"DotGothic16",sans-serif; border-color:#8fc0ab var(--teal-dark) var(--teal-dark) #8fc0ab; border-style:solid; border-width:3px; box-shadow:0 3px 0 rgba(0,0,0,0.25); display:flex; align-items:center; justify-content:center; gap:8px; }
  button.primary:active{ transform:translateY(2px); box-shadow:none; }
  button.primary:disabled{ opacity:0.45; }
  button.primary.repay-mode{ background:var(--gold); border-color:#fbe6ae var(--gold-dark) var(--gold-dark) #fbe6ae; color:#2b2015; }
  button.secondary{ width:100%; margin-top:10px; padding:13px; font-size:14px; font-weight:700; border-radius:4px; background:var(--panel); color:var(--danger); cursor:pointer; border-color:var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light); border-style:solid; border-width:2px; }
  button.ghost{ width:100%; margin-top:8px; padding:11px; background:none; color:var(--ink-soft); font-size:13px; font-weight:700; border:none; cursor:pointer; }
  button.logout-in-menu{ width:100%; margin-top:18px; padding:13px; background:var(--danger); color:#fff; font-size:14px; font-weight:700; border-radius:4px; cursor:pointer; border-color:#e2897c var(--danger-dark) var(--danger-dark) #e2897c; border-style:solid; border-width:2px; display:flex; align-items:center; justify-content:center; gap:8px; }

  .status{ font-size:13px; margin-top:10px; min-height:16px; font-weight:700; }
  .status.error{ color:var(--danger); }
  .status.ok{ color:var(--teal-dark); }

  .month-block{ margin-bottom:16px; }
  .month-head{ display:flex; justify-content:space-between; align-items:baseline; font-size:13.5px; font-weight:700; border-bottom:2px dashed var(--panel-dark); padding-bottom:8px; margin-bottom:8px; }
  .person-row{ display:flex; justify-content:space-between; font-size:14px; padding:4px 0; color:var(--ink-soft); }
  .person-row .amt{ font-variant-numeric:tabular-nums; color:var(--ink); font-weight:700; }
  .items{ margin:6px 0 8px; padding-left:0; list-style:none; }
  .items li{ display:flex; justify-content:space-between; font-size:13.5px; align-items:center; padding:8px 8px 8px 10px; color:var(--ink-soft); border-left:3px solid var(--panel-dark); cursor:pointer; margin-bottom:4px; background:rgba(0,0,0,0.2); border-radius:3px; }
  .items li:active{ background:rgba(0,0,0,0.35); }
  .items li.repayment{ border-left-color:var(--gold); }
  .items li .tag{ font-size:10px; padding:2px 6px; margin-right:5px; background:var(--gold); color:var(--ink); font-weight:700; border-radius:3px; }
  .items li .date{ color:#96876a; margin-right:6px; font-variant-numeric:tabular-nums; }

  .empty{ font-size:14px; color:var(--ink-soft); text-align:center; padding:30px 0; font-weight:700; }
  .skeleton-line{ height:14px; margin-bottom:10px; border-radius:3px; background:linear-gradient(90deg,var(--panel-dark) 25%,var(--panel-light) 37%,var(--panel-dark) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; }
  @keyframes shimmer{ 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }

  canvas.chart{ max-height:280px; }

  .sub-tabs{ display:flex; gap:6px; margin-bottom:16px; }
  .sub-tabs button{ flex:1; padding:11px 2px; font-size:13px; font-weight:700; cursor:pointer; border-radius:4px; background:var(--panel); color:var(--ink-soft); border-color:var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light); border-style:solid; border-width:2px; font-family:"DotGothic16",sans-serif; }
  .sub-tabs button.active{ background:var(--gold-dark); color:#fff; }
  .sub-view{ display:none; } .sub-view.active{ display:block; }

  .person-select-row{ display:flex; gap:6px; margin-bottom:14px; }
  .person-select-row button{ flex:1; padding:10px 4px; font-size:14px; font-weight:700; cursor:pointer; border-radius:4px; background:var(--panel); color:var(--ink-soft); border-color:var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light); border-style:solid; border-width:2px; }
  .person-select-row button.active{ background:var(--teal); color:#fff; }

  .title-list{ display:flex; flex-direction:column; gap:8px; }
  .title-row{ display:flex; align-items:center; gap:10px; padding:12px; background:rgba(0,0,0,0.2); border:2px solid var(--panel-dark); border-radius:4px; border-left-width:6px; }
  .title-row.locked{ opacity:0.4; }
  .title-check{ width:22px; height:22px; border:2px solid var(--ink-soft); border-radius:4px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; cursor:pointer; background:#fff; }
  .title-check.checked{ background:var(--gold); border-color:var(--gold-dark); }
  .title-info .name{ font-size:14.5px; font-weight:700; }
  .title-info .req{ font-size:12px; color:var(--ink-soft); }

  .level-box{ background:rgba(0,0,0,0.2); border:2px solid var(--panel-dark); border-radius:4px; padding:18px; text-align:center; margin-bottom:14px; }
  .level-num{ font-family:"Press Start 2P",monospace; font-size:26px; color:var(--gold-dark); margin-bottom:4px; }
  .level-stage{ font-size:13px; color:var(--ink-soft); margin-bottom:10px; font-weight:700; }
  .xp-bar-outer{ height:20px; background:var(--panel-dark); border:2px solid var(--ink); border-radius:4px; overflow:hidden; }
  .xp-bar-inner{ height:100%; background:repeating-linear-gradient(90deg,var(--gold) 0 8px,var(--gold-dark) 8px 16px); }
  .xp-label{ font-size:12.5px; color:var(--ink-soft); margin-top:8px; font-weight:700; }

  .equip-layout{ display:flex; gap:12px; align-items:flex-start; }
  .equip-left{ flex:0 0 40%; position:sticky; top:8px; }
  .equip-preview{ text-align:center; margin-bottom:10px; }
  .equip-preview .avatar-wrap{ width:100%; max-width:130px; margin:0 auto; }
  .equip-preview .avatar-wrap img{ width:100%; height:auto; }
  .equip-btn-row{ display:flex; flex-direction:column; gap:6px; }
  .equip-right{ flex:1; display:flex; flex-direction:column; gap:6px; max-height:420px; overflow-y:auto; }
  .equip-row-item{ background:rgba(0,0,0,0.2); border:2px solid var(--panel-dark); border-radius:4px; display:flex; align-items:center; gap:8px; padding:7px 8px; cursor:pointer; position:relative; }
  .equip-row-item.locked{ opacity:0.4; cursor:default; }
  .equip-row-item.equipped{ border-color:var(--gold); background:rgba(201,161,90,0.28); }
  .equip-row-item .equip-icon{ width:26px; height:26px; flex-shrink:0; }
  .equip-row-item .equip-name{ font-size:12.5px; font-weight:700; flex:1; }
  .equip-row-item .equip-req{ font-size:10px; color:var(--ink-soft); }
  .equip-row-item .equip-check{ font-size:14px; color:var(--teal-dark); }
  .equip-all-btn, .equip-none-btn{ width:100%; padding:11px; font-size:12.5px; font-weight:700; border-radius:4px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
  .equip-all-btn{ background:var(--gold); color:#2b2015; border-color:#fbe6ae var(--gold-dark) var(--gold-dark) #fbe6ae; border-style:solid; border-width:2px; }
  .equip-none-btn{ background:var(--panel); color:var(--ink-soft); border-color:var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light); border-style:solid; border-width:2px; }
  .equip-color-row{ display:flex; gap:5px; margin-top:6px; flex-wrap:wrap; }
  .equip-color-dot{ width:18px; height:18px; border-radius:50%; border:2px solid rgba(0,0,0,0.3); cursor:pointer; }
  .equip-color-dot.selected{ border-color:var(--ink); box-shadow:0 0 0 2px var(--gold); }
  .pet-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }

// 外部程式庫延遲載入(用到才下載，避免一開始畫面卡住空白)
const _scriptCache = {};
function loadScript(src){
  if (_scriptCache[src]) return _scriptCache[src];
  _scriptCache[src] = new Promise((resolve,reject)=>{
    const s=document.createElement('script'); s.src=src;
    s.onload=()=>resolve(); s.onerror=()=>reject(new Error("載入失敗："+src));
    document.head.appendChild(s);
  });
  return _scriptCache[src];
}

function petIconDataURL(pet, size){
  size = size || 24;
  const c=document.createElement('canvas'); c.width=size; c.height=size*1.1;
  const ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=false;

  const headCY = size*0.34;
  const bodyCY = pet.elongated ? size*0.55 : size*0.68;
  const bodyRX = pet.elongated ? size*0.16 : size*0.26;
  const bodyRY = pet.elongated ? size*0.34 : size*0.24;
  ctx.strokeStyle="#241a10"; ctx.lineWidth=Math.max(1,size*0.055);

  // 尾巴(畫在身體後面，較底層)

  const tx = mid+bodyRX*0.8, ty = bodyCY+bodyRY*0.2;
  ctx.beginPath();
  switch(pet.tail){
    case "thin": ctx.moveTo(tx,ty); ctx.quadraticCurveTo(tx+size*0.22,ty-size*0.05,tx+size*0.26,ty+size*0.1); ctx.lineWidth=size*0.05; ctx.strokeStyle=pet.color; ctx.stroke(); ctx.strokeStyle="#241a10"; break;

    case "thick": ctx.rect(tx,ty-size*0.05,size*0.2,size*0.1); ctx.fill(); ctx.stroke(); break;
    case "puff": ctx.arc(tx+size*0.08,ty,size*0.09,0,Math.PI*2); ctx.fill(); ctx.stroke(); break;
    case "long": ctx.moveTo(tx,ty); ctx.quadraticCurveTo(tx+size*0.3,ty+size*0.1,tx+size*0.24,ty+size*0.28); ctx.lineWidth=size*0.07; ctx.strokeStyle=pet.color; ctx.stroke(); ctx.strokeStyle="#241a10"; break;
    case "flow": ctx.moveTo(tx,ty-size*0.05); ctx.quadraticCurveTo(tx+size*0.2,ty+size*0.15,tx+size*0.1,ty+size*0.32); ctx.lineWidth=size*0.08; ctx.strokeStyle=pet.color; ctx.stroke(); ctx.strokeStyle="#241a10"; break;
    case "curl": ctx.arc(tx+size*0.14,ty,size*0.11,0,Math.PI*1.5); ctx.lineWidth=size*0.05; ctx.strokeStyle=pet.color; ctx.stroke(); ctx.strokeStyle="#241a10"; break;
    case "fan": for(let i=-1;i<=1;i++){ ctx.moveTo(tx,ty); ctx.lineTo(tx+size*0.2,ty+i*size*0.12); } ctx.lineWidth=size*0.05; ctx.strokeStyle="#c0392b"; ctx.stroke(); ctx.strokeStyle="#241a10"; break;
    case "wag": ctx.moveTo(tx,ty); ctx.quadraticCurveTo(tx+size*0.18,ty-size*0.15,tx+size*0.1,ty-size*0.26); ctx.lineWidth=size*0.06; ctx.strokeStyle=pet.color; ctx.stroke(); ctx.strokeStyle="#241a10"; break;
    case "curly": ctx.arc(tx+size*0.08,ty,size*0.07,0,Math.PI*2.4); ctx.lineWidth=size*0.045; ctx.strokeStyle=pet.color; ctx.stroke(); ctx.strokeStyle="#241a10"; break;
    default: break;
  }

  // 四肢(蛇沒有腳)
  if (pet.legs){
    ctx.fillStyle = shadeColor(pet.color,-15);
    const legY = bodyCY+bodyRY*0.75, legH = size*0.14;
    [mid-bodyRX*0.55, mid+bodyRX*0.15].forEach(lx=>{
      ctx.fillRect(lx, legY, size*0.09, legH);
      ctx.strokeRect(lx, legY, size*0.09, legH);
    });
  }

  // 身體
  ctx.beginPath(); ctx.ellipse(mid,bodyCY,bodyRX,bodyRY,0,0,Math.PI*2); ctx.fillStyle=pet.color; ctx.fill(); ctx.stroke();
  if (pet.stripes){
    ctx.strokeStyle="#5c3a10"; ctx.lineWidth=size*0.035;
    for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.moveTo(mid+i*bodyRX*0.4, bodyCY-bodyRY*0.7); ctx.lineTo(mid+i*bodyRX*0.4, bodyCY+bodyRY*0.7); ctx.stroke(); }
    ctx.strokeStyle="#241a10";
  }

  // 頭 + 耳朵/特徵
  ctx.beginPath();

  else if (pet.ear==="long"){ ctx.ellipse(mid-headR*0.5,headCY-headR*1.7,headR*0.24,headR*0.75,0,0,Math.PI*2); ctx.ellipse(mid+headR*0.5,headCY-headR*1.7,headR*0.24,headR*0.75,0,0,Math.PI*2); }

  else if (pet.ear==="mane"){ ctx.fillStyle=shadeColor(pet.color,-25); ctx.fillRect(mid-headR*1.15,headCY-headR*1.3,headR*2.3,headR*0.7); ctx.fillStyle=pet.color; }
  else if (pet.ear==="comb"){ ctx.fillStyle="#c0392b"; ctx.fillRect(mid-headR*0.35,headCY-headR*1.7,headR*0.7,headR*0.6); ctx.fillStyle=pet.color; }

  ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(mid,headCY,headR,0,Math.PI*2); ctx.fillStyle=pet.color; ctx.fill(); ctx.stroke();
  // 眼睛
  ctx.fillStyle="#241a10";
  ctx.beginPath(); ctx.arc(mid-headR*0.4,headCY,headR*0.16,0,Math.PI*2); ctx.arc(mid+headR*0.4,headCY,headR*0.16,0,Math.PI*2); ctx.fill();
  return c.toDataURL();
}

function px(ctx,x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h))); }

function drawHair(ctx, style, gender, hx,hy,hw,hh, color){
  let s = style; if (!s||s==="auto") s = gender==="female" ? "long" : "short";
  const c=color, c2=shadeColor(color,-22);
  switch(s){
    case "bald":
      return;
    case "short":
      px(ctx,hx-2,hy-3,hw+4,hh*0.38,c);
      px(ctx,hx-2,hy-3,hw+4,3,c2);
      return;
    case "long":
      px(ctx,hx-3,hy-3,hw+6,hh*0.4,c);
      px(ctx,hx-3,hy+hh*0.15,4,hh*0.95,c);
      px(ctx,hx+hw-1,hy+hh*0.15,4,hh*0.95,c);
      px(ctx,hx-3,hy-3,hw+6,3,c2);
      return;
    case "ponytail":
      px(ctx,hx-2,hy-3,hw+4,hh*0.35,c);
      px(ctx,hx+hw-2,hy+hh*0.05,5,hh*1.05,c);
      px(ctx,hx-2,hy-3,hw+4,3,c2);
      return;
    case "twintails":
      px(ctx,hx-2,hy-3,hw+4,hh*0.32,c);
      px(ctx,hx-6,hy+hh*0.1,5,hh*0.9,c);
      px(ctx,hx+hw+1,hy+hh*0.1,5,hh*0.9,c);
      px(ctx,hx-2,hy-3,hw+4,3,c2);
      return;
    case "bun":
      px(ctx,hx-2,hy-3,hw+4,hh*0.3,c);
      px(ctx,hx+hw*0.5-4,hy-11,8,8,c);
      px(ctx,hx-2,hy-3,hw+4,3,c2);
      return;
    case "curly": {
      ctx.fillStyle=c;
      const cx=hx+hw/2, cy=hy+hh*0.06;
      ctx.beginPath(); ctx.ellipse(cx,cy,hw*0.68,hh*0.42,0,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle="#241a10"; ctx.lineWidth=1.4; ctx.stroke();
      // 捲髮質感：外緣一圈凸起小球
      for (let a=0;a<Math.PI*2;a+=Math.PI/6){
        px(ctx,cx+Math.cos(a)*hw*0.62-2,cy+Math.sin(a)*hh*0.38-2,4,4,c);
      }
      return;
    }
    case "mohawk":
      px(ctx,hx-1,hy+hh*0.05,hw+2,hh*0.1,color==="#c7c2ba"?c:shadeColor(c,20));
      px(ctx,hx+hw*0.5-3,hy-14,6,15,c);
      px(ctx,hx+hw*0.5-3,hy-14,6,3,c2);
      return;
    default:
      px(ctx,hx-2,hy-3,hw+4,hh*0.38,c);
      return;
  }
}
function drawStar(ctx,cx,cy,r,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const a1=(-90+i*72)*Math.PI/180, a2=(-90+i*72+36)*Math.PI/180;
    ctx[i===0?"moveTo":"lineTo"](cx+Math.cos(a1)*r, cy+Math.sin(a1)*r);
    ctx.lineTo(cx+Math.cos(a2)*r*0.42, cy+Math.sin(a2)*r*0.42);
  }
  ctx.closePath(); ctx.fill();
}
function drawStarOutline(ctx,cx,cy,r){
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const a1=(-90+i*72)*Math.PI/180, a2=(-90+i*72+36)*Math.PI/180;
    ctx[i===0?"moveTo":"lineTo"](cx+Math.cos(a1)*r, cy+Math.sin(a1)*r);
    ctx.lineTo(cx+Math.cos(a2)*r*0.42, cy+Math.sin(a2)*r*0.42);
  }
  ctx.closePath(); ctx.stroke();
}
function drawEyes(ctx, style, hx,hy,hw,hh){
  const cy=hy+hh*0.48, cx1=hx+hw*0.28, cx2=hx+hw*0.72;

  switch(style){
    case "round":
      px(ctx,cx1-2,cy-2.5,4,5,ink); px(ctx,cx1-1.6,cy-2,1.6,1.6,'#fff');
      px(ctx,cx2-2,cy-2.5,4,5,ink); px(ctx,cx2-1.6,cy-2,1.6,1.6,'#fff');

      return;

      px(ctx,cx1-2,cy-2.5,4,5,ink); px(ctx,cx2-2,cy-2.5,4,5,ink);

}
function shadeColor(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=(n>>8&0xff)+amt, b=(n&0xff)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return "#"+(r<<16|g<<8|b).toString(16).padStart(6,"0");
}

function outlineAndComposite(art){
  const w=art.width, h=art.height;
  const actx = art.getContext('2d');
  const img = actx.getImageData(0,0,w,h);
  const outCanvas = document.createElement('canvas'); outCanvas.width=w; outCanvas.height=h;
  const outCtx = outCanvas.getContext('2d');
  const outImg = outCtx.createImageData(w,h);
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const i=(y*w+x)*4;
    if (img.data[i+3]===0){
      let hit=false;
      for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=x+dx, ny=y+dy;
        if (nx<0||ny<0||nx>=w||ny>=h) continue;
        if (img.data[(ny*w+nx)*4+3]>0){ hit=true; break; }
      }
      if (hit){ outImg.data[i]=0x24; outImg.data[i+1]=0x1a; outImg.data[i+2]=0x10; outImg.data[i+3]=255; }
    }
  }
  outCtx.putImageData(outImg,0,0);
  const finalC = document.createElement('canvas'); finalC.width=w; finalC.height=h;
  const fctx = finalC.getContext('2d'); fctx.imageSmoothingEnabled=false;
  fctx.drawImage(outCanvas,0,0); fctx.drawImage(art,0,0);
  return finalC;
}
function buildCharacterCanvas(profile, cumulative){
  const stage = stageFor(ageFor(cumulative));
  const cfg = STAGE_CFG[stage];
  const art = document.createElement('canvas'); art.width=CW; art.height=CH;
  const ctx = art.getContext('2d'); ctx.imageSmoothingEnabled=false;

  const skin = SKIN_TONES[profile.skinTone]||SKIN_TONES.medium;
  const cheek = '#e8a687';
  const hairColor = stage==="elder" ? '#c7c2ba' : '#3a2818';
  const bs = BODY_SHAPE[profile.bodyType] || BODY_SHAPE.regular;
  const faceShape = profile.faceShape || "round";
  const faceW = {round:1, square:1.02, long:0.82, sharp:0.86}[faceShape] || 1;
  const faceH = {round:1, square:0.96, long:1.22, sharp:1.06}[faceShape] || 1;
  const headRadiusRatio = {round:0.42, square:0.08, long:0.24, sharp:0.14}[faceShape] || 0.4;

  const headW=Math.round(29*cfg.headScale*faceW), headH=Math.round(24*cfg.headScale*faceH);
  const headX=Math.round((CW-headW)/2), headY=20;
  const torsoBaseW=19*cfg.headScale*0+19, torsoH=Math.round(24*cfg.bodyScale*bs.hMul);
  const torsoTopW=Math.round(torsoBaseW*bs.topW), torsoBotW=Math.round(torsoBaseW*bs.botW);
  const torsoW=Math.max(torsoTopW,torsoBotW);
  const torsoX=Math.round((CW-torsoW)/2), torsoY=headY+headH-1;
  const armW=Math.round(5*bs.limbW), armH=Math.round(20*cfg.bodyScale*bs.hMul), armY=torsoY+4;
  const armLX=torsoX-armW, armRX=torsoX+torsoW;
  const legW=Math.round(5*bs.limbW), legH=Math.max(5,Math.round(12*cfg.bodyScale*bs.hMul)), legY=torsoY+torsoH-3;
  const leg1X=torsoX+3, leg2X=torsoX+torsoW-3-legW;
  const b={torsoX,torsoY,torsoW,torsoH,headX,headY,headW,headH,armLX,armRX,armY,armW,armH,leg1X,leg2X,legY,legW,legH};

  const skinShadow = shadeColor(skin, -18);
  px(ctx,leg1X,legY,legW,legH,skin); px(ctx,leg2X,legY,legW,legH,skin);
  px(ctx,leg1X,legY+legH-3,legW,3,skinShadow); px(ctx,leg2X,legY+legH-3,legW,3,skinShadow);
  px(ctx,armLX,armY,armW,armH,skin); px(ctx,armRX,armY,armW,armH,skin);
  drawTorso(ctx, profile.gender, torsoX,torsoY,torsoW,torsoH, skin, skinShadow);
  // 頭型：方臉直角、尖臉切出 V 形下巴、其餘用正確內縮的圓角(修正先前圓角中心點沒內縮、導致破臉的 bug)
  const maxHr = Math.min(headW, headH) * 0.48;
  const hr = Math.min(headW*headRadiusRatio, maxHr);
  if (faceShape==="square"){
    px(ctx,headX,headY,headW,headH,skin);
  } else if (faceShape==="sharp"){
    px(ctx,headX,headY,headW,headH,skin);
    ctx.globalCompositeOperation = "destination-out";
    const cut = headW*0.22;
    ctx.beginPath(); ctx.moveTo(headX,headY+headH-cut); ctx.lineTo(headX,headY+headH); ctx.lineTo(headX+cut,headY+headH); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(headX+headW,headY+headH-cut); ctx.lineTo(headX+headW,headY+headH); ctx.lineTo(headX+headW-cut,headY+headH); ctx.closePath(); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
  } else {
    ctx.fillStyle = skin;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(headX, headY, headW, headH, hr);
    else ctx.rect(headX, headY, headW, headH);
    ctx.fill();
  }
  px(ctx,headX+headW-4,headY+headH*0.42,3,headH*0.18,cheek); px(ctx,headX+1,headY+headH*0.42,3,headH*0.18,cheek);
  drawHair(ctx, profile.hairstyle, profile.gender, headX,headY,headW,headH, hairColor);
  drawEyes(ctx, profile.eyeStyle, headX,headY,headW,headH);
  drawMouth(ctx, profile.mouthStyle, headX,headY,headW,headH);
  (profile.equippedItems||[]).forEach(amt=>{
    const item = EQUIPMENT_ITEMS.find(e=>e.amount===amt);
    const customCol = (profile.itemColors||{})[amt];
    if (item) drawEquip(ctx,item.name,b,customCol);
  });

  const composited = outlineAndComposite(art);

  // 光環：真正的暈光效果(獨立圖層 + 模糊濾鏡)，畫在角色下方，最多顯示 2 色
  const level=levelFor(cumulative);
  const maxUnlocked=Math.min(RAINBOW.length, Math.floor(level/3));
  const activeGlow=(profile.glowColors||[]).filter(i=>i<maxUnlocked).slice(0,2);
  let finalOut = composited;
  if (activeGlow.length){
    const gc = document.createElement('canvas'); gc.width=CW; gc.height=CH;
    const gctx = gc.getContext('2d'); gctx.imageSmoothingEnabled=true;
    const headRadius = headW*({round:0.42,square:0.08,long:0.24,sharp:0.14}[profile.faceShape]||0.42);
    activeGlow.forEach((idx,i)=>{
      gctx.save();
      gctx.globalCompositeOperation = 'lighter';
      const pad = 2 + i*2.5;
      gctx.filter = `blur(${3+i*2}px)`;
      gctx.fillStyle = RAINBOW[idx].c;
      gctx.globalAlpha = 1;
      [[leg1X,legY,legW,legH,3],[leg2X,legY,legW,legH,3],[armLX,armY,armW,armH,3],[armRX,armY,armW,armH,3],
       [torsoX,torsoY,torsoW,torsoH,4],[headX,headY,headW,headH,headRadius]].forEach(([x,y,w,h,r])=>{
        gctx.beginPath();
        if (gctx.roundRect) gctx.roundRect(x-pad,y-pad,w+pad*2,h+pad*2,r+pad); else gctx.rect(x-pad,y-pad,w+pad*2,h+pad*2);
        gctx.fill();
      });
      gctx.restore();
    });
    const merged = document.createElement('canvas'); merged.width=CW; merged.height=CH;
    const mctx = merged.getContext('2d'); mctx.imageSmoothingEnabled=false;
    mctx.drawImage(gc,0,0); mctx.drawImage(composited,0,0);
    finalOut = merged;
  }
  return { canvas: finalOut, head:{headX,headY,headW,headH} };
}
function avatarDataURL(profile, cumulative, mode){
  const { canvas, head } = buildCharacterCanvas(profile, cumulative);
  if (mode==="portrait"){
    // 固定裁切畫布最上方一段(涵蓋所有年齡階段的頭髮+頭部+一點肩膀)，避免負座標裁切問題
    const cropH = Math.min(CH, Math.round(head.headY + head.headH + 8));
    const out = document.createElement('canvas'); out.width=CW; out.height=cropH;
    const octx = out.getContext('2d'); octx.imageSmoothingEnabled=false;
    octx.drawImage(canvas, 0, 0, CW, cropH, 0, 0, CW, cropH);
    return out.toDataURL();
  }
  return canvas.toDataURL();
}

function drawPixelText(ctx, text, x, y, scale, color){
  let cx = x;

    cx += 6*scale;
  }

async function fetchJson(url, opts){
  let lastErr;
  for (let attempt=0; attempt<2; attempt++){
    try{
      const controller = new AbortController();
      const timeoutId = setTimeout(()=>controller.abort(), 10000);
      const res = await fetch(url, {...opts, signal: controller.signal});
      clearTimeout(timeoutId);
      const text = await res.text();
      try { return JSON.parse(text); }
      catch(e){ throw new Error("伺服器回應非 JSON，請確認 Apps Script 已重新部署為最新版本"); }
    } catch(err){
      if (err.name === "AbortError") lastErr = new Error("連線逾時(10秒無回應)，請確認網路連線或稍後再試");
      else lastErr = err;
      if (attempt===0) await new Promise(r=>setTimeout(r,800));
    }
  }
  throw lastErr;
}

    return;

    const json=await fetchJson(url,{method:"GET"});

    allRecords=json.data.map(r=>({id:r.id,timestamp:safeDate(r.timestamp),person:r.person,item:r.item,amount:Number(r.amount)||0,type:r.type||"expense"})).sort((a,b)=>a.timestamp-b.timestamp);
    profiles=json.profiles||[];
    allMessages=(json.messages||[]).map(m=>({id:m.id,timestamp:safeDate(m.timestamp),sender:m.sender,text:m.text,readBy:m.readBy||[]})).sort((a,b)=>a.timestamp-b.timestamp);
    allInvestments=(json.investments||[]).map(i=>({id:i.id,person:i.person,startDate:i.startDate,amount:Number(i.amount)||0})).sort((a,b)=>a.startDate.localeCompare(b.startDate));

}

async function submitRecord(){ return currentMode==="expense" ? submitExpense() : submitRepay(); }
async function submitExpense(){
  const person=document.getElementById("inputPerson").value, date=document.getElementById("inputDate").value;
  const item=document.getElementById("inputItem").value.trim(), amount=parseFloat(document.getElementById("inputAmount").value);
  const statusEl=document.getElementById("submitStatus");
  if (!person||!date||!item||isNaN(amount)){ statusEl.textContent="請完整填寫人員、日期、名目、金額"; statusEl.className="status error"; return; }
  const dup = allRecords.some(r=>r.type==="expense" && toDateInputValue(r.timestamp)===date && r.item===item && r.amount===amount);
  if (dup && !confirm(`已經有一筆「${date} ${item} $${amount}」的紀錄了，確定要再新增一筆嗎？`)) return;
  await postAndReload({action:"create",person,item,amount,date}, statusEl, ()=>{ document.getElementById("inputItem").value=""; document.getElementById("inputAmount").value=""; setDefaultDates(); });
}
async function submitRepay(){
  const person=document.getElementById("repayPerson").value, date=document.getElementById("repayDate").value;
  const amount=parseFloat(document.getElementById("repayAmount").value), note=document.getElementById("repayNote").value.trim();
  const statusEl=document.getElementById("submitStatus");
  if (!person){ statusEl.textContent="請先選擇要還給誰"; statusEl.className="status error"; return; }
  if (!date||isNaN(amount)){ statusEl.textContent="請填寫日期與金額"; statusEl.className="status error"; return; }
  await postAndReload({action:"repay",person,amount,date,note}, statusEl, ()=>{
    document.getElementById("repayPerson").value=""; document.getElementById("repayAmount").value="";
    document.getElementById("repayAmount").disabled=true; document.getElementById("repayAmount").placeholder="請先選擇要還給誰";
    document.getElementById("repayNote").value=""; setDefaultDates();
  });
}
async function postAndReload(payload, statusEl, onSuccess){
  const btn=document.getElementById("submitBtn");
  btn.disabled=true; statusEl.textContent="送出中…"; statusEl.className="status";
  try{
    const json=await fetchJson(CONFIG.WEB_APP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:sessionKey,...payload})});
    if (json.status!=="success") throw new Error(json.message||"寫入失敗");
    statusEl.textContent="已記錄！"; statusEl.className="status ok";
    onSuccess(); await loadRecords();
  } catch(err){ statusEl.textContent="送出失敗："+err.message; statusEl.className="status error"; }
  finally{ btn.disabled=false; }
}

function groupByMonth(){
  const groups={};
  allRecords.forEach(r=>{
    const key=monthKeyOf(r.timestamp);
    if(!groups[key]) groups[key]={total:0,byPerson:{},items:[]};
    if (r.type==="expense"){ groups[key].total+=r.amount; groups[key].byPerson[r.person]=(groups[key].byPerson[r.person]||0)+r.amount; }
    groups[key].items.push(r);
  });
  return groups;
}
function personColor(name){
  const p = profiles.find(x=>x.name===name);
  return (p && p.themeColor) || "#8a7255";
}
function personColorText(name){
  const c = personColor(name);
  const n = parseInt(c.slice(1),16);
  const r=(n>>16)&0xff, g=(n>>8)&0xff, b=n&0xff;
  const brightness = (r*299+g*587+b*114)/1000;
  return brightness < 150 ? shadeColor(c, 95) : c;
}
function renderLedger(){
  const groups=groupByMonth(); const keys=Object.keys(groups).sort().reverse();
  const body=document.getElementById("ledgerBody");
  if (keys.length===0){ body.innerHTML='<div class="empty">還沒有任何紀錄</div>'; return; }
  let html="";
  keys.forEach(key=>{
    const g=groups[key];
    const persons=Object.entries(g.byPerson).sort((a,b)=>b[1]-a[1]);
    const itemsHtml=g.items.slice().reverse().map(r=>{
      const color = personColor(r.person), textColor = personColorText(r.person);
      if (r.type==="repayment"){
        return `<li class="repayment" data-id="${r.id}" style="border-left-color:${color};">
          <span><span class="date">${dateLabel(r.timestamp)}</span><span class="tag" style="background:${color};color:#1a1410;">🔁 還給 ${r.person}</span>${r.item}</span>
          <span>${fmt(r.amount)}</span></li>`;
      }
      return `<li data-id="${r.id}" style="border-left-color:${color};">
        <span><span class="date">${dateLabel(r.timestamp)}</span><b style="color:${textColor};">${r.person}</b> 墊付 · ${r.item}</span>
        <span>${fmt(r.amount)}</span></li>`;
    }).join("");
    html += `<div class="month-block"><div class="month-head"><span>${key} 月結(支出)</span><span class="amt">${fmt(g.total)}</span></div>${persons.map(([p,amt])=>`<div class="person-row"><span style="color:${personColorText(p)};font-weight:700;">● ${p}</span><span class="amt">${fmt(amt)}</span></div>`).join("")}<ul class="items">${itemsHtml}</ul></div>`;
  });
  body.innerHTML=html;
  body.querySelectorAll(".items li").forEach(li=>li.addEventListener("click",()=>openEdit(li.dataset.id)));
}

async function renderChart(){
  await ensureChartJs();
  const type=document.getElementById("chartType").value;
  const personSel=document.getElementById("chartPerson");
  if (!personSel.dataset.filled){
    personSel.innerHTML = '<option value="__all__">👥 總計(不分人員)</option><option value="__compare__">🆚 兩人比較(同時顯示)</option>' + personNames().map(n=>`<option value="${n}">${n}</option>`).join("");
    personSel.dataset.filled = "1";
  }
  const personFilter = personSel.value;
  const ctx=document.getElementById("mainChart").getContext("2d");
  const allExpense = allRecords.filter(r=>r.type==="expense");
  const monthKeysAll = [...new Set(allExpense.map(r=>monthKeyOf(r.timestamp)))].sort();
  const palette = ["#c85a3f","#4d7c8a","#c9a15a","#6b4c7a","#8b2942","#2d3561"];
  let data, chartType = type;

  if (type==="pie"){
    const totals={}; allExpense.forEach(r=>{totals[r.person]=(totals[r.person]||0)+r.amount;});
    const labels=Object.keys(totals);
    data={ labels, datasets:[{ data:labels.map(l=>totals[l]), backgroundColor:palette }] };
  } else if (type==="bubble"){
    const names = personNames();
    data={ datasets: names.map((name,i)=>({
      label:name,
      backgroundColor: (personColor(name))+"aa",
      data: allExpense.filter(r=>r.person===name).map(r=>({ x: monthKeysAll.indexOf(monthKeyOf(r.timestamp)), y: r.amount, r: Math.max(4,Math.min(28, r.amount/4000)) }))
    })) };
    chartType="bubble";
  } else if (type==="radar"){
    const names = personFilter==="__compare__" ? personNames() : (personFilter==="__all__" ? ["總計"] : [personFilter]);
    data={ labels: monthKeysAll, datasets: names.map((name,i)=>{
      const recs = name==="總計" ? allExpense : allExpense.filter(r=>r.person===name);
      const g={}; recs.forEach(r=>{ const k=monthKeyOf(r.timestamp); g[k]=(g[k]||0)+r.amount; });
      return { label:name, data: monthKeysAll.map(k=>g[k]||0), borderColor: name==="總計"?"#8a6a3f":personColor(name), backgroundColor:(name==="總計"?"#8a6a3f":personColor(name))+"33" };
    })};
    chartType="radar";
  } else {
    // line / bar
    if (personFilter==="__compare__"){
      const names = personNames();
      data={ labels:monthKeysAll, datasets: names.map(name=>{
        const g={}; allExpense.filter(r=>r.person===name).forEach(r=>{ const k=monthKeyOf(r.timestamp); g[k]=(g[k]||0)+r.amount; });
        const col = personColor(name);
        return { label:name+" 每月支出", data:monthKeysAll.map(k=>g[k]||0), borderColor:col, backgroundColor: type==="bar"?col:col+"33", fill:type==="line", tension:0.3, pointBackgroundColor:col, borderWidth:2 };
      })};
    } else {
      const filtered = personFilter==="__all__" ? allExpense : allExpense.filter(r=>r.person===personFilter);
      const g={}; filtered.forEach(r=>{ const k=monthKeyOf(r.timestamp); g[k]=(g[k]||0)+r.amount; });
      data={ labels:monthKeysAll, datasets:[{ label:(personFilter==="__all__"?"總計":personFilter)+" 每月支出總額", data:monthKeysAll.map(k=>g[k]||0), borderColor:"#8a6a3f", backgroundColor: type==="bar"?"#4d7c8a":"rgba(77,124,138,0.25)", fill:type==="line", tension:0.3, pointBackgroundColor:"#c85a3f", borderWidth:2 }] };
    }
  }
  if (chartInstance) chartInstance.destroy();
  const scales = (chartType==="pie"||chartType==="radar") ? {} : (chartType==="bubble" ? { x:{ ticks:{ callback:v=>monthKeysAll[v]||"" } }, y:{ beginAtZero:true } } : { y:{ beginAtZero:true } });
  chartInstance=new Chart(ctx,{ type: chartType, data, options:{ responsive:true, plugins:{legend:{display:true,position:chartType==="pie"?"bottom":"top"}}, scales } });
}

function renderPetGrid(cumulative){

  let html = PET_ITEMS.filter(i=>unlocked.includes(i.amount)).map(pet=>{

function togglePet(petName){
  const profile=currentProfile(); if(!profile) return;
  const current=profile.equippedPets||[];
  let newList;
  if (current.includes(petName)) newList = current.filter(p=>p!==petName);
  else {
    if (current.length>=3){ alert("最多只能同時攜帶 3 隻寵物，請先取消其他隻"); return; }
    newList = [...current, petName];
  }
  patchProfileLocalThenSync(profile,{equippedPets:newList});
}

}
function renderLevelBox(cumulative){
  const level=levelFor(cumulative), stage=stageFor(ageFor(cumulative));
  const cur=level*10000, next=(level+1)*10000;
  const progress=Math.min(100, Math.round(((cumulative-cur)/(next-cur))*100));
  document.getElementById("levelBox").innerHTML = `
    <div class="level-num">Lv. ${level}</div>
    <div class="level-stage">${STAGE_LABEL[stage]}(約 ${ageFor(cumulative)} 歲)</div>
    <div class="xp-bar-outer"><div class="xp-bar-inner" style="width:${progress}%"></div></div>
    <div class="xp-label">${fmt(cumulative)} / ${fmt(next)}(距離下一等級還差 ${fmt(next-cumulative)})</div>`;
}
function renderEquipGrid(cumulative){
  const profile=currentProfile();
  const unlocked=unlockedEquipmentThresholds(cumulative), equipped=(profile&&profile.equippedItems)||[], nextItem=nextEquipmentItem(cumulative);
  const itemColors = (profile&&profile.itemColors)||{};
  document.getElementById("equipPreviewAvatar").innerHTML = profile ? `<img class="pixel" src="${avatarDataURL(profile, cumulative, 'full')}" />` : "";
  let html = EQUIPMENT_ITEMS.filter(i=>unlocked.includes(i.amount)).map(item=>{
    const isEquipped=equipped.includes(item.amount);
    const curColor = itemColors[item.amount] || item.color;
    const colorRow = isEquipped ? `<div class="equip-color-row" data-color-for="${item.amount}">${EQUIP_COLOR_CHOICES.map(c=>`<div class="equip-color-dot ${curColor===c?"selected":""}" data-color="${c}" style="background:${c};"></div>`).join("")}</div>` : "";
    return `<div>
      <div class="equip-row-item ${isEquipped?"equipped":""}" data-threshold="${item.amount}">
        <img class="equip-icon pixel" src="${equipIconDataURL(item.name, curColor)}" />
        <div class="equip-name">${item.name}</div><div class="equip-req">滿 ${fmt(item.amount)}</div>
        ${isEquipped?'<div class="equip-check">✓</div>':""}
      </div>
      ${colorRow}
    </div>`;
  }).join("");
  if (nextItem){ html += `<div class="equip-row-item locked"><img class="equip-icon pixel" src="${equipIconDataURL(nextItem.name,"#999")}" /><div class="equip-name">${nextItem.name}</div><div class="equip-req">滿 ${fmt(nextItem.amount)} 解鎖</div></div>`; }
  document.getElementById("equipGrid").innerHTML = html;
  document.querySelectorAll(".equip-row-item[data-threshold]").forEach(el=>el.addEventListener("click",()=>toggleEquip(Number(el.dataset.threshold))));
  document.querySelectorAll(".equip-color-row").forEach(row=>{
    row.querySelectorAll(".equip-color-dot").forEach(dot=>{
      dot.addEventListener("click", e=>{
        e.stopPropagation();
        const amt = Number(row.dataset.colorFor);
        const p = currentProfile(); if(!p) return;
        const itemColors = {...(p.itemColors||{})};
        itemColors[amt] = dot.dataset.color;
        patchProfileLocalThenSync(p,{itemColors});
      });
    });
  });
}
function toggleEquip(threshold){
  const profile=currentProfile(); if(!profile) return;
  const current=profile.equippedItems||[];
  const newList = current.includes(threshold) ? current.filter(t=>t!==threshold) : [...current, threshold];
  patchProfileLocalThenSync(profile,{equippedItems:newList});
}
document.getElementById("equipAllBtn").addEventListener("click", ()=>{
  const profile=currentProfile(); if(!profile) return;
  const cumulative=cumulativeContribution(achievePersonName);
  patchProfileLocalThenSync(profile,{equippedItems:unlockedEquipmentThresholds(cumulative)});
});
document.getElementById("equipNoneBtn").addEventListener("click", ()=>{
  const profile=currentProfile(); if(!profile) return;
  patchProfileLocalThenSync(profile,{equippedItems:[]});
});

function patchProfileLocalThenSync(profile, patch){
  const idx=profiles.findIndex(p=>p.slot===profile.slot);
  const updated={...profile, ...patch};
  if (idx!==-1) profiles[idx]=updated;
  renderPlayerStrip(); renderCharacterStage(); renderAchieveContent();

  fetchJson(CONFIG.WEB_APP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({key:sessionKey,action:"updateProfile",slot:profile.slot,name:updated.name,
      birthdate:updated.birthdate||"",gender:updated.gender||"",equippedItems:updated.equippedItems||[],
      activeTitle:updated.activeTitle||"",hairstyle:updated.hairstyle||"",eyeStyle:updated.eyeStyle||"",
      faceShape:updated.faceShape||"",mouthStyle:updated.mouthStyle||"",bodyType:updated.bodyType||"",skinTone:updated.skinTone||"",
      themeColor:updated.themeColor||"",glowColors:updated.glowColors||[],
      equippedPets:updated.equippedPets||[],itemColors:updated.itemColors||{}})})
    .then(json=>{ if (json.status!=="success") throw new Error(json.message); })
    .catch(err=>{ alert("同步失敗，正在重新整理："+err.message); loadRecords(); });
}

function renderChatMessages(){
  const box = document.getElementById("chatMessages");
  if (!allMessages.length){ box.innerHTML = '<div class="chat-empty">還沒有任何悄悄話，說點什麼吧！</div>'; return; }
  box.innerHTML = allMessages.map(m=>{
    const isMe = m.sender===chatSpeaker;
    const time = m.timestamp.toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
    const readMark = isMe ? (m.readBy && m.readBy.some(r=>r!==m.sender) ? "已讀" : "已送出") : "";
    return `<div class="chat-bubble-row ${isMe?"me":"them"}">
      <div class="chat-sender">${isMe?"":m.sender}</div>
      <div class="chat-bubble">${escapeHtml(m.text)}</div>
      <div class="chat-meta">${time}${readMark?" · "+readMark:""}</div>
    </div>`;
  }).join("");
  box.scrollTop = box.scrollHeight;

  // 開啟時自動把對方傳的、我還沒讀過的訊息標記已讀
  if (chatSpeaker){
    const unreadIds = allMessages.filter(m=>m.sender!==chatSpeaker && !(m.readBy||[]).includes(chatSpeaker)).map(m=>m.id);
    if (unreadIds.length){
      unreadIds.forEach(id=>{ const m=allMessages.find(x=>x.id===id); if(m){ m.readBy=m.readBy||[]; m.readBy.push(chatSpeaker); } });
      fetchJson(CONFIG.WEB_APP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({key:sessionKey,action:"markRead",reader:chatSpeaker,ids:unreadIds})}).catch(()=>{});
    }
  }
}

async function sendChatMessage(){
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if (!text || !chatSpeaker) return;
  input.value = "";
  const tempId = "temp-"+Date.now();
  allMessages.push({id:tempId, timestamp:new Date(), sender:chatSpeaker, text, readBy:[chatSpeaker]});
  renderChatMessages();
  try{
    const json = await fetchJson(CONFIG.WEB_APP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({key:sessionKey,action:"sendMessage",sender:chatSpeaker,text})});

}

function daysBetween(dateStr1, dateStr2){
  const d1=new Date(dateStr1+"T00:00:00"), d2=new Date(dateStr2+"T00:00:00");
  return Math.floor((d2-d1)/86400000);
}
function investProfit(amount, startDate, asOfDate){
  const days = daysBetween(startDate, asOfDate);
  if (days<0) return {periods:0, profit:0};
  const periods = Math.floor(days/INVEST_PERIOD_DAYS);
  return { periods, profit: periods*amount*INVEST_RATE };
}
function renderInvestView(){
  const today = toDateInputValue(new Date());
  const statRow = document.getElementById("investStatRow");
  statRow.innerHTML = profiles.map(p=>{
    const myInv = allInvestments.filter(i=>i.person===p.name);
    const principal = myInv.reduce((s,i)=>s+i.amount,0);
    const profit = myInv.reduce((s,i)=>s+investProfit(i.amount,i.startDate,today).profit,0);
    return `<div class="invest-stat-card" style="${themeStyle(p)}">
      <div class="isp-name">${p.name}</div>
      <div class="isp-row"><span>🪙 投資代幣</span><b>${fmt(principal)}</b></div>
      <div class="isp-row"><span>💰 收到利潤</span><b>${fmt(profit)}</b></div>
      <div class="invest-rate-badge">投報率 每${INVEST_PERIOD_DAYS}天 ${(INVEST_RATE*100).toFixed(0)}%(年化 ${(INVEST_ANNUAL_RATE*100).toFixed(0)}%)</div>
    </div>`;
  }).join("");

  const personSel = document.getElementById("investPerson");
  if (!personSel.dataset.filled){ personSel.innerHTML = personNames().map(n=>`<option value="${n}">${n}</option>`).join(""); personSel.dataset.filled="1"; }

  const listEl = document.getElementById("investList");
  if (!allInvestments.length){ listEl.innerHTML='<div class="empty">還沒有任何投資紀錄</div>'; }
  else {
    listEl.innerHTML = allInvestments.slice().reverse().map(inv=>{
      const {periods,profit} = investProfit(inv.amount, inv.startDate, today);
      const color = personColor(inv.person), textColor = personColorText(inv.person);
      return `<div class="invest-item" data-id="${inv.id}" style="border-left-color:${color};">
        <div class="ii-main"><b style="color:${textColor};">${inv.person}</b> · ${inv.startDate} 投入<br><span style="color:var(--ink-soft);font-size:11px;">已滿 ${periods} 個週期</span></div>
        <div>
          <div class="ii-amt">${fmt(inv.amount)}</div>
          <div class="ii-profit">+${fmt(profit)} 利潤</div>
        </div>
      </div>`;
    }).join("");
    listEl.querySelectorAll(".invest-item").forEach(el=>{
      el.addEventListener("click", ()=>{
        const inv = allInvestments.find(i=>i.id===el.dataset.id);
        if (!inv) return;
        investDeleteId = inv.id;
        const {periods,profit} = investProfit(inv.amount, inv.startDate, today);
        document.getElementById("investDeleteInfo").innerHTML = `投資人：${inv.person}<br>起始日期：${inv.startDate}<br>投資金額：${fmt(inv.amount)}<br>已滿週期：${periods} 次<br>累積利潤：${fmt(profit)}`;
        document.getElementById("investDeleteOverlay").classList.add("show");
      });
    });
  }
}

document.getElementById("calcRunBtn").addEventListener("click", ()=>{
  const start = document.getElementById("calcStartDate").value;
  const end = document.getElementById("calcEndDate").value;
  const amount = parseFloat(document.getElementById("calcAmount").value);
  const resultEl = document.getElementById("calcResult");
  if (!start||!end||isNaN(amount)||amount<=0){ resultEl.innerHTML = '<div class="status error">請完整填寫起始日期、計算至日期、金額</div>'; return; }
  const days = daysBetween(start,end);
  if (days<0){ resultEl.innerHTML = '<div class="status error">「計算至」日期不能早於起始日期</div>'; return; }
  const {periods,profit} = investProfit(amount, start, end);
  resultEl.innerHTML = `<div class="calc-result-box">
    投資期間：${days} 天(滿 ${periods} 個 ${INVEST_PERIOD_DAYS} 天週期)<br>
    投資本金：${fmt(amount)}<br>
    累積利潤：<b style="color:var(--gold);">${fmt(profit)}</b><br>
    本利合計：<b>${fmt(amount+profit)}</b><br>
    <span style="font-size:11.5px;color:var(--ink-soft);">投報率：每${INVEST_PERIOD_DAYS}天 ${(INVEST_RATE*100).toFixed(0)}%(單利年化約 ${(INVEST_ANNUAL_RATE*100).toFixed(0)}%)</span>
  </div>`;
});

document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    btn.classList.add("active"); document.getElementById(btn.dataset.view).classList.add("active");
    if (btn.dataset.view==="view-chart") renderChart();
  });
});
document.querySelectorAll(".sub-tab-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".sub-tab-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".sub-view").forEach(v=>v.classList.remove("active"));
    btn.classList.add("active"); document.getElementById(btn.dataset.sub).classList.add("active");
  });
});

async function exportExcel(){
  const btn=document.getElementById("exportExcelBtn");
  btn.disabled=true; btn.textContent="📥 準備中…";
  try{
    await ensureXlsx();
  } catch(e){ alert("匯出工具載入失敗，請確認網路連線後再試一次"); btn.disabled=false; btn.textContent="📥 匯出 Excel 表"; return; }
  btn.disabled=false; btn.textContent="📥 匯出 Excel 表";
  if (typeof XLSX === "undefined"){ alert("匯出工具尚未載入，請確認網路連線後再試一次"); return; }
  const rows = allRecords.slice().sort((a,b)=>a.timestamp-b.timestamp).map(r=>({
    "日期": toDateInputValue(r.timestamp),
    "類型": r.type==="expense" ? "支出/墊付" : "現金入帳/還款",
    "人員": r.person,
    "項目/備註": r.item,
    "金額": r.amount
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  ws["!cols"] = [{wch:12},{wch:14},{wch:10},{wch:24},{wch:10}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "記帳明細");
  const summaryRows = [];
  personNames().forEach(name=>{
    summaryRows.push({ "人員": name, "累積貢獻": cumulativeContribution(name), "已收還款": repaidTotal(name), "貢獻總額(未歸還)": outstandingBalance(name) });
  });
  const ws2 = XLSX.utils.json_to_sheet(summaryRows);
  XLSX.utils.book_append_sheet(wb, ws2, "人員總覽");
  XLSX.writeFile(wb, `錢莊記帳_${toDateInputValue(new Date())}.xlsx`);
}
function boot(){
  document.getElementById("exportExcelBtn").addEventListener("click", exportExcel);
  setDefaultDates();
  document.getElementById("submitBtn").addEventListener("click", submitRecord);
  document.getElementById("chartType").addEventListener("change", renderChart);
  document.getElementById("chartPerson").addEventListener("change", renderChart);
  loadRecords();
}

initLogin();
