<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>錢莊</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#c9a15a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --gold:#c9a15a; --gold-dark:#96733a; --cream:#f0e6d2; --cream-dark:#d9c9a3; --cream-light:#faf3e2;
    --ink:#2b2620; --ink-soft:#6b5c44; --teal:#5b8a72; --teal-dark:#3d6650;
    --danger:#b33f32; --danger-dark:#7d2c22;
    --card:#f6ecd4; --panel:#e9d8ae; --panel-dark:#c2a565; --panel-light:#faf1dc;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ color:var(--ink); font-family:"DotGothic16","Noto Sans TC",sans-serif; font-size:16px; -webkit-tap-highlight-color:transparent; min-height:100vh; padding-bottom:92px; background:var(--cream); overflow-x:hidden; }
  h1,h2,h3{ font-family:"DotGothic16",sans-serif; letter-spacing:0.5px; }
  img.pixel{ image-rendering: pixelated; image-rendering: -moz-crisp-edges; image-rendering: crisp-edges; }

  .bevel-out{ border-style:solid; border-width:3px; border-top-color:rgba(255,255,255,0.6); border-left-color:rgba(255,255,255,0.6); border-right-color:rgba(0,0,0,0.35); border-bottom-color:rgba(0,0,0,0.35); box-shadow:0 3px 0 rgba(0,0,0,0.22); }

  #lockScreen{ position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; background:linear-gradient(180deg,#f7e0b8,#c9a15a); }
  .lock-card{ background:var(--card); border-radius:4px; padding:30px 22px; width:100%; max-width:320px; text-align:center; }
  .lock-mark{ width:60px; height:60px; margin:0 auto 16px; background:var(--gold); border:3px solid var(--gold-dark); display:flex; align-items:center; justify-content:center; color:var(--ink); font-size:26px; }
  .lock-card h2{ margin:0 0 16px; font-size:16px; line-height:1.9; }
  .lock-card input{ text-align:center; letter-spacing:3px; }
  #lockStatus{ min-height:18px; font-size:13px; margin-top:10px; color:var(--danger); font-weight:700; }

  #app{ display:none; } #app.unlocked{ display:block; }

  header{ position:sticky; top:0; z-index:10; background:linear-gradient(180deg,rgba(150,115,58,0.96),rgba(107,82,42,0.98)),var(--header-photo,none); background-size:cover; background-position:center; color:var(--cream); padding:12px; border-bottom:4px solid var(--gold-dark); }
  .header-top{ display:flex; justify-content:space-between; align-items:center; }
  .brand{ display:flex; align-items:center; gap:8px; }
  .coin-icon{ width:30px; height:30px; flex-shrink:0; }
  header .eyebrow{ font-size:22px; letter-spacing:2px; opacity:0.98; margin-bottom:4px; font-family:"Press Start 2P",monospace; color:#fff3d6; text-shadow:2px 2px 0 rgba(0,0,0,0.35); }
  header h1{ margin:0; font-size:14px; line-height:1.5; color:var(--cream-dark); }
  .icon-btn{ width:42px; height:42px; background:var(--gold); color:var(--ink); border-color:#fbe6ae var(--gold-dark) var(--gold-dark) #fbe6ae; border-style:solid; border-width:3px; border-radius:4px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:19px; }

  .player-strip{ display:flex; gap:8px; margin-top:10px; }
  .player-card{ flex:1; border-radius:6px; padding:8px 6px; text-align:center; border:3px solid var(--frame-color, rgba(255,255,255,0.3)); background:var(--frame-bg, rgba(0,0,0,0.25)); }
  .player-title{ font-size:10px; margin-bottom:4px; min-height:13px; font-weight:700; text-shadow:1px 1px 0 rgba(0,0,0,0.6); }
  .portrait-wrap{ width:54px; height:54px; margin:0 auto 4px; overflow:hidden; border-radius:6px; background:rgba(255,255,255,0.15); display:flex; align-items:center; justify-content:center; }
  .portrait-wrap img{ width:100%; height:100%; object-fit:contain; }
  .player-name{ font-size:13px; font-weight:700; margin-bottom:3px; }
  .player-amt{ font-family:"Press Start 2P",monospace; font-size:12px; color:#fff3d6; text-shadow:1px 1px 0 rgba(0,0,0,0.6); }
  .player-amt-label{ font-size:10px; opacity:0.9; margin-top:4px; }

  main{ max-width:480px; margin:0 auto; padding:16px 12px; }
  .card{ background:var(--card); border-color:var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light); border-style:solid; border-width:3px; border-radius:4px; padding:16px; margin-bottom:14px; }
  .card h2{ margin:0 0 14px; font-size:15px; display:flex; align-items:center; gap:9px; }
  .card h2 .idx{ font-size:16px; background:var(--gold-dark); color:#fff; width:28px; height:28px; border-radius:5px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

  /* ---------- 人物頁籤：專屬銀行場景背景 ---------- */
  #view-character{ margin:-16px -12px 0; padding:0 0 16px; position:relative; overflow:hidden; }
  .bank-scene{ position:relative; background:linear-gradient(180deg,#dcd0ae 0%, #cabb90 100%); padding:18px 12px 0; overflow:hidden; }
  .bank-scene .bank-img{ display:block; width:100%; max-width:420px; margin:0 auto; image-rendering:pixelated; }
  .bank-scene .decor{ position:absolute; image-rendering:pixelated; }
  .sparkle{ animation: sparkle 1.8s steps(1) infinite; }
  @keyframes sparkle{ 0%,60%{opacity:1;} 30%{opacity:0.35;} 100%{opacity:1;} }
  .character-stage{ position:relative; display:flex; gap:6px; justify-content:center; padding:10px 12px 6px; z-index:2; }
  .character-slot{ flex:1; max-width:210px; display:flex; flex-direction:column; align-items:center; border-radius:10px; border:4px solid var(--frame-color, var(--gold)); background:var(--frame-bg, rgba(255,255,255,0.55)); padding:10px 6px 8px; }
  .character-slot .avatar-wrap{ width:100%; max-width:170px; animation: breathe 3.6s ease-in-out infinite; }
  .character-slot .avatar-wrap img{ width:100%; height:auto; display:block; }
  @keyframes breathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.035); } }
  .character-slot .cname{ margin-top:6px; font-size:16px; font-weight:700; color:var(--ink); }
  .character-slot .ctitle{ margin-top:3px; font-size:19px; font-weight:700; text-align:center; line-height:1.3; }
  .character-ground{ height:14px; background:linear-gradient(180deg,#b3a074,#8f7d54); position:relative; z-index:2; }

  .mode-switch{ display:flex; gap:6px; margin-bottom:16px; }
  .mode-switch button{ flex:1; padding:12px 4px; font-size:14px; font-weight:700; cursor:pointer; background:var(--panel); color:var(--ink-soft); border-radius:4px; border-color:var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light); border-style:solid; border-width:2px; font-family:"DotGothic16",sans-serif; display:flex; align-items:center; justify-content:center; gap:6px; }
  .mode-switch button.active{ background:var(--teal); color:#fff; border-color:#8fc0ab var(--teal-dark) var(--teal-dark) #8fc0ab; }

  label{ display:flex; align-items:center; gap:6px; font-size:14px; color:var(--ink-soft); margin:14px 0 5px; font-weight:700; }
  label:first-of-type{ margin-top:0; }
  input,select{ width:100%; padding:12px; font-size:16px; border-radius:4px; border-color:var(--panel-dark) var(--panel-light) var(--panel-light) var(--panel-dark); border-style:solid; border-width:2px; background:#fffdf5; color:var(--ink); font-family:"DotGothic16",sans-serif; }
  select{ appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%); background-position:calc(100% - 18px) center,calc(100% - 13px) center; background-size:5px 5px,5px 5px; background-repeat:no-repeat; }
  input:focus,select:focus{ outline:2px solid var(--teal); }
  input:disabled{ opacity:0.5; background:#eee; }

  button.primary{ width:100%; margin-top:16px; padding:15px; font-size:15px; font-weight:700; border-radius:4px; background:var(--teal); color:#fff; cursor:pointer; font-family:"DotGothic16",sans-serif; border-color:#8fc0ab var(--teal-dark) var(--teal-dark) #8fc0ab; border-style:solid; border-width:3px; box-shadow:0 3px 0 rgba(0,0,0,0.25); display:flex; align-items:center; justify-content:center; gap:8px; }
  button.primary:active{ transform:translateY(2px); box-shadow:none; }
  button.primary:disabled{ opacity:0.45; }
  button.primary.repay-mode{ background:var(--gold); border-color:#fbe6ae var(--gold-dark) var(--gold-dark) #fbe6ae; color:var(--ink); }
  button.secondary{ width:100%; margin-top:10px; padding:13px; font-size:14px; font-weight:700; border-radius:4px; background:var(--panel); color:var(--danger); cursor:pointer; border-color:var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light); border-style:solid; border-width:2px; }
  button.ghost{ width:100%; margin-top:8px; padding:11px; background:none; color:var(--ink-soft); font-size:13px; font-weight:700; border:none; cursor:pointer; }
  button.logout-in-menu{ width:100%; margin-top:18px; padding:13px; background:var(--danger); color:#fff; font-size:14px; font-weight:700; border-radius:4px; cursor:pointer; border-color:#e2897c var(--danger-dark) var(--danger-dark) #e2897c; border-style:solid; border-width:2px; display:flex; align-items:center; justify-content:center; gap:8px; }

  .status{ font-size:13px; margin-top:10px; min-height:16px; font-weight:700; }
  .status.error{ color:var(--danger); }
  .status.ok{ color:var(--teal-dark); }

  .month-block{ margin-bottom:16px; }
  .month-head{ display:flex; justify-content:space-between; align-items:baseline; font-size:13.5px; font-weight:700; border-bottom:2px dashed var(--panel-dark); padding-bottom:8px; margin-bottom:8px; }
  .person-row{ display:flex; justify-content:space-between; font-size:14px; padding:4px 0; color:var(--ink-soft); }
  .person-row .amt{ font-variant-numeric:tabular-nums; color:var(--ink); font-weight:700; }
  .items{ margin:6px 0 8px; padding-left:0; list-style:none; }
  .items li{ display:flex; justify-content:space-between; font-size:13.5px; align-items:center; padding:8px 8px 8px 10px; color:var(--ink-soft); border-left:3px solid var(--panel-dark); cursor:pointer; margin-bottom:4px; background:rgba(255,255,255,0.5); border-radius:3px; }
  .items li:active{ background:rgba(255,255,255,0.85); }
  .items li.repayment{ border-left-color:var(--gold); }
  .items li .tag{ font-size:10px; padding:2px 6px; margin-right:5px; background:var(--gold); color:var(--ink); font-weight:700; border-radius:3px; }
  .items li .date{ color:#96876a; margin-right:6px; font-variant-numeric:tabular-nums; }

  .empty{ font-size:14px; color:var(--ink-soft); text-align:center; padding:30px 0; font-weight:700; }
  .skeleton-line{ height:14px; margin-bottom:10px; border-radius:3px; background:linear-gradient(90deg,var(--panel-dark) 25%,var(--panel-light) 37%,var(--panel-dark) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; }
  @keyframes shimmer{ 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }

  canvas.chart{ max-height:280px; }

  .sub-tabs{ display:flex; gap:6px; margin-bottom:16px; }
  .sub-tabs button{ flex:1; padding:11px 2px; font-size:13px; font-weight:700; cursor:pointer; border-radius:4px; background:var(--panel); color:var(--ink-soft); border-color:var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light); border-style:solid; border-width:2px; font-family:"DotGothic16",sans-serif; }
  .sub-tabs button.active{ background:var(--gold-dark); color:#fff; }
  .sub-view{ display:none; } .sub-view.active{ display:block; }

  .person-select-row{ display:flex; gap:6px; margin-bottom:14px; }
  .person-select-row button{ flex:1; padding:10px 4px; font-size:14px; font-weight:700; cursor:pointer; border-radius:4px; background:var(--panel); color:var(--ink-soft); border-color:var(--panel-light) var(--panel-dark) var(--panel-dark) var(--panel-light); border-style:solid; border-width:2px; }
  .person-select-row button.active{ background:var(--teal); color:#fff; }

  .title-list{ display:flex; flex-direction:column; gap:8px; }
  .title-row{ display:flex; align-items:center; gap:10px; padding:12px; background:rgba(255,255,255,0.55); border:2px solid var(--panel-dark); border-radius:4px; border-left-width:6px; }
  .title-row.locked{ opacity:0.4; }
  .title-check{ width:22px; height:22px; border:2px solid var(--ink-soft); border-radius:4px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:13px; cursor:pointer; background:#fff; }
  .title-check.checked{ background:var(--gold); border-color:var(--gold-dark); }
  .title-info .name{ font-size:14.5px; font-weight:700; }
  .title-info .req{ font-size:12px; color:var(--ink-soft); }

  .level-box{ background:rgba(255,255,255,0.55); border:2px solid var(--panel-dark); border-radius:4px; padding:18px; text-align:center; margin-bottom:14px; }
  .level-num{ font-family:"Press Start 2P",monospace; font-size:26px; color:var(--gold-dark); margin-bottom:4px; }
  .level-stage{ font-size:13px; color:var(--ink-soft); margin-bottom:10px; font-weight:700; }
  .xp-bar-outer{ height:20px; background:var(--panel-dark); border:2px solid var(--ink); border-radius:4px; overflow:hidden; }
  .xp-bar-inner{ height:100%; background:repeating-linear-gradient(90deg,var(--gold) 0 8px,var(--gold-dark) 8px 16px); }
  .xp-label{ font-size:12.5px; color:var(--ink-soft); margin-top:8px; font-weight:700; }

  .equip-preview{ text-align:center; margin-bottom:16px; }
  .equip-preview .avatar-wrap{ width:150px; margin:0 auto; }
  .equip-preview .avatar-wrap img{ width:100%; height:auto; }
  .equip-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .equip-slot{ background:rgba(255,255,255,0.55); border:2px solid var(--panel-dark); border-radius:4px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; padding:10px 4px; cursor:pointer; position:relative; }
  .equip-slot.locked{ opacity:0.4; cursor:default; }
  .equip-slot.equipped{ border-color:var(--gold); background:rgba(201,161,90,0.28); }
  .equip-icon{ width:32px; height:32px; }
  .equip-name{ font-size:12px; font-weight:700; }
  .equip-req{ font-size:10.5px; color:var(--ink-soft); text-align:center; }
  .equip-check{ position:absolute; top:3px; right:5px; font-size:13px; color:var(--teal-dark); }
  .equip-all-btn{ width:100%; margin-bottom:14px; padding:12px; font-size:13.5px; font-weight:700; background:var(--gold); color:var(--ink); border-radius:4px; border-color:#fbe6ae var(--gold-dark) var(--gold-dark) #fbe6ae; border-style:solid; border-width:2px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }

  .glow-check-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:6px; }
  .glow-check{ display:flex; flex-direction:column; align-items:center; gap:4px; padding:8px 2px; border:2px solid var(--panel-dark); border-radius:4px; cursor:pointer; background:rgba(255,255,255,0.5); }
  .glow-check.locked{ opacity:0.35; cursor:default; }
  .glow-check.on{ border-color:var(--ink); }
  .glow-check .dot{ width:16px; height:16px; border-radius:50%; border:2px solid var(--ink); }
  .glow-check .lbl{ font-size:9.5px; font-weight:700; }

  nav.tabs{ position:fixed; bottom:0; left:0; right:0; z-index:10; display:flex; background:var(--panel); border-top:3px solid var(--panel-dark); }
  nav.tabs button{ flex:1; padding:10px 1px 9px; background:none; border:none; font-size:10.5px; color:var(--ink-soft); cursor:pointer; font-family:"DotGothic16",sans-serif; font-weight:700; }
  nav.tabs button svg{ display:block; margin:0 auto 3px; width:20px; height:20px; }
  nav.tabs button.active{ color:var(--gold-dark); }
  nav.tabs button.active svg{ stroke:var(--gold-dark); }

  .view{ display:none; } .view.active{ display:block; }
  .setup-warning{ background:#fbe2de; color:var(--danger); border:2px solid var(--danger); border-radius:4px; padding:12px 13px; font-size:13px; margin-bottom:14px; font-weight:700; }

  .overlay{ position:fixed; inset:0; z-index:90; background:rgba(20,15,10,0.6); display:none; align-items:flex-end; justify-content:center; }
  .overlay.show{ display:flex; }
  .sheet{ background:var(--card); width:100%; max-width:480px; padding:20px 18px 26px; border-top:4px solid var(--panel-dark); border-radius:12px 12px 0 0; max-height:90vh; overflow-y:auto; }
  .sheet h3{ margin:0 0 14px; font-size:15px; }
  .edit-status{ font-size:13px; min-height:16px; margin-top:8px; font-weight:700; }

  .zodiac-badge{ display:inline-block; margin-top:8px; font-size:13px; background:var(--teal); color:#fff; padding:5px 11px; font-weight:700; border-radius:4px; }
  .profile-block{ padding:16px 0; border-bottom:3px dashed var(--panel-dark); }
  .profile-block:last-of-type{ border-bottom:none; }
  .profile-head{ display:flex; align-items:center; gap:12px; margin-bottom:6px; }
  .profile-head .avatar-wrap{ width:64px; height:86px; flex-shrink:0; }
  .profile-head .avatar-wrap img{ width:100%; height:100%; object-fit:contain; }
  .profile-head .ptitle{ font-size:15px; font-weight:700; }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  .theme-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:6px; }
  .theme-swatch{ height:36px; border-radius:4px; border:3px solid transparent; cursor:pointer; }
  .theme-swatch.selected{ border-color:var(--ink); }
</style>
</head>
<body>

<div id="lockScreen">
  <div class="lock-card bevel-out">
    <div class="lock-mark">▦</div>
    <h2>錢莊<br>請輸入密碼</h2>
    <input type="password" id="lockPassword" placeholder="密碼" />
    <button class="primary" id="lockSubmit">⚔ 進入世界</button>
    <div id="lockStatus"></div>
  </div>
</div>

<div id="app">
<header>
  <div class="header-top">
    <div class="brand">
      <svg class="coin-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#e8c06a" stroke="#7a5a25" stroke-width="1.5"/><circle cx="12" cy="12" r="7" fill="none" stroke="#7a5a25" stroke-width="1.2"/><rect x="9" y="9" width="6" height="6" fill="#7a5a25"/></svg>
      <div>
        <div class="eyebrow">錢莊</div>
        <h1>Money獵人2人組</h1>
      </div>
    </div>
    <button class="icon-btn bevel-out" id="settingsBtn" title="人員設定">⚙</button>
  </div>
  <div class="player-strip" id="playerStrip"></div>
</header>

<main>
  <div id="setupWarning" class="setup-warning" style="display:none;">⚠️ 尚未設定 Apps Script 網址，請把 CONFIG.WEB_APP_URL 換成你部署後的網址。</div>

  <section id="view-character" class="view active">
    <div class="bank-scene">
      <img class="bank-img" id="bankImg" alt="銀行" />
      <div id="bankDecor"></div>
    </div>
    <div class="character-stage" id="characterStage"></div>
    <div class="character-ground"></div>
  </section>

  <section id="view-add" class="view">
    <div class="card bevel-out">
      <h2><span class="idx">🧾</span>新增紀錄</h2>
      <div class="mode-switch">
        <button id="modeExpenseBtn" class="active">💰 支出記帳</button>
        <button id="modeRepayBtn">💵 現金入帳</button>
      </div>
      <div id="expenseFields">
        <label>🙋 記帳人員</label><select id="inputPerson"></select>
        <label>📅 日期</label><input type="date" id="inputDate" />
        <label>📝 項目名目</label><input id="inputItem" placeholder="例如：晚餐、水電費" autocomplete="off" />
        <label>💴 金額</label><input id="inputAmount" type="number" inputmode="decimal" placeholder="0" />
      </div>
      <div id="repayFields" style="display:none;">
        <label>🎁 要還給誰？</label><select id="repayPerson"><option value="">請先選擇要還給誰</option></select>
        <label>📅 日期</label><input type="date" id="repayDate" />
        <label>💴 還款金額</label><input id="repayAmount" type="number" inputmode="decimal" placeholder="請先選擇要還給誰" disabled />
        <label>📝 備註(選填)</label><input id="repayNote" placeholder="例如：發薪日撥入" autocomplete="off" />
      </div>
      <button class="primary" id="submitBtn">✔ 送出記帳</button>
      <div class="status" id="submitStatus"></div>
    </div>
  </section>

  <section id="view-ledger" class="view">
    <div class="card bevel-out">
      <h2><span class="idx">📖</span>月結明細</h2>
      <p style="font-size:13px;color:var(--ink-soft);margin:-6px 0 12px;font-weight:700;">點任一筆紀錄可以修改或刪除</p>

function outlineAndComposite(art){
  const w=art.width, h=art.height;
  const actx = art.getContext('2d');
  const img = actx.getImageData(0,0,w,h);
  const outCanvas = document.createElement('canvas'); outCanvas.width=w; outCanvas.height=h;
  const outCtx = outCanvas.getContext('2d');
  const outImg = outCtx.createImageData(w,h);
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const i=(y*w+x)*4;
    if (img.data[i+3]===0){
      let hit=false;
      for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=x+dx, ny=y+dy;
        if (nx<0||ny<0||nx>=w||ny>=h) continue;
        if (img.data[(ny*w+nx)*4+3]>0){ hit=true; break; }
      }
      if (hit){ outImg.data[i]=0x24; outImg.data[i+1]=0x1a; outImg.data[i+2]=0x10; outImg.data[i+3]=255; }
    }
  }
  outCtx.putImageData(outImg,0,0);
  const finalC = document.createElement('canvas'); finalC.width=w; finalC.height=h;
  const fctx = finalC.getContext('2d'); fctx.imageSmoothingEnabled=false;
  fctx.drawImage(outCanvas,0,0); fctx.drawImage(art,0,0);
  return finalC;
}

  // 光環(貼身輪廓向外擴散)
  const level=levelFor(cumulative);
  const maxUnlocked=Math.min(RAINBOW.length, Math.floor(level/3));
  const activeGlow=(profile.glowColors||[]).filter(i=>i<maxUnlocked);
  activeGlow.forEach((idx,i)=>{
    const pad=2+i*2.6;
    ctx.strokeStyle=RAINBOW[idx].c; ctx.lineWidth=1.4; ctx.globalAlpha=0.55-i*0.06;
    ctx.strokeRect(leg1X-pad,legY-pad,legW+pad*2,legH+pad*2);
    ctx.strokeRect(leg2X-pad,legY-pad,legW+pad*2,legH+pad*2);
    ctx.strokeRect(armLX-pad,armY-pad,armW+pad*2,armH+pad*2);
    ctx.strokeRect(armRX-pad,armY-pad,armW+pad*2,armH+pad*2);
    ctx.strokeRect(torsoX-pad,torsoY-pad,torsoW+pad*2,torsoH+pad*2);
    ctx.strokeRect(headX-pad,headY-pad,headW+pad*2,headH+pad*2);
    ctx.globalAlpha=1;
  });

  px(ctx,leg1X,legY,legW,legH,'#5a4a3a'); px(ctx,leg2X,legY,legW,legH,'#5a4a3a');
  px(ctx,leg1X,legY+legH-2,legW,2,'#2e2018'); px(ctx,leg2X,legY+legH-2,legW,2,'#2e2018');
  px(ctx,armLX,armY,armW,armH,'#b8ada0'); px(ctx,armRX,armY,armW,armH,'#b8ada0');
  px(ctx,armLX,armY+armH-3,armW,3,skin); px(ctx,armRX,armY+armH-3,armW,3,skin);
  px(ctx,torsoX,torsoY,torsoW,torsoH,'#b8ada0');
  px(ctx,torsoX,torsoY+torsoH*0.55,torsoW,torsoH*0.2,'#948a7e');
  px(ctx,headX,headY,headW,headH,skin);
  px(ctx,headX+headW-3,headY+headH*0.4,2,headH*0.2,cheek); px(ctx,headX+1,headY+headH*0.4,2,headH*0.2,cheek);
  drawHair(ctx, profile.hairstyle, profile.gender, headX,headY,headW,headH, hairColor);
  drawEyes(ctx, profile.eyeStyle, headX,headY,headW,headH);
  drawMouth(ctx, profile.mouthStyle, headX,headY,headW,headH);
  (profile.equippedItems||[]).forEach(amt=>{
    const item = EQUIPMENT_ITEMS.find(e=>e.amount===amt);
    if (item) drawEquip(ctx,item.name,b);
  });

  const composited = outlineAndComposite(art);
  return { canvas: composited, head:{headX,headY,headW,headH} };
}
function avatarDataURL(profile, cumulative, mode){
  const { canvas, head } = buildCharacterCanvas(profile, cumulative);
  if (mode==="portrait"){
    // 固定裁切畫布最上方一段(涵蓋所有年齡階段的頭髮+頭部+一點肩膀)，避免負座標裁切問題
    const cropH = Math.min(CH, Math.round(head.headY + head.headH + 8));
    const out = document.createElement('canvas'); out.width=CW; out.height=cropH;
    const octx = out.getContext('2d'); octx.imageSmoothingEnabled=false;
    octx.drawImage(canvas, 0, 0, CW, cropH, 0, 0, CW, cropH);
    return out.toDataURL();
  }
  return canvas.toDataURL();
}

const PIXEL_FONT = {
  B:["11110","10001","10001","11110","10001","10001","11110"],
  A:["01110","10001","10001","11111","10001","10001","10001"],
  N:["10001","11001","10101","10011","10001","10001","10001"],
  K:["10001","10010","10100","11000","10100","10010","10001"]
};
function drawPixelText(ctx, text, x, y, scale, color){
  let cx = x;
  for (const ch of text){
    const bmp = PIXEL_FONT[ch];
    if (bmp){
      for (let ry=0; ry<bmp.length; ry++){
        for (let rx=0; rx<bmp[ry].length; rx++){
          if (bmp[ry][rx]==="1") px(ctx, cx+rx*scale, y+ry*scale, scale, scale, color);
        }
      }
    }
    cx += 6*scale;
  }
}
function buildBankCanvas(){
  const W=64,H=64;
  const canvas=document.createElement('canvas'); canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext('2d'); ctx.imageSmoothingEnabled=false;
  const stone='#b8c4c8', stoneDark='#8a9ba0', stoneLight='#e8eef0';
  const gold='#e8c878', goldDark='#c8a050';
  const blue='#5a9fd4', blueLight='#8fc4e8', blueDark='#3d7ab0';
  const wood='#8a5a3a', woodDark='#5c3a24';
  const bx=6, by=4, bw=52;

  const roofSteps=[2,5,8,11,14,17,20,23,26];
  roofSteps.forEach((halfW,i)=>{ px(ctx,bx+26-halfW, by+i, halfW*2, 1, stone); });
  px(ctx,bx+8, by+9, bw-16, 3, stone);
  px(ctx,bx+8, by+9, bw-16, 1, stoneLight);
  px(ctx,bx+4, by+12, bw-8, 2, stoneDark);
  px(ctx,bx+9, by+14, bw-18, 9, gold);
  px(ctx,bx+9, by+14, bw-18, 2, '#f5deA0');
  px(ctx,bx+9, by+21, bw-18, 2, goldDark);
  drawPixelText(ctx, "BANK", bx+13, by+16, 1, '#5c3a10');
  px(ctx,bx+2, by+25, bw-4, 3, stone);
  px(ctx,bx+2, by+25, bw-4, 1, stoneLight);
  const cols=[bx+3, bx+11, bx+bw-16, bx+bw-8];
  cols.forEach(cx=>{
    px(ctx,cx, by+28, 5, 20, stone);
    px(ctx,cx, by+28, 2, 20, stoneLight);
    px(ctx,cx+3, by+28, 2, 20, stoneDark);
    px(ctx,cx-1, by+28, 7, 2, stoneDark);
    px(ctx,cx-1, by+46, 7, 2, stoneDark);
  });
  [bx+14, bx+bw-22].forEach(wx=>{
    px(ctx,wx, by+31, 8, 10, blueDark);
    px(ctx,wx+1, by+32, 6, 8, blue);
    px(ctx,wx+1, by+32, 3, 3, blueLight);
  });
  const doorCx=bx+Math.round(bw/2);
  px(ctx,doorCx-6, by+29, 12, 3, stone);
  px(ctx,doorCx-7, by+32, 14, 16, woodDark);
  px(ctx,doorCx-5, by+34, 10, 13, wood);
  px(ctx,doorCx-1, by+40, 2, 3, gold);
  px(ctx,doorCx-5, by+34, 1, 13, woodDark); px(ctx,doorCx+4, by+34, 1, 13, woodDark);
  px(ctx,bx-2, by+48, bw+4, 3, stone);
  px(ctx,bx-2, by+48, bw+4, 1, stoneLight);
  px(ctx,bx-4, by+51, bw+8, 3, stoneDark);
  return canvas;
}
function buildCoinDataURL(){
  const c=document.createElement('canvas'); c.width=16; c.height=16;
  const ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=false;
  const gold='#e8c878', goldDark='#c8a050';
  const rows=[4,6,7,8,8,8,7,6,4];
  rows.forEach((w,i)=>px(ctx,8-w/2,2+i,w,1,gold));
  px(ctx,7,4,2,8,goldDark);
  px(ctx,5,4,4,1,goldDark); px(ctx,5,7,4,1,goldDark); px(ctx,5,10,4,1,goldDark);
  ctx.strokeStyle='#241a10'; ctx.lineWidth=1; ctx.strokeRect(4.5,3.5,8,9);
  return c.toDataURL();
}
function buildBillDataURL(){
  const c=document.createElement('canvas'); c.width=24; c.height=14;
  const ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=false;
  px(ctx,0,0,24,14,'#8fc47a');
  px(ctx,1,1,22,12,'#a9d896');
  ctx.strokeStyle='#3d6650'; ctx.lineWidth=1; ctx.strokeRect(0.5,0.5,23,13);
  px(ctx,9,4,6,6,'#e8c878');
  ctx.strokeStyle='#5c3a10'; ctx.strokeRect(9.5,4.5,5,5);
  return c.toDataURL();
}

async function fetchJson(url, opts){
  let lastErr;
  for (let attempt=0; attempt<2; attempt++){
    try{
      const controller = new AbortController();
      const timeoutId = setTimeout(()=>controller.abort(), 10000);
      const res = await fetch(url, {...opts, signal: controller.signal});
      clearTimeout(timeoutId);
      const text = await res.text();
      try { return JSON.parse(text); }
      catch(e){ throw new Error("伺服器回應非 JSON，請確認 Apps Script 已重新部署為最新版本"); }
    } catch(err){
      if (err.name === "AbortError") lastErr = new Error("連線逾時(10秒無回應)，請確認網路連線或稍後再試");
      else lastErr = err;
      if (attempt===0) await new Promise(r=>setTimeout(r,800));
    }
  }
  throw lastErr;
}

  try{

    const json=await fetchJson(url,{method:"GET"});
    if (json.status!=="success") throw new Error(json.message||"讀取失敗");
    allRecords=json.data.map(r=>({id:r.id,timestamp:safeDate(r.timestamp),person:r.person,item:r.item,amount:Number(r.amount)||0,type:r.type||"expense"})).sort((a,b)=>a.timestamp-b.timestamp);

async function postAndReload(payload, statusEl, onSuccess){
  const btn=document.getElementById("submitBtn");
  btn.disabled=true; statusEl.textContent="送出中…"; statusEl.className="status";
  try{
    const json=await fetchJson(CONFIG.WEB_APP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:sessionKey,...payload})});
    if (json.status!=="success") throw new Error(json.message||"寫入失敗");
    statusEl.textContent="已記錄！"; statusEl.className="status ok";
    onSuccess(); await loadRecords();
  } catch(err){ statusEl.textContent="送出失敗："+err.message; statusEl.className="status error"; }
  finally{ btn.disabled=false; }
}

function groupByMonth(){
  const groups={};
  allRecords.forEach(r=>{
    const key=monthKeyOf(r.timestamp);
    if(!groups[key]) groups[key]={total:0,byPerson:{},items:[]};
    if (r.type==="expense"){ groups[key].total+=r.amount; groups[key].byPerson[r.person]=(groups[key].byPerson[r.person]||0)+r.amount; }
    groups[key].items.push(r);
  });
  return groups;
}
function renderLedger(){
  const groups=groupByMonth(); const keys=Object.keys(groups).sort().reverse();
  const body=document.getElementById("ledgerBody");
  if (keys.length===0){ body.innerHTML='<div class="empty">還沒有任何紀錄</div>'; return; }
  let html="";
  keys.forEach(key=>{
    const g=groups[key];
    const persons=Object.entries(g.byPerson).sort((a,b)=>b[1]-a[1]);
    const itemsHtml=g.items.slice().reverse().map(r=>{
      const tag=r.type==="repayment"?'<span class="tag">還款</span>':"";
      return `<li class="${r.type==="repayment"?"repayment":""}" data-id="${r.id}"><span><span class="date">${dateLabel(r.timestamp)}</span>${tag}${r.person} · ${r.item}</span><span>${fmt(r.amount)}</span></li>`;
    }).join("");
    html += `<div class="month-block"><div class="month-head"><span>${key} 月結(支出)</span><span class="amt">${fmt(g.total)}</span></div>${persons.map(([p,amt])=>`<div class="person-row"><span>${p}</span><span class="amt">${fmt(amt)}</span></div>`).join("")}<ul class="items">${itemsHtml}</ul></div>`;
  });
  body.innerHTML=html;
  body.querySelectorAll(".items li").forEach(li=>li.addEventListener("click",()=>openEdit(li.dataset.id)));
}

function renderChart(){
  const type=document.getElementById("chartType").value;
  const ctx=document.getElementById("mainChart").getContext("2d");
  const expenseRecords=allRecords.filter(r=>r.type==="expense");
  const groups={}; expenseRecords.forEach(r=>{ const k=monthKeyOf(r.timestamp); groups[k]=(groups[k]||0)+r.amount; });
  const monthKeys=Object.keys(groups).sort();
  let data;
  if (type==="pie"){
    const totals={}; expenseRecords.forEach(r=>{totals[r.person]=(totals[r.person]||0)+r.amount;});
    const labels=Object.keys(totals);
    data={ labels, datasets:[{ data:labels.map(l=>totals[l]), backgroundColor:["#c85a3f","#4d7c8a","#c9a15a","#6b4c7a","#8b2942","#2d3561"] }] };
  } else {
    data={ labels:monthKeys, datasets:[{ label:"每月支出總額", data:monthKeys.map(k=>groups[k]), borderColor:"#8a6a3f", backgroundColor: type==="bar"?"#4d7c8a":"rgba(77,124,138,0.25)", fill:type==="line", tension:0.3, pointBackgroundColor:"#c85a3f", borderWidth:2 }] };
  }
  if (chartInstance) chartInstance.destroy();
  chartInstance=new Chart(ctx,{ type: type==="pie"?"pie":type, data, options:{ responsive:true, plugins:{legend:{display:true,position:type==="pie"?"bottom":"top"}}, scales: type==="pie"?{}:{y:{beginAtZero:true}} } });
}

function renderAchievePersonRow(){
  const row=document.getElementById("achievePersonRow");
  row.innerHTML=personNames().map(name=>`<button class="${name===achievePersonName?"active":""}" data-name="${name}">${name}</button>`).join("");
  row.querySelectorAll("button").forEach(btn=>btn.addEventListener("click",()=>{ achievePersonName=btn.dataset.name; renderAchievePersonRow(); renderAchieveContent(); }));
}
function currentProfile(){ return profiles.find(p=>p.name===achievePersonName); }
function renderAchieveContent(){
  if (!achievePersonName) return;
  const cumulative=cumulativeContribution(achievePersonName);
  renderTitleList(cumulative); renderLevelBox(cumulative); renderEquipGrid(cumulative);
}
function renderTitleList(cumulative){
  const profile=currentProfile();
  document.getElementById("titleList").innerHTML = TITLE_THRESHOLDS.map(t=>{
    const unlocked=cumulative>=t.amount, isActive=profile && profile.activeTitle===t.name && unlocked;
    return `<div class="title-row ${unlocked?"":"locked"}" style="border-left-color:${t.color}; ${isActive?`background:${t.color}22;`:""}">
      <div class="title-check ${isActive?"checked":""}" data-title="${t.name}" ${unlocked?"":"style='pointer-events:none'"} style="${isActive?`background:${t.color};border-color:${t.color};`:""}">${isActive?"✓":""}</div>
      <div class="title-info"><div class="name" style="color:${unlocked?t.color:'inherit'}">${t.name}</div><div class="req">${unlocked?"已解鎖":"累積貢獻滿 "+fmt(t.amount)+" 解鎖"}</div></div>
    </div>`;
  }).join("");
  document.querySelectorAll(".title-check").forEach(el=>el.addEventListener("click",()=>toggleActiveTitle(el.dataset.title)));
}
function toggleActiveTitle(titleName){
  const profile=currentProfile(); if(!profile) return;
  const newTitle=profile.activeTitle===titleName?"":titleName;
  patchProfileLocalThenSync(profile,{activeTitle:newTitle});
}
function renderLevelBox(cumulative){
  const level=levelFor(cumulative), stage=stageFor(ageFor(cumulative));
  const cur=level*10000, next=(level+1)*10000;
  const progress=Math.min(100, Math.round(((cumulative-cur)/(next-cur))*100));
  document.getElementById("levelBox").innerHTML = `
    <div class="level-num">Lv. ${level}</div>
    <div class="level-stage">${STAGE_LABEL[stage]}(約 ${ageFor(cumulative)} 歲)</div>
    <div class="xp-bar-outer"><div class="xp-bar-inner" style="width:${progress}%"></div></div>
    <div class="xp-label">${fmt(cumulative)} / ${fmt(next)}(距離下一等級還差 ${fmt(next-cumulative)})</div>`;
}
function renderEquipGrid(cumulative){
  const profile=currentProfile();
  const unlocked=unlockedEquipmentThresholds(cumulative), equipped=(profile&&profile.equippedItems)||[], nextItem=nextEquipmentItem(cumulative);
  document.getElementById("equipPreviewAvatar").innerHTML = profile ? `<img class="pixel" src="${avatarDataURL(profile, cumulative, 'full')}" />` : "";
  let html = EQUIPMENT_ITEMS.filter(i=>unlocked.includes(i.amount)).map(item=>{
    const isEquipped=equipped.includes(item.amount);
    return `<div class="equip-slot ${isEquipped?"equipped":""}" data-threshold="${item.amount}">
      <img class="equip-icon pixel" src="${equipIconDataURL(item.name, item.color)}" />
      <div class="equip-name">${item.name}</div><div class="equip-req">滿 ${fmt(item.amount)}</div>
      ${isEquipped?'<div class="equip-check">✓</div>':""}
    </div>`;
  }).join("");
  if (nextItem){ html += `<div class="equip-slot locked"><img class="equip-icon pixel" src="${equipIconDataURL(nextItem.name,"#999")}" /><div class="equip-name">${nextItem.name}</div><div class="equip-req">滿 ${fmt(nextItem.amount)} 解鎖</div></div>`; }
  document.getElementById("equipGrid").innerHTML = html;
  document.querySelectorAll(".equip-slot[data-threshold]").forEach(el=>el.addEventListener("click",()=>toggleEquip(Number(el.dataset.threshold))));
}
function toggleEquip(threshold){
  const profile=currentProfile(); if(!profile) return;
  const current=profile.equippedItems||[];
  const newList = current.includes(threshold) ? current.filter(t=>t!==threshold) : [...current, threshold];
  patchProfileLocalThenSync(profile,{equippedItems:newList});
}
document.getElementById("equipAllBtn").addEventListener("click", ()=>{
  const profile=currentProfile(); if(!profile) return;
  const cumulative=cumulativeContribution(achievePersonName);
  patchProfileLocalThenSync(profile,{equippedItems:unlockedEquipmentThresholds(cumulative)});
});

function patchProfileLocalThenSync(profile, patch){
  const idx=profiles.findIndex(p=>p.slot===profile.slot);
  const updated={...profile, ...patch};
  if (idx!==-1) profiles[idx]=updated;
  renderPlayerStrip(); renderCharacterStage(); renderAchieveContent();

  fetchJson(CONFIG.WEB_APP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({key:sessionKey,action:"updateProfile",slot:profile.slot,name:updated.name,
      birthdate:updated.birthdate||"",gender:updated.gender||"",equippedItems:updated.equippedItems||[],
      activeTitle:updated.activeTitle||"",hairstyle:updated.hairstyle||"",eyeStyle:updated.eyeStyle||"",
      faceShape:updated.faceShape||"",mouthStyle:updated.mouthStyle||"",bodyType:updated.bodyType||"",skinTone:updated.skinTone||"",
      themeColor:updated.themeColor||"",glowColors:updated.glowColors||[]})})
    .then(json=>{ if (json.status!=="success") throw new Error(json.message); })
    .catch(err=>{ alert("同步失敗，正在重新整理："+err.message); loadRecords(); });
}

function closeSettings(){ document.getElementById("settingsOverlay").classList.remove("show"); }
async function saveSettings(){
  const statusEl=document.getElementById("settingsStatus");
  statusEl.textContent="儲存中…"; statusEl.className="edit-status";
  const blocks=document.querySelectorAll("#profileForms .profile-block");
  try{
    for (const block of blocks){
      const slot=block.dataset.slot;
      const profile=profiles.find(p=>p.slot.toString()===slot.toString());
      const glowColors = (block.dataset.glow||"").split(",").filter(s=>s!=="").map(Number);
      const payload={
        key:sessionKey, action:"updateProfile", slot,
        name:block.querySelector(".f-name").value.trim(),
        birthdate:block.querySelector(".f-birthdate").value,
        gender:block.querySelector(".f-gender").value,
        hairstyle:block.querySelector(".f-hairstyle").value,
        eyeStyle:block.querySelector(".f-eyeStyle").value,
        faceShape:block.querySelector(".f-faceShape").value,
        mouthStyle:block.querySelector(".f-mouthStyle").value,
        bodyType:block.querySelector(".f-bodyType").value,
        skinTone:block.querySelector(".f-skinTone").value,
        themeColor: block.dataset.theme || profile.themeColor || "",
        glowColors: glowColors,
        equippedItems:profile.equippedItems||[],
        activeTitle:profile.activeTitle||""
      };
      if (!payload.name) throw new Error("名字不能空白");
      const json=await fetchJson(CONFIG.WEB_APP_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
      if (json.status!=="success") throw new Error(json.message);
    }
    statusEl.textContent="已儲存！"; statusEl.className="edit-status ok";
    await loadRecords();
    setTimeout(closeSettings, 500);
  } catch(err){ statusEl.textContent="儲存失敗："+err.message; statusEl.className="edit-status error"; }
}
